subject_kinds:
- id: party
  prefix: P
  title: Party
  description: A company or a public body.
- id: person
  prefix: N
  title: Person
  description: A natural person. A person is asked only what fits a person.
  asked_only: [CAS_SANCTIONS_001, CAS_PEP_001, CAS_KYC_AML_001, CAS_SOURCE_OF_FUNDS_001, CAS_LITIGATION_001,
    CAS_GUARANTOR_CAPACITY_001]
- id: facility
  prefix: L
  title: Facility
  description: A loan under review, a guarantee facility or another financing that the lender considers. Debt that already
    exists is not a facility. It is a `lends_to` link.
  shown_as: the loan under review
- id: contract
  prefix: C
  title: Contract
  description: A contract that matters for repayment.
- id: asset
  prefix: A
  title: Asset
  description: A plant, a site, a property or another asset. An asset that is part of another asset is examined with the
    whole and is asked no checks.
- id: project
  prefix: J
  title: Project
  description: A project that is financed or built.
- id: group
  prefix: G
  title: Group
  description: Parties that report or are treated together, such as a consolidated group. A group is the perimeter
    whose business and money are examined. It is not asked what is asked of a legal entity.
