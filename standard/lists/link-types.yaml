link_types:
- id: borrows
  title: Borrows under
  description: The party borrows under the facility.
  role_from: borrower
  counts_for: [facility]
- id: relies_on
  title: Relies on
  description: Repayment of the facility relies on the cash flow of this party or group, whether or not it is the
    borrower.
  role_to: repayment_source
- id: guarantees
  title: Guarantees
  description: The party guarantees the facility. A guarantee of debt that already exists is a fact about that debt's
    `lends_to` link.
  role_from: guarantor
  counts_for: [facility]
- id: sponsors
  title: Sponsors
  description: The party stands behind the borrower, or behind the project the loan pays for, as its main shareholder
    or promoter. Who is behind another project of the business is recorded with `owns`.
  role_from: sponsor
- id: owns
  title: Owns
  description: The party owns shares in another party, or owns an asset or a project. It makes its holder a shareholder,
    and is asked the checks on an owner, only where it points at a party or a group.
  role_from: shareholder
  counts_for: [party, group]
- id: controls
  title: Controls
  description: The party controls another party without owning it, for example through voting rights or management.
  role_from: controller
- id: member_of
  title: Is a member of
  description: The party belongs to a group.
- id: supplies_to
  title: Supplies to
  description: The party supplies goods or services to another party.
  role_from: supplier
- id: sells_to
  title: Sells to
  description: The party sells to another party.
  role_to: customer
- id: lends_to
  title: Lends to
  description: The party lends to another party, including loans within a group. Debt that already exists is recorded
    this way, with its terms, its security and its guarantors as facts about the link.
  role_from: lender
- id: operates
  title: Operates
  description: The party operates an asset or a project that belongs to someone else, under a contract. A company that
    runs its own plant needs no such link.
  role_from: operator
- id: builds
  title: Builds
  description: The party builds an asset or a project for someone else, under a contract.
  role_from: contractor
- id: party_to
  title: Is a party to
  description: The party is a party to a contract.
- id: secures
  title: Is security for
  description: The asset is security for the facility.
  counts_for: [facility]
- id: ranks_behind
  title: Ranks behind
  description: The facility ranks behind another facility.
- id: part_of
  title: Is part of
  description: One thing is part of another, such as a tranche of a facility or an asset of a project.
- id: supports
  title: Gives support to
  description: The party has given a support undertaking that is not a guarantee. Like a guarantor, it is examined for whether
    it can and must stand behind the loan.
  role_from: guarantor
  counts_for: [facility]
- id: completion_support
  title: Supports completion of
  description: The party supports the completion of a project or the facility that finances it. Like a guarantor, it is
    examined for whether it can and must stand behind that promise.
  role_from: guarantor
  counts_for: [facility, project]
- id: finances
  title: Pays for
  description: The facility pays for a project or an asset. The link runs from the facility to what it pays for.
  role_to: financed_project
- id: portfolio_support
  title: Supports within a portfolio
  description: One project or party supports another, for example through a cash sweep or shared reserves.
- id: other
  title: Other link
  description: Any other link. Say what it is in the reason.
