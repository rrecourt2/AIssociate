id: CAS_INPUT_CONC_001
title: Inputs and suppliers
pillar: business
claim: The party can get the inputs it cannot work without, at a price it can bear, until the loan is repaid.
due_by: diligence
applies_to: [borrower, repayment_source]
applies_when:
- {check: OBS_SECTOR_001, is: corporate}
- {check: OBS_SECTOR_001, is: project}
matters_more_when:
- {check: OBS_VALUE_CHAIN_001, is: manufacturer, reason: A manufacturer often turns one feedstock or one source of energy
    into its product}
- {check: OBS_VALUE_CHAIN_001, is: distributor, reason: A distributor lives on the right to sell the goods of one or a few
    principals}
- {check: OBS_VALUE_CHAIN_001, is: trader, reason: A trader that buys from one source has nothing to sell when that source
    stops}
look_again_when:
- {check: OBS_INPUT_005, is: true, reason: 'An interruption has happened, so its length, its cause and the protections need
    a new look'}
- {new_source: supply_agreement, reason: A new or changed supply contract changes the end date and the price terms}
checks:
- id: OBS_INPUT_001
  question: Is there one input (a feedstock, a fuel, a utility, a component or goods for resale) that the party cannot produce
    or trade without, or one supplier that provides about a fifth or more of what it buys?
  answer: yes_no
  why: 'Opens the topic. A no is not the end of it: OBS_INPUT_002 and OBS_INPUT_010 are read from the accounts whatever
    the answer here.'
  due_by: screening
  calls_for:
  - is: true
    link: [supplies_to]
    end: to
  look_in: [03.01.a, 06.04.a]
  evidence:
    best: [audited_annual_report, supply_agreement]
    supporting: [management_accounts, company_record, annual_report, prospectus]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Is there one input that your production cannot run without, such as a feedstock, a fuel or a utility? Or one supplier
    from which you buy a large part of what you need? If so, please name the input and the supplier.
  note: A fifth is a guide. The checks below call this input "the critical input".
  leads_to:
  - {indicator: CAS_SUPPLIER_LINK_001, is: true, reason: The supplier's own standing and the supply contract then need their
      own look}
  - {indicator: CAS_RATE_PRICE_RISK_001, is: true, reason: Whether a rise in the price of the input can be passed on to
      customers is asked there}
- id: OBS_INPUT_002
  question: What share of the party's cost of sales does its largest single bought-in input take?
  answer: number
  unit: percent
  why: The share says how much of the margin a rise in the price of that one input can take. A processor, a miller, a dairy
    or a trader spends most of its cost of sales on one input, and that is sound as long as it can pass a rise on. OBS_INPUT_010
    tests whether it has.
  due_by: concept
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record, financial_model, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: Which single input costs you the most, and roughly what share of your cost of sales is it?
  note: 'Take the figure from the breakdown of the cost of sales, not from what the party says. Where one input takes about
    a third of the cost of sales or more and OBS_INPUT_001 was answered no, look at that answer again: this input is then
    the critical input. A third is a guide.'
- id: OBS_INPUT_010
  question: In any of the last five financial years in which the price of the party's largest input rose by about a tenth
    or more, did its gross margin fall by about a fifth of its level or more (for example from 20 percent to 16)?
  answer: yes_no
  assumption: The party has passed on rises in the price of its largest input, so that its margin held
  disproved_by: 'yes'
  why: What matters is not how large the input is in the costs but whether the gap between the selling price and the price
    of the input holds when the input costs more.
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record, public_source, press_article, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: In which of the last five years did the price of your main input rise the most? What was your gross margin in that
    year and in the year before?
  note: A tenth and a fifth are guides. This check does not hang on OBS_INPUT_001, so that the topic cannot close on one
    answer. Take the price of the input from the party's purchase records or from a published price, and the margin from
    the accounts. Where the price did not rise by about a tenth in any of the five years, the record shows nothing either
    way. Leave the check open and say so.
- id: OBS_INPUT_003
  question: How many suppliers could deliver the critical input in the volume the party needs?
  answer: choice
  options: [single_source, dual_source, multiple, commodity_market]
  assumption: The party could replace the supplier of its critical input
  flag_when: is single_source
  why: With one source, the supplier's failure, a dispute or a broken pipeline stops production, and the supplier sets the
    price. With two or more, the party has somewhere to go.
  due_by: concept
  when:
  - {check: OBS_INPUT_001, is: true}
  look_in: [06.04.a, 01.03.a, 05.01.a]
  evidence:
    best: [supply_agreement, market_study, technical_feasibility]
    supporting: [company_record, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: Could another supplier deliver this input in the volume you need, or is there in practice only one source, such as
    one pipeline, one allocation or one licensed producer?
  if_unknown: Until it is known whether the supplier can be replaced, the loss of that supplier has to be treated as the
    loss of production.
  note: Count a supplier only if it could deliver the full volume to the party's site with the transport and the approvals
    that exist today. Choose commodity_market where the input is bought freely from many sellers at a quoted price.
- id: OBS_INPUT_004
  question: Does a government body set the price of the critical input, or decide how much of it the party receives?
  answer: yes_no
  assumption: The price and the volume of the critical input do not depend on a decision of government
  disproved_by: 'yes'
  when:
  - {check: OBS_INPUT_001, is: true}
  look_in: [06.04.a, 07.01.a, 03.01.a]
  evidence:
    best: [supply_agreement, regulatory_document, audited_annual_report]
    supporting: [company_record, management_accounts, public_source, press_article, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: Is the price of this input, or the amount you are allotted, set by a government body? For example a regulated tariff,
    a quota or a levy.
  note: A price set by the state can be low today. The test is whether a decree, a budget or a change of policy can raise
    it or cut the allocation while the loan is outstanding.
  leads_to:
  - {indicator: CAS_REGULATORY_001, is: true, reason: 'The rule that sets the price or the allocation, and how it can change,
      is examined there'}
- id: OBS_INPUT_005
  question: Has the supply of the critical input been cut, reduced or suspended in the last 24 months, even for a short
    time?
  answer: yes_no
  assumption: The critical input has reached the party without interruption over the last 24 months
  disproved_by: 'yes'
  when:
  - {check: OBS_INPUT_001, is: true}
  look_in: [03.01.a, 05.01.a]
  evidence:
    best: [audited_annual_report, technical_feasibility, regulatory_document]
    supporting: [company_record, management_accounts, board_minutes, public_source, press_article, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: Has this input been cut, reduced or suspended at any time in the last two years, even briefly? Please include partial
    cuts.
  note: The party has a reason to understate this. Compare its answer with production volumes against capacity, and with
    what the supplier or the press reported. If the search finds nothing, record what was searched, where and when.
- id: OBS_INPUT_007
  question: Is there a court case, a dispute with an authority or a regulatory proceeding, pending or threatened, that could
    change the price the party pays for the critical input or stop its supply?
  answer: yes_no
  assumption: No dispute or proceeding threatens the price or the supply of the critical input
  disproved_by: 'yes'
  when:
  - {check: OBS_INPUT_001, is: true}
  look_in: [03.01.a, 08.01.a, 07.01.a]
  evidence:
    best: [audited_annual_report, legal_opinion, regulatory_document]
    supporting: [board_minutes, company_record, public_source, press_article, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: Is there any court case, disputed levy or regulatory proceeding that affects what you pay for this input, or whether
    you receive it?
  note: If the search finds nothing, record what was searched, where and when.
  leads_to:
  - {indicator: CAS_LITIGATION_001, is: true, reason: The amount at stake and the likely outcome are examined with the party's
      other disputes}
- id: OBS_INPUT_MIT_001
  question: What limits the effect on the party of a rise in the price of the critical input?
  answer: choice
  options: [price_fixed_by_contract, price_passed_on_under_sales_contracts, hedged, none]
  many: true
  mitigant: true
  assumption: A contract or a hedge limits what a rise in the price of the critical input costs the party
  flag_when: is none
  why: With none of these, a rise in the price of the input reaches the party's margin at once and in full.
  when:
  - {check: OBS_INPUT_010, against: true}
  - {check: OBS_INPUT_004, against: true}
  look_in: [06.04.a, 06.01.a, 04.03.a]
  evidence:
    best: [supply_agreement, offtake_agreement, hedge_document]
    supporting: [company_record, material_contract]
    stated: [correspondence, call, officer_note]
  ask: 'What limits the effect of a price rise on you: a price fixed in your supply contract, sales contracts that pass
    the rise on to your customers, or a hedge?'
  note: Name only what is in a signed contract or a hedge confirmation, and say until when it runs and what share of the
    party's need it covers. A price fixed in a signed contract counts, also where the supplier is a state body. A tariff
    that an authority can change by its own decision does not. What protects the supply itself is asked in OBS_INPUT_MIT_002
    and on the link to the supplier.
- id: OBS_INPUT_MIT_002
  question: Could the party keep producing within three months of losing the critical input, by switching to another input
    or to another plant?
  answer: yes_no
  mitigant: true
  assumption: The party can keep producing without the critical input by switching within three months
  disproved_by: 'no'
  when:
  - {check: OBS_INPUT_010, against: true}
  - {check: OBS_INPUT_003, against: true}
  - {check: OBS_INPUT_004, against: true}
  - {check: OBS_INPUT_005, against: true}
  look_in: [05.01.a]
  evidence:
    best: [technical_feasibility]
    supporting: [company_record, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: If this input stopped tomorrow, could you keep producing within about three months, by switching fuel, feedstock
    or plant? Have you ever done so?
  note: 'Three months is a guide. A switch that has never been made is a plan: ask whether it has been done or tested, and
    what it costs.'
- id: OBS_INPUT_MIT_003
  question: What share of the party's operating earnings comes from operations that do not need the critical input or its
    supplier?
  answer: number
  unit: percent
  mitigant: true
  assumption: Most of the party's earnings come from operations that do not need the critical input
  flag_when: below 50
  why: 'Where less than half of the earnings comes from elsewhere, what is left when the input stops is unlikely to carry
    the party''s fixed costs and its debt service. Half is a guide: the real measure is whether the rest covers debt service.'
  when:
  - {check: OBS_INPUT_010, against: true}
  - {check: OBS_INPUT_003, against: true}
  - {check: OBS_INPUT_004, against: true}
  - {check: OBS_INPUT_005, against: true}
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, financial_model, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: Of your operating earnings, roughly what share comes from plants or business lines that do not rely on this input?
