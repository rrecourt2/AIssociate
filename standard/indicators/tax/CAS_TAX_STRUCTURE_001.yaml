id: CAS_TAX_STRUCTURE_001
title: Tax Structure
workstream: WS_TAX
due_by: diligence
applies_to: [borrower]
checks:
- id: OBS_TAX_001
  question: Is the entity's tax status and registration clearly established?
  answer: yes_no
  assumption: Entity has a clear and established tax status
  disproved_by: 'no'
  due_by: screening
  look_in: [08.01.a]
  evidence:
    best: [tax_clearance]
    supporting: [regulatory_document, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Is your entity registered with the tax authority and is its tax status clearly established? Please share
    the tax registration certificate, tax identification number (TIN), or a recent tax clearance certificate.
  if_unknown: Tax registration status not confirmed — fundamental compliance risk
- id: OBS_TAX_002
  question: Does the entity benefit from tax incentives, exemptions, or special regimes?
  answer: yes_no
  assumption: Entity operates under standard tax regime with no special incentives
  disproved_by: 'yes'
  after: [OBS_TAX_001]
  when:
  - check: OBS_TAX_001
    is: true
  evidence:
    best: [tax_clearance, regulatory_document]
    supporting: [legal_opinion, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your entity benefit from any tax incentives, exemptions, or special tax regimes? Examples include investment
    tax credits, special economic zone status, tax holidays, or sector-specific incentives.
- id: OBS_TAX_003
  question: Are there cross-border tax implications from the entity's structure or operations?
  answer: yes_no
  assumption: Entity has no cross-border tax exposure
  disproved_by: 'yes'
  after: [OBS_TAX_001]
  when:
  - check: OBS_TAX_001
    is: true
  evidence:
    best: [consultant_report, legal_opinion]
    supporting: [tax_returns, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Are there cross-border tax implications from your corporate structure or operations? This includes transfer
    pricing between related entities, withholding taxes on dividends or interest, or permanent establishment risk
    in other jurisdictions.
- id: OBS_TAX_004
  question: Are all tax returns filed and current with the tax authority?
  answer: yes_no
  assumption: All required tax returns are filed and current
  disproved_by: 'no'
  after: [OBS_TAX_001]
  when:
  - check: OBS_TAX_001
    is: true
  evidence:
    best: [tax_returns, tax_clearance]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Are all your tax returns (corporate income tax, VAT, payroll taxes) filed and up to date? A tax clearance
    certificate or confirmation from your accountant would confirm this.
  if_unknown: Tax filing status not confirmed — potential compliance exposure
- id: OBS_TAX_005
  question: Has there been a tax audit, dispute, or assessment by the tax authority in the last 3 years?
  answer: yes_no
  assumption: No tax audits or disputes in the last 3 years
  disproved_by: 'yes'
  after: [OBS_TAX_001]
  when:
  - check: OBS_TAX_001
    is: true
  evidence:
    best: [regulatory_document]
    supporting: [legal_opinion, audited_annual_report]
    stated: [correspondence, call, officer_note]
  ask: Has there been any tax audit, tax dispute, or additional tax assessment by the tax authority in the last
    3 years? Please disclose any audit findings, disputed amounts, or ongoing tax litigation.
  if_unknown: Tax audit and dispute history not disclosed — potential hidden tax liability
