id: CAS_INTERNAL_CONTROLS_001
title: Internal controls
pillar: governance
claim: No one person can move the party's money or change its books unseen.
due_by: diligence
applies_to: [borrower, repayment_source]
matters_more_when:
- {check: OBS_VALUE_CHAIN_001, is: trader, reason: 'A trader moves large sums on thin margins: one unseen payment can cost
    a year''s profit'}
- {check: OBS_LIFECYCLE_001, is: expanding, reason: A business that grows fast outgrows controls that rested on the owner
    seeing everything}
look_again_when:
- {new_source: audit_management_letter, reason: A new letter from the auditor shows which weaknesses are open now}
- {check: OBS_IC_004, is: true, reason: A failure shows that a control did not work as described}
checks:
- id: OBS_IC_001
  question: Does the party have written rules that say who may commit it, who may approve a payment and who may post to
    the books, with limits by amount?
  answer: yes_no
  assumption: The party's rules for commitments, payments and entries in the books are written down
  disproved_by: 'no'
  due_by: concept
  look_in: [02.05.a, 03.01.e]
  evidence:
    best: [corporate_governance_policy, audit_management_letter]
    supporting: [company_record, board_resolution]
    stated: [correspondence, call, analyst_note]
  ask: Do you have written rules on who may sign contracts, approve payments and make entries in the accounts, and up to
    what amount? Could we have a copy?
- id: OBS_IC_002
  question: Are ordering, approving, paying and recording done by different people, so that nobody can both make a payment
    and enter it in the books?
  answer: yes_no
  assumption: Whoever makes a payment cannot also approve it or record it
  disproved_by: 'no'
  look_in: [03.01.e, 02.05.a, 02.03.a]
  evidence:
    best: [audit_management_letter]
    supporting: [corporate_governance_policy, organizational_chart, company_record]
    stated: [correspondence, call, analyst_note]
  ask: Who orders, who approves, who pays and who books a purchase? Are these different people?
  note: Include who can change supplier bank details and who reconciles the bank accounts. In a small finance team, look
    at what the owner or an outside accountant checks each month.
- id: OBS_IC_006
  question: Does every payment above a set amount need two people to release it at the bank, with no exception for the owner
    or the chief executive?
  answer: yes_no
  assumption: No single person, the owner included, can release a large payment alone
  disproved_by: 'no'
  look_in: [03.01.e, 02.02.a, 02.05.a]
  evidence:
    best: [audit_management_letter, board_resolution]
    supporting: [corporate_governance_policy, company_record, bank_statement]
    stated: [correspondence, call, analyst_note]
  ask: Above what amount does a payment need two signatures? Is there anyone who can sign alone without limit?
  note: 'Record the amount. Ask for the bank''s list of signatories: it shows what the bank will accept, which may differ
    from what the rules say.'
- id: OBS_IC_003
  question: 'Does someone who does not report to the head of finance check at least once a year that the controls work:
    an internal auditor, an outside firm or an audit committee?'
  answer: yes_no
  assumption: Someone independent of the finance function checks that the controls work
  disproved_by: 'no'
  look_in: [03.01.e, 02.02.a, 02.03.a]
  evidence:
    best: [audit_management_letter, audited_annual_report]
    supporting: [board_minutes, organizational_chart, corporate_governance_policy, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Do you have an internal audit, in-house or by an outside firm? To whom does it report, and could we see its last
    report?
- id: OBS_IC_004
  question: In the last three years, has the party had a fraud, an unauthorised payment, or an unexplained loss of cash
    or stock?
  answer: yes_no
  assumption: 'The controls have held: no fraud, unauthorised payment or unexplained loss in the last three years'
  disproved_by: 'yes'
  look_in: [03.01.e, 03.01.a, 02.02.a]
  evidence:
    best: [audit_management_letter, audited_annual_report]
    supporting: [board_minutes, company_record, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: In the last three years, has there been a fraud, a payment nobody had approved, or a loss of cash or stock you could
    not explain? Please include cases that are settled.
  if_unknown: If neither the auditor's letters nor the board minutes have been seen, the party's no is its own word.
  note: A party that says yes is believed.
- id: OBS_IC_005
  question: Does the auditor's latest management letter, or the latest internal audit report, list weaknesses in the controls
    over cash, payments or the books that are still open?
  answer: yes_no
  assumption: The weaknesses the auditors found in the controls over money and the books are closed
  disproved_by: 'yes'
  look_in: [03.01.e, 02.02.a]
  evidence:
    best: [audit_management_letter]
    supporting: [board_minutes, company_record]
    stated: [correspondence, call, analyst_note]
  ask: Could we have the auditor's last two management letters, with your replies?
  if_unknown: If no management letter has been seen, ask the auditor whether one was issued. That none was issued is an
    answer. That none was shown is not.
  note: A point that comes back in two letters running is open, whatever the reply says.
- id: OBS_IC_007
  question: Has the cause of the failure been found and the control changed, and has the auditor or a later internal audit
    confirmed that the change works?
  answer: yes_no
  mitigant: true
  assumption: The gap behind the failure is closed, and someone independent has confirmed it
  disproved_by: 'no'
  when:
  - {check: OBS_IC_004, against: true}
  look_in: [03.01.e, 02.02.a]
  evidence:
    best: [audit_management_letter, consultant_report]
    supporting: [board_minutes, company_record]
    stated: [correspondence, call, analyst_note]
  note: That the person involved has left does not close the gap. The control has to be different.
