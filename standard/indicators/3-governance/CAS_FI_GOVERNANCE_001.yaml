id: CAS_FI_GOVERNANCE_001
title: 'Bank: supervision and governance'
pillar: governance
claim: The supervisor has no open concern about the institution, and its own risk control is independent of the people who
  make the loans and of those who own it.
due_by: diligence
applies_to: [borrower, repayment_source]
applies_when:
- {check: OBS_SECTOR_001, is: financial_institution}
matters_more_when:
- {check: OBS_BORROWER_003, is: true, reason: A bank that belongs to a group is under pressure to lend to its sister companies}
- {check: OBS_LIFECYCLE_001, is: distressed, reason: A supervisor usually acts before the accounts show the trouble}
look_again_when:
- {new_source: regulatory_document, reason: 'A new letter, inspection report or order from the supervisor changes where
    the institution stands with it'}
- {new_source: audited_annual_report, reason: The related-party note and the auditor's remarks show insider lending at a
    new date}
checks:
- id: OBS_FIG_001
  question: What is the institution's standing with its prudential supervisor today?
  answer: choice
  options: [normal, enhanced_monitoring, corrective_action, conservatorship, not_supervised]
  assumption: The supervisor has placed no special measure on the institution
  flag_when: is enhanced_monitoring or corrective_action or conservatorship
  why: Each of the three means that the supervisor has seen something it does not accept. It has ordered closer reporting,
    imposed a plan with deadlines, or put its own people in charge. A supervisor sees figures that a lender does not, and
    it usually acts before the accounts show the trouble. An institution without a supervisor is not flagged, but nobody
    inspects it on the lender's behalf.
  due_by: screening
  look_in: [07.01.a, 02.02.a]
  evidence:
    best: [regulatory_document]
    supporting: [board_minutes, credit_rating_report, public_source, press_article]
    stated: [correspondence, call, officer_note]
  ask: Where do you stand with your supervisor today? Are you under ordinary supervision, or has the supervisor asked for
    closer reporting, agreed a corrective plan with you, or taken any other special measure?
  note: 'The options: normal is ordinary supervision with no special measure. enhanced_monitoring is more frequent reporting
    or inspection ordered for this institution. corrective_action is a plan with deadlines, agreed with the supervisor or
    imposed by it. conservatorship means the supervisor or its appointee runs the institution. not_supervised means there
    is no prudential supervisor, as for some microfinance and leasing companies. An institution under a measure may not
    be free to say so. Search the supervisor''s published decisions as well. If the search finds nothing, record what was
    searched, where and when.'
  leads_to:
  - {indicator: CAS_REGULATORY_001, is: not_supervised, reason: 'An institution outside prudential supervision still needs
      a licence to lend, and that indicator asks whether it holds one'}
- id: OBS_FIG_002
  question: In the last three years, has the supervisor (or, where there is none, the licensing authority) fined the institution,
    restricted its business, or ordered it in writing to correct a breach of the rules on capital, liquidity, lending limits,
    provisioning or money-laundering controls?
  answer: yes_no
  assumption: In the last three years the supervisor has found no breach that it met with a fine, a restriction or a written
    order
  disproved_by: 'yes'
  due_by: concept
  look_in: [07.01.a, 02.02.a, 03.01.e]
  evidence:
    best: [regulatory_document]
    supporting: [audited_annual_report, board_minutes, audit_management_letter, public_source, press_article]
    stated: [correspondence, call, officer_note]
  ask: In the last three years, has your supervisor fined you, limited what you may do, or written to you with an order
    to correct something? If so, what was it about, and is it closed?
  note: Remarks in a routine inspection that carry no deadline and no penalty are not meant. Ask for the last inspection
    report and the institution's reply to it. If a search of the supervisor's published decisions finds nothing, record
    what was searched, where and when.
- id: OBS_FIG_003
  question: Do the institution's loans and guarantees to its shareholders, directors and managers, and to parties connected
    with them, exceed the limit its regulator sets for such lending?
  answer: yes_no
  assumption: Lending to insiders stays within the limit the regulator sets
  disproved_by: 'yes'
  look_in: [03.01.a, 07.01.a, 03.01.e]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [company_record, board_minutes, audit_management_letter, annual_report, prospectus]
    stated: [correspondence, call, officer_note]
  ask: How much have you lent to your shareholders, directors and managers, and to companies connected with them? What limit
    does your regulator set, and how do you decide who is connected?
  note: Where no regulatory limit applies, take a tenth of the institution's capital as a guide and say so. The related-party
    note in the audited accounts gives the total. Ask how the institution decides who is connected, because a narrow definition
    keeps the figure low. Whether insiders borrow on easier terms than others is asked in Related parties.
  leads_to:
  - {indicator: CAS_RELATED_PARTY_001, is: true, reason: 'Lending to insiders above the limit takes value out of the institution,
      and that indicator asks on what terms and whether it can be called back'}
- id: OBS_FIG_004
  question: Does a risk committee of the board meet at least once a quarter and keep minutes, and does the head of risk
    report to it directly, not through the people who make the loans?
  answer: yes_no
  assumption: Risk is overseen at board level, apart from the people who make the loans
  disproved_by: 'no'
  look_in: [02.02.a, 02.05.a, 07.01.a]
  evidence:
    best: [regulatory_document, audit_management_letter]
    supporting: [board_minutes, corporate_governance_policy, board_composition, organizational_chart]
    stated: [management_presentation, call, officer_note]
  ask: Do you have a risk committee of the board? How often did it meet last year, and to whom does your head of risk report?
  note: A charter alone is not enough. Read the minutes of the last four meetings for who attended, what was reported and
    what was decided. In a small institution the whole board may do this work. Then answer for the board, and say so.
- id: OBS_FIG_006
  question: Can a shareholder, a director or the chief executive approve a loan alone, or overturn a refusal by the credit
    committee or the risk function?
  answer: yes_no
  assumption: No single person can push a loan through against the credit process
  disproved_by: 'yes'
  look_in: [02.05.a, 07.01.a, 03.01.e]
  evidence:
    best: [regulatory_document, audit_management_letter]
    supporting: [corporate_governance_policy, company_record, board_minutes]
    stated: [call, officer_note]
  ask: Who can approve a loan, and up to what amount? In the last two years, was any loan approved although the risk function
    had advised against it?
  note: Read the approval limits in the credit policy, then test them against practice. Ask for the loans of the last two
    years that were approved against the opinion of the risk function, and who signed them. Approval of large loans by the
    board as a body is normal. What is meant is one person deciding.
- id: OBS_FIG_MIT_001
  question: Has the supervisor confirmed in writing that the measure is lifted or the finding closed, or that the institution
    is meeting each deadline of the agreed plan?
  answer: yes_no
  mitigant: true
  assumption: The supervisor has confirmed that its concern is resolved, or is being resolved on schedule
  disproved_by: 'no'
  when:
  - {check: OBS_FIG_001, against: true}
  - {check: OBS_FIG_002, against: true}
  look_in: [07.01.a, 02.02.a]
  evidence:
    best: [regulatory_document]
    supporting: [board_minutes, company_record]
    stated: [correspondence, call, officer_note]
  note: The confirmation must come from the supervisor. The institution's own account of it is not a confirmation.
