id: CAS_SOCIAL_001
title: Social Impact & Labor
workstream: WS_ES
due_by: diligence
applies_to: [borrower]
checks:
- id: OBS_SOC_001
  question: Does the entity comply with applicable labor laws and employment standards?
  answer: yes_no
  assumption: Entity is in compliance with labor laws
  disproved_by: 'no'
  due_by: screening
  look_in: [05.02.a]
  evidence:
    best: [corporate_governance_policy, regulatory_document]
    supporting: [internal_memo, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Does your entity comply with local labor laws and employment standards? This includes employment contracts,
    minimum wage, working hours, and occupational health and safety. HR policies, labor inspection reports, or a
    brief confirmation would be helpful.
- id: OBS_SOC_002
  question: Are there community impact concerns related to the entity's operations?
  answer: yes_no
  assumption: No material community impact concerns exist
  disproved_by: 'yes'
  after: [OBS_SOC_001]
  evidence:
    best: [esia_report, stakeholder_engagement_plan]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Are there any community impact concerns related to your operations? This could include land acquisition,
    resettlement, noise, traffic, or effects on local livelihoods. Stakeholder consultation records or the social
    chapter of an ESIA would be relevant.
  if_unknown: Community impact not assessed — social licence risk
- id: OBS_SOC_003
  question: Is there a grievance mechanism accessible to workers and affected communities?
  answer: yes_no
  assumption: A functional grievance mechanism is in place
  disproved_by: 'no'
  after: [OBS_SOC_001]
  evidence:
    best: [corporate_governance_policy, grievance_mechanism]
    supporting: [internal_memo, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Does your entity have a grievance mechanism for workers and affected communities? This could be a formal
    complaints procedure, whistleblower hotline, or community feedback mechanism. A description of the process or
    a copy of the policy would help.
- id: OBS_SOC_004
  question: Has there been any labor dispute, workplace incident, or regulatory action in the last 3 years?
  answer: yes_no
  assumption: No labor disputes or workplace incidents in the last 3 years
  disproved_by: 'yes'
  after: [OBS_SOC_001]
  evidence:
    best: [regulatory_document, company_record]
    supporting: [internal_memo, legal_opinion]
    stated: [correspondence, call, officer_note]
  ask: Have there been any labor disputes, significant workplace incidents, or regulatory actions (fines, inspections,
    enforcement) in the last 3 years? Please disclose any strikes, tribunal cases, workplace injuries, or labor
    authority findings.
  if_unknown: Labor dispute and incident history not disclosed
