id: CAS_ENVIRONMENTAL_001
title: Environmental Impact
workstream: WS_ES
due_by: diligence
applies_to: [borrower]
why_it_matters:
  debt: Environmental liabilities can be material and difficult to quantify
  equity: Strong environmental credentials command green premium and wider investor universe
matters_more_when:
- check: OBS_ESG_MANDATE_001
  is: dfi_impact
  reason: DFI mandate — environmental safeguards and impact measurement essential
- check: OBS_LIFECYCLE_001
  is: greenfield
  reason: Greenfield — environmental impact assessment is typically a regulatory requirement
- check: OBS_SECTOR_001
  is: infrastructure
  reason: Infrastructure projects typically require environmental permits
matters_less_when:
- check: OBS_ESG_MANDATE_001
  is: none
  reason: No ESG mandate — environmental analysis limited to regulatory compliance
checks:
- id: OBS_ENV_001
  question: Has an environmental impact assessment been conducted?
  answer: yes_no
  assumption: Environmental impact has been formally assessed
  disproved_by: 'no'
  due_by: screening
  look_in: [05.01.a]
  evidence:
    best: [esia_report, operational_license]
    supporting: [consultant_report, regulatory_document]
    stated: [correspondence, call, officer_note]
  ask: Has an Environmental Impact Assessment (EIA) or Environmental and Social Impact Assessment (ESIA) been conducted?
    A copy of the report, the EIA certificate, or the environmental permit would be ideal.
  if_unknown: Environmental impact status unknown — regulatory and liability risk
- id: OBS_ENV_002
  question: Are there identified environmental liabilities or contamination issues?
  answer: yes_no
  assumption: No material environmental liabilities exist
  disproved_by: 'yes'
  after: [OBS_ENV_001]
  when:
  - check: OBS_ENV_001
    is: true
  evidence:
    best: [esia_report]
    supporting: [consultant_report, audited_annual_report]
    stated: [correspondence, call, officer_note]
  ask: Are there any known environmental liabilities, contamination issues, or remediation obligations? This includes
    soil or water contamination, hazardous waste, or environmental provisions in your accounts.
  if_unknown: Environmental liability status not confirmed — potential hidden exposure
- id: OBS_ENV_003
  question: Does the entity comply with local environmental regulations and hold required permits?
  answer: yes_no
  assumption: Entity is in compliance with environmental regulations
  disproved_by: 'no'
  after: [OBS_ENV_001]
  evidence:
    best: [operational_license, regulatory_document]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your entity hold all required environmental permits and comply with local environmental regulations?
    Please share copies of permits, compliance certificates, or confirmation of regulatory status.
- id: OBS_ENV_004
  question: Are there GHG emission reporting requirements applicable to the entity?
  answer: yes_no
  assumption: Entity has no GHG reporting obligations
  disproved_by: 'yes'
  after: [OBS_ENV_001]
  when:
  - check: OBS_ENV_001
    is: true
  evidence:
    best: [esms_policy, regulatory_document]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Is your entity required to report greenhouse gas emissions — either by regulation or voluntary commitment?
    If you produce a sustainability report or carbon disclosure, please share it.
- id: OBS_ENV_005
  question: Has a climate risk assessment been conducted covering physical and transition risks?
  answer: yes_no
  assumption: Climate risks have been formally assessed
  disproved_by: 'no'
  after: [OBS_ENV_001]
  when:
  - check: OBS_ENV_001
    is: true
  evidence:
    best: [esia_report, esms_policy]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Has your entity conducted a climate risk assessment? This could cover physical risks (flooding, drought,
    extreme weather) and transition risks (regulatory changes, carbon pricing, technology shifts). A TCFD disclosure
    or scenario analysis would be ideal.
  if_unknown: Climate risk exposure not assessed — emerging regulatory and physical risk
