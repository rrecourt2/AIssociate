id: CAS_OTHER_LENDERS_001
title: Other lenders
pillar: links
claim: The other lender cannot take the party's cash or assets ahead of the lender, or call its loan and bring the party
  down, without the lender having a say.
due_by: diligence
applies_to: [lends_to, ranks_behind]
matters_more_when:
- {check: OBS_INVESTOR_ROLE_001, is: subordinated, reason: 'The lender has agreed to rank behind, so what the senior lender
    may do decides what is left'}
- {check: OBS_COLLATERAL_001, is: unsecured, reason: Without security the lender stands behind every lender that holds some}
- {check: OBS_BORROWER_001, is: holding_company, reason: Lenders to the operating companies are paid from their assets before
    a lender to their owner}
look_again_when:
- {new_source: debt_schedule, reason: 'A new debt schedule can show a new loan, a new maturity or new security'}
- {new_source: intercreditor_agreement, reason: 'A new draft can change the vote, the standstill or the order of payment'}
- {new_source: registry_extract, reason: A new search can show a charge that was not there before}
checks:
- id: OBS_LENDER_001
  question: Security aside, would the lender's claim be paid ahead of, beside or behind the other loan if the party became
    insolvent?
  answer: choice
  settled_by: terms
  options: [ahead, beside, behind]
  assumption: The lender's claim is paid no later than the other loan
  flag_when: is behind
  why: A lender that ranks behind is paid only from what is left once the other loan is repaid in full. Ranking beside shares
    a loss in proportion, which is the usual place of a senior lender, so only 'behind' is flagged.
  due_by: concept
  look_in: [04.02.c, 04.01.b, 04.03.a]
  evidence:
    best: [intercreditor_agreement, facility_agreement, legal_opinion]
    supporting: [term_sheet, debt_schedule, organizational_chart]
    stated: [correspondence, call, analyst_note]
  ask: 'If the company could not pay everyone, who would be paid first: us, this other lender, or both side by side? Where
    is that written down?'
  note: 'Count ranking by agreement (a subordination), by law, and by place in the group: a loan to the company that holds
    the assets is paid from them before a loan to its owner. Take the worst of the three. Security is asked about in OBS_LENDER_002.
    This indicator is for a loan that a party the lender counts on owes to someone else. A loan that such a party has made
    to someone else belongs to CAS_RELATED_PARTY_001.'
- id: OBS_LENDER_002
  question: 'Does the other lender hold security over, or control of, anything the lender counts on: the assets offered
    to the lender as security, the assets that produce the cash, or the accounts the revenue is paid into?'
  answer: yes_no
  settled_by: company
  assumption: What the lender counts on is free of the other lender's security and control
  disproved_by: 'yes'
  due_by: concept
  look_in: [02.01.c, 04.02.b, 03.01.a]
  evidence:
    best: [registry_extract, security_agreement, audited_annual_report]
    supporting: [debt_schedule, facility_agreement, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: What have you pledged or charged to this lender? Does it include the assets or the bank accounts that we would rely
    on?
  note: A right of set-off over accounts kept with the other lender counts as control. If the search finds nothing, record
    what was searched, where and when.
- id: OBS_LENDER_003
  question: Is the party free under the other loan agreement to take the lender's loan and to give the lender's security,
    either without asking or with a consent the other lender has given in writing?
  answer: yes_no
  settled_by: company
  assumption: Taking the lender's loan and giving its security breaks no promise made to the other lender
  disproved_by: 'no'
  look_in: [04.01.b, 10.02.a, 04.03.a]
  evidence:
    best: [facility_agreement, correspondence]
    supporting: [debt_schedule, board_minutes]
    stated: [call, analyst_note]
  ask: Does your agreement with this lender limit new borrowing, or forbid you to give security to another lender? If it
    does, has the lender agreed in writing to our loan?
  if_unknown: The new loan may itself be a default under the other loan, which the other lender could then call.
  note: Read the other agreement itself for a limit on new debt and for a negative pledge (a promise not to give security
    to anyone else). The consent must come from the other lender. The party's own account of it is not a consent.
- id: OBS_LENDER_004
  question: Does the other loan fall due in a single payment, or come up for renewal, before the lender's loan is repaid,
    for an amount the party could not repay from one year's cash flow after its other debt service?
  answer: yes_no
  settled_by: company
  assumption: The other loan can be repaid from cash flow as it falls due, without a refinancing, while the lender's loan
    is outstanding
  disproved_by: 'yes'
  look_in: [04.01.b, 04.03.a, 03.01.a]
  evidence:
    best: [facility_agreement, audited_annual_report]
    supporting: [debt_schedule, management_accounts, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  note: A line that runs for a year and is then renewed falls due at its next renewal date. Where several lines of the
    party come up for renewal in the same year, take them together. A loan that is repaid in instalments from cash flow
    is a no.
  leads_to:
  - {indicator: CAS_DEBT_SERVICE_001, is: true, reason: 'The other loan is repaid or refinanced during the life of the lender''s
      loan, so that payment has to be in the cash flow'}
- id: OBS_LENDER_005
  question: Can the other lender cancel its loan or demand repayment at any time without a default (an uncommitted line,
    an overdraft, a loan repayable on demand)?
  answer: yes_no
  settled_by: company
  assumption: The other loan stays in place until its agreed maturity unless the party defaults
  disproved_by: 'yes'
  look_in: [04.01.b, 03.01.a, 04.03.a]
  evidence:
    best: [facility_agreement, audited_annual_report]
    supporting: [debt_schedule, management_accounts, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Is this line committed for a fixed period, or can the lender reduce it or ask for its money back whenever it chooses?
  leads_to:
  - {indicator: CAS_LIQUIDITY_001, is: true, reason: A line that can be withdrawn at will is not liquidity the party can
      count on}
- id: OBS_LENDER_006
  question: Are the other loan's covenants tighter than the lender's own, so that they would be breached first (tighter
    levels, more frequent testing, or events of default that the lender's agreement lacks)?
  answer: yes_no
  settled_by: company
  assumption: The other lender gets no default before the lender does
  disproved_by: 'yes'
  look_in: [04.01.b, 04.01.a, 04.03.a]
  evidence:
    best: [facility_agreement]
    supporting: [term_sheet, debt_schedule, financial_model]
    stated: [correspondence, call, analyst_note]
  note: Compare the same ratio on the same definitions. A looser level on a stricter definition can still be breached first.
  leads_to:
  - {indicator: CAS_COVENANT_DESIGN_001, is: true, reason: The lender's covenants can be set so that they are breached no
      later than the other lender's}
- id: OBS_LENDER_MIT_001
  question: Have the lenders agreed in writing that the other lender will not call its loan or enforce its security for
    a fixed period without the lender's consent (a standstill), and that the lender has a vote on enforcement?
  answer: yes_no
  settled_by: terms
  mitigant: true
  assumption: An agreement between the lenders gives the lender a vote and holds the other lender back for a fixed period
  disproved_by: 'no'
  when:
  - {check: OBS_LENDER_001, against: true}
  - {check: OBS_LENDER_002, against: true}
  - {check: OBS_LENDER_005, against: true}
  - {check: OBS_LENDER_006, against: true}
  look_in: [04.02.c, 04.01.a]
  evidence:
    best: [intercreditor_agreement]
    supporting: [term_sheet, facility_agreement]
    stated: [correspondence, call, analyst_note]
  note: A vote that the other lender can always outvote is not a say. Record the lender's share of the vote and what needs
    its consent. Until the agreement is signed, a term sheet agreed by both lenders is supporting evidence only.
- id: OBS_LENDER_MIT_002
  question: Has the other lender agreed in writing that no principal is repaid on its loan before the lender's loan is repaid
    in full, and that nothing at all is paid on it while the lender's loan is in default?
  answer: yes_no
  settled_by: terms
  mitigant: true
  assumption: The other lender has agreed in writing to be paid after the lender
  disproved_by: 'no'
  when:
  - {check: OBS_LENDER_004, against: true}
  - {check: OBS_LENDER_005, against: true}
  look_in: [04.02.c, 04.01.a]
  evidence:
    best: [intercreditor_agreement]
    supporting: [term_sheet, shareholder_agreement]
    stated: [correspondence, call, analyst_note]
  note: This is the usual answer for loans from shareholders and related parties. A bank will seldom agree to it. A subordination
    that is only promised in a term sheet, or only mentioned in the notes to the accounts, is not yet an agreement signed
    by the other lender.
