id: CAS_OFFTAKER_CREDIT_001
title: Key customer
pillar: links
claim: The customer will keep buying and paying until the loan is repaid, or the seller can sell the same volume to others.
due_by: diligence
applies_to: [sells_to]
matters_more_when:
- {check: OBS_CASHFLOW_BASIS_001, is: contracted, reason: The first way out rests on what this customer has signed}
- {check: OBS_SECTOR_001, is: project, reason: A project usually sells to one customer or to a few}
look_again_when:
- {new_source: offtake_agreement, reason: 'A new draft or an amendment can change the price, the volume, the term or the
    right to end the contract'}
- {new_source: credit_rating_report, reason: A change in the customer's rating changes what its promise to pay is worth}
checks:
- id: OBS_OFFTAKER_001
  question: Does this customer bring in about a tenth or more of the seller's revenue, now or in the projections, or do
    the projections for repayment rest on its contract?
  answer: yes_no
  settled_by: company
  why: Opens the topic. Below that size the loss of one customer is absorbed in the seller's revenue as a whole, which is
    tested under revenue and customers.
  due_by: screening
  look_in: [06.01.a, 03.01.a, 03.02.b]
  evidence:
    best: [offtake_agreement, audited_annual_report]
    supporting: [company_record, management_accounts, financial_model, annual_report, prospectus]
    stated: [correspondence, call, analyst_note, management_presentation]
  ask: Does this customer buy about a tenth or more of what you sell, or will it once the project runs?
  note: A tenth is a guide. OBS_OFFTAKER_002 asks for the figure and does not hang on this answer.
- id: OBS_OFFTAKER_002
  question: What share of the seller's revenue comes from this customer?
  answer: number
  settled_by: company
  unit: percent
  why: The share says how much of the debt service is lost with the customer. It also checks the answer to OBS_OFFTAKER_001.
  due_by: screening
  look_in: [03.01.a, 03.01.b, 03.02.b]
  evidence:
    best: [audited_annual_report, offtake_agreement]
    supporting: [company_record, management_accounts, financial_model, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: About what percentage of your revenue comes from this customer?
  note: Take the last full financial year. For a business that is not yet selling, take the share of projected revenue in
    the first full year of operation and say so.
- id: OBS_OFFTAKER_006
  question: Does the customer buy under a signed contract that fixes a volume or a price for more than a year ahead?
  answer: yes_no
  settled_by: company
  why: Decides whether the checks on the contract are asked. A customer that buys order by order is held only by its own
    interest, and then what counts is whether it can be replaced.
  due_by: concept
  when:
  - {check: OBS_OFFTAKER_001, is: true}
  calls_for:
  - {is: true, kind: contract}
  look_in: [06.01.a]
  evidence:
    best: [offtake_agreement, material_contract]
    supporting: [company_record, term_sheet]
    stated: [correspondence, call, analyst_note, management_presentation]
  leads_to:
  - {indicator: CAS_CONTRACT_REVIEW_001, is: true, reason: The contract is reviewed as a subject of its own}
- id: OBS_OFFTAKER_009
  question: What is the customer's credit standing?
  answer: choice
  settled_by: public
  options: [investment_grade, rated_BB, rated_B_or_below, unrated_strong, unrated_weak, unknown]
  assumption: The customer's ability to pay is known, and it is not weak
  flag_when: is rated_B_or_below or unrated_weak or unknown
  why: A rating in the single-B range or below says that the agency itself sees a real chance of default within the life
    of a loan. Contracted revenue from such a customer is no more certain than revenue without a contract.
  due_by: concept
  when:
  - {check: OBS_OFFTAKER_001, is: true}
  look_in: [10.03.a, 03.01.a]
  evidence:
    best: [credit_rating_report, audited_annual_report]
    supporting: [internal_memo, company_record, public_source, press_article, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Does this customer have a credit rating, or can you share its latest audited accounts or a credit report on it?
  note: investment_grade means a rating of BBB- (or Baa3) or higher. rated_BB means the double-B range just below it. rated_B_or_below
    means single-B or lower. Choose unrated_strong where there is no rating but the customer's audited accounts show profits,
    cash and debt it can carry. Choose unrated_weak where they show losses, heavy debt or late payment. Choose unknown where
    neither a rating nor accounts have been seen. A government body without its own rating takes the rating of its state.
    A rating does not say that the customer pays on time. OBS_OFFTAKER_004 asks that. Give the agency, the rating and its
    date in the reason.
- id: OBS_OFFTAKER_004
  question: Over the last twelve months, has the customer paid the seller within the agreed payment term or, where it has
    not yet bought from the seller, paid its other suppliers under comparable contracts on time?
  answer: yes_no
  settled_by: company
  assumption: The customer pays on time
  disproved_by: 'no'
  due_by: concept
  when:
  - {check: OBS_OFFTAKER_001, is: true}
  look_in: [03.01.a, 03.01.b, 10.03.a]
  evidence:
    best: [audited_annual_report, credit_rating_report]
    supporting: [company_record, bank_statement, management_accounts, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Does this customer pay your invoices when they fall due? Please share the ageing list of what it owes you.
  note: This check does not hang on OBS_OFFTAKER_001. Read the seller's ageing list of receivables and its bank statements.
    An invoice paid more than 30 days after it fell due counts as late. That is a guide. A strong rating does not replace
    a record of payment.
- id: OBS_OFFTAKER_007
  question: If this customer stopped buying, could the seller sell the same volume to other buyers within about six months,
    at a price no more than about a tenth lower?
  answer: yes_no
  settled_by: expert
  assumption: The seller could place this volume with other buyers within a season, without a large cut in price
  disproved_by: 'no'
  when:
  - {check: OBS_OFFTAKER_001, is: true}
  look_in: [01.03.a, 10.03.a]
  evidence:
    best: [market_study, consultant_report]
    supporting: [company_record, management_accounts]
    stated: [correspondence, call, analyst_note, business_plan]
  ask: If this customer stopped buying tomorrow, who else would take the volume, how soon, and at what price?
  note: Six months and a tenth are guides. What counts is whether the seller could go on servicing its debt while it finds
    other buyers. Where there is one possible buyer by law or by geography (a single power buyer, the only processor within
    reach), the answer is no.
- id: OBS_OFFTAKER_010
  question: In the last three years, has the customer cut the price it pays, lengthened its payment term, charged the seller
    rebates or fees that were not agreed, or dropped a product of the seller, without the seller's consent?
  answer: yes_no
  settled_by: company
  assumption: The customer has kept to the prices and terms it agreed with the seller
  disproved_by: 'yes'
  why: A large customer that buys without a long contract can use its weight through price cuts, rebates, longer payment
    terms and delisting. The checks on the contract do not show that.
  when:
  - {check: OBS_OFFTAKER_001, is: true}
  look_in: [06.01.a, 10.03.a, 03.01.b]
  evidence:
    best: [offtake_agreement, material_contract]
    supporting: [company_record, management_accounts, bank_statement]
    stated: [correspondence, call, analyst_note]
  ask: In the last three years, has this customer cut its price, taken longer to pay, charged you rebates or fees you had
    not agreed, or dropped one of your products, without your consent?
  note: Set the agreed prices and terms beside what the customer in fact paid, and when, over the three years. The seller's
    price lists, credit notes and ageing list of receivables show it. A change that both sides negotiated and signed is
    not a yes. A seller that says yes is believed.
- id: OBS_OFFTAKER_005
  question: If the customer ends the contract early, takes less than the agreed volume or pays late, does the contract oblige
    it to pay a stated amount (a termination payment, a take-or-pay or minimum payment, interest on late payment)?
  answer: yes_no
  settled_by: company
  assumption: The contract makes the customer pay if it ends the contract early, takes less or pays late
  disproved_by: 'no'
  when:
  - {check: OBS_OFFTAKER_006, is: true}
  look_in: [06.01.a, 08.01.a]
  evidence:
    best: [offtake_agreement, material_contract, legal_opinion]
    supporting: [term_sheet, internal_memo]
    stated: [correspondence, call, analyst_note]
  note: Set the termination payment against the debt that would then be outstanding, and say in the reason whether it covers
    it. Whether the lender can take over the seller's rights is asked about the contract itself (OBS_CONT_MIT_001).
- id: OBS_OFFTAKER_MIT_001
  question: 'Are the customer''s payments backed by something other than its own promise: a letter of credit or a bank guarantee,
    credit insurance, an escrow or collection account that the lender controls, or an assignment of the receivables to the
    lender?'
  answer: yes_no
  settled_by: terms
  mitigant: true
  assumption: The customer's payments are backed by more than its own promise to pay
  disproved_by: 'no'
  when:
  - {check: OBS_OFFTAKER_009, against: true}
  - {check: OBS_OFFTAKER_004, against: true}
  look_in: [04.02.b, 06.01.a, 08.03.a]
  evidence:
    best: [security_agreement, guarantee_agreement, insurance_policy]
    supporting: [offtake_agreement, term_sheet, company_record]
    stated: [correspondence, call, analyst_note]
  note: Say which of these is in place. An assignment or a collection account sends the money to the lender. It does not
    make a customer pay that cannot.
