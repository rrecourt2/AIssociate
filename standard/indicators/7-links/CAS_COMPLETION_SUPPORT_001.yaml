id: CAS_COMPLETION_SUPPORT_001
title: Completion support
pillar: links
claim: The giver of the support is bound to pay or to act until the project is proved complete, for an amount that covers
  a plausible overrun.
due_by: diligence
applies_to: [completion_support]
matters_more_when:
- {check: OBS_LIFECYCLE_001, is: greenfield, reason: 'Until the project is complete there is no cash flow, so the support
    is what stands behind the loan'}
- {check: OBS_BORROWER_001, is: spv, reason: A single-purpose borrower cannot pay for an overrun or a delay out of its own
    means}
look_again_when:
- {new_source: guarantee_agreement, reason: 'A new draft or the signed undertaking can change its triggers, its cap and
    its release'}
- {new_source: jv_agreement, reason: A sponsor support agreement can change what the giver owes and when}
checks:
- id: OBS_COMPSUPPORT_002
  question: Which events oblige the giver of the support to pay or to act?
  answer: choice
  settled_by: terms
  options: [completion_delay, cost_overrun, performance_test_failure, debt_service_shortfall, event_of_default, other, unclear]
  many: true
  assumption: The undertaking states the events that oblige its giver to pay or to act
  flag_when: is unclear
  why: Support that can be argued about when it is called does not arrive in time. Where the trigger is unclear, the giver
    decides whether it must pay.
  due_by: concept
  look_in: [04.02.a, 02.02.g, 04.01.b]
  evidence:
    best: [guarantee_agreement, jv_agreement, facility_agreement]
    supporting: [term_sheet, internal_memo]
    stated: [correspondence, call, analyst_note]
  note: Choose unclear where the trigger depends on the giver's own judgement, on an event that is not defined, or on a
    document not yet written. Unclear may be chosen together with other options. Where the undertaking covers only the debt,
    it is a guarantee and belongs on a guarantees link (CAS_GUARANTEE_001).
- id: OBS_COMPSUPPORT_006
  question: Is the support unlimited in amount, or capped at no less than the cost overrun in the independent engineer's
    downside case?
  answer: yes_no
  settled_by: terms
  assumption: The amount of the support covers a plausible cost overrun
  disproved_by: 'no'
  look_in: [04.02.a, 05.01.a, 03.02.b]
  evidence:
    best: [guarantee_agreement, jv_agreement, technical_feasibility]
    supporting: [term_sheet, financial_model, internal_memo]
    stated: [correspondence, call, analyst_note]
  note: Record the cap. Where no independent downside case exists, set the cap against the contingency in the budget. A
    cap smaller than that contingency adds little.
- id: OBS_COMPSUPPORT_003
  question: Which events end the support?
  answer: choice
  settled_by: terms
  options: [project_completion, financial_completion, commercial_operation_date, completion_certificate, dsra_funded, facility_repaid,
    other, unclear]
  many: true
  assumption: The undertaking states when the support ends
  flag_when: is unclear
  why: Where the end of the support is unclear, the giver can claim it has been released when the project runs into trouble,
    which is when the support is needed.
  look_in: [04.02.a, 02.02.g, 04.01.b]
  evidence:
    best: [guarantee_agreement, jv_agreement, facility_agreement]
    supporting: [term_sheet, internal_memo]
    stated: [correspondence, call, analyst_note]
  note: financial_completion means the project has met stated financial tests after it started to operate. dsra_funded means
    the debt service reserve account is filled. A release at the start of commercial operation ends the support before the
    plant has shown that it performs. Record any fixed end date.
- id: OBS_COMPSUPPORT_004
  question: What proof does the undertaking require before the support is released?
  answer: choice
  settled_by: terms
  options: [independent_engineer_certificate, completion_certificate, lender_approval, rating_letter, operating_test_report,
    other, unclear]
  many: true
  assumption: The support is released only on a certificate from an independent engineer or with the lender's approval
  flag_when: is not independent_engineer_certificate or lender_approval
  why: A release that the project, its builder or its sponsor can certify for itself ends the support on the word of the
    party that is supported. Only an independent engineer's certificate or the lender's own approval keeps the decision
    out of its hands.
  look_in: [04.02.a, 02.02.g, 04.01.b]
  evidence:
    best: [guarantee_agreement, jv_agreement, facility_agreement]
    supporting: [term_sheet, internal_memo]
    stated: [correspondence, call, analyst_note]
  note: Choose every proof that is required. completion_certificate means a certificate signed by the project, its builder
    or its sponsor.
- id: OBS_COMPSUPPORT_005
  question: Could the lender itself enforce the undertaking against its giver (it is signed, the lender is a party to it
    or holds it by assignment, and counsel confirms that it binds the giver)?
  answer: yes_no
  settled_by: expert
  assumption: The lender can enforce the undertaking against its giver
  disproved_by: 'no'
  look_in: [08.01.a, 04.02.a, 04.02.b]
  evidence:
    best: [legal_opinion, guarantee_agreement, security_agreement]
    supporting: [term_sheet, board_resolution]
    stated: [correspondence, call, analyst_note]
  if_unknown: Support that the lender cannot call depends on the sponsor choosing to honour it.
  note: A draft, a term sheet or a letter of comfort is a no. So is an undertaking given only to the borrower, which the
    lender cannot call unless it is assigned.
  leads_to:
  - {indicator: CAS_GUARANTOR_CAPACITY_001, is: true, reason: The support is worth what its giver can pay on the day it
      is called}
