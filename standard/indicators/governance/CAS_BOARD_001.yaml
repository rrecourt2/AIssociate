id: CAS_BOARD_001
title: Board Composition & Governance
workstream: WS_GOV
due_by: diligence
applies_to: [borrower]
why_it_matters:
  debt: Weak board governance may signal lack of oversight, increasing operational risk
  equity: Strong board adds strategic value and protects investor interests
matters_more_when:
- check: OBS_BORROWER_001
  is: operating_entity
  reason: Operating entity — board oversight of management is a key governance check
- check: OBS_INVESTOR_ROLE_001
  is: common_equity
  reason: Equity thesis — board quality directly affects strategic execution
- check: OBS_INVESTOR_ROLE_001
  is: preferred_equity
  reason: Equity investor — board representation may be a negotiation point
matters_less_when:
- check: OBS_BORROWER_001
  is: spv
  reason: SPV — typically no real board; governance flows through sponsor and management agreements
checks:
- id: OBS_BOARD_001
  question: Does the entity have a board of directors?
  answer: yes_no
  assumption: Entity has a governance body providing oversight
  disproved_by: 'no'
  due_by: screening
  look_in: [01.01.a]
  evidence:
    best: [certificate_of_incorporation, memorandum_and_articles]
    supporting: [registry_extract, board_resolution]
    stated: [correspondence, call, officer_note]
  ask: Does your company have a formal board of directors? This is a group of individuals appointed to oversee the
    company's management and strategy. Even a small board of 3 members counts.
- id: OBS_BOARD_002
  question: How many board members does the entity have?
  answer: number
  unit: count
  assumption: Board is appropriately sized for the entity
  due_by: concept
  after: [OBS_BOARD_001]
  when:
  - check: OBS_BOARD_001
    is: true
  evidence:
    best: [audited_annual_report, board_resolution]
    supporting: [registry_extract, management_presentation]
    stated: [correspondence, call, officer_note]
  ask: How many members sit on your board of directors? Please include both executive and non-executive directors.
- id: OBS_BOARD_003
  question: Are there independent directors on the board?
  answer: yes_no
  assumption: Board provides independent oversight of management
  disproved_by: 'no'
  due_by: concept
  after: [OBS_BOARD_001]
  when:
  - check: OBS_BOARD_001
    is: true
  evidence:
    best: [corporate_governance_policy, audited_annual_report]
    supporting: [management_cv, management_presentation]
    stated: [correspondence, call, officer_note]
  ask: Does your board include any independent directors — that is, directors who are not employees of the company
    and have no material business relationship with it? If so, how many?
- id: OBS_BOARD_004
  question: Does the board meet at minimum quarterly?
  answer: yes_no
  assumption: Board meets frequently enough to provide effective oversight
  disproved_by: 'no'
  after: [OBS_BOARD_001]
  when:
  - check: OBS_BOARD_001
    is: true
  evidence:
    best: [board_minutes, audited_annual_report]
    supporting: [audit_management_letter, internal_memo]
    stated: [correspondence]
  ask: Does your board of directors meet at least four times per year (quarterly)? Please share board meeting minutes
    or a schedule if available.
- id: OBS_BOARD_005
  question: Are board minutes documented and retained?
  answer: yes_no
  assumption: Board decisions are formally documented and auditable
  disproved_by: 'no'
  after: [OBS_BOARD_003]
  look_in: [01.03.a]
  evidence:
    best: [board_minutes]
    supporting: [board_resolution, call]
    stated: [correspondence]
  ask: Does your company keep written minutes of board meetings? We would appreciate seeing a sample set of minutes
    from a recent meeting (sensitive details can be redacted).
- id: OBS_BOARD_006
  question: Is there an alternative governance structure (e.g., advisory committee)?
  answer: yes_no
  assumption: Entity has no governance oversight mechanism at all
  disproved_by: 'yes'
  after: [OBS_BOARD_001]
  when:
  - check: OBS_BOARD_001
    is: false
  ask: If your company does not have a formal board of directors, is there an alternative oversight body such as
    an advisory committee, partners' meeting, or shareholder council that provides strategic guidance?
