id: CAS_OWNERSHIP_001
title: Ownership and Control Transparency
workstream: WS_GOV
due_by: diligence
applies_to: [borrower]
why_it_matters:
  debt: Ownership opacity can conceal related-party risk and impair recovery
  equity: Governance quality directly affects value protection and exit certainty
matters_more_when:
- check: OBS_INVESTOR_ROLE_001
  is: common_equity
  reason: Equity thesis — ownership/control relationships directly affect governance and value protection
- check: OBS_INVESTOR_ROLE_001
  is: preferred_equity
  reason: Equity thesis — shareholder rights and protections are critical
- check: OBS_BORROWER_001
  is: holding_company
  reason: Holding company — control-chain complexity drives structural subordination risk
- check: OBS_BORROWER_001
  is: spv
  reason: SPV — sponsor identity and control matter for credit assessment
checks:
- id: OBS_OWN_001
  question: Is the party's ownership and control structure clear and documented?
  answer: yes_no
  assumption: Party has transparent, documented ownership and control relationships
  disproved_by: 'no'
  due_by: screening
  look_in: [01.01.a, 02.01.a]
  evidence:
    best: [certificate_of_incorporation, shareholder_register]
    supporting: [registry_extract, organizational_chart]
    stated: [correspondence, call, officer_note]
  ask: Is this party's ownership and control structure clearly documented? We need to understand who owns or controls
    it, in what proportions, and how those parties connect to the transaction. A shareholder register, company registry
    extract, or ownership chart would be ideal.
- id: OBS_OWN_002
  question: Are there ultimate beneficial owners identified?
  answer: yes_no
  assumption: Ultimate beneficial ownership is known and disclosed
  disproved_by: 'no'
  due_by: concept
  after: [OBS_OWN_001]
  when:
  - check: OBS_OWN_001
    is: true
  look_in: [02.02.a]
  evidence:
    best: [beneficial_ownership_declaration, kyc_package]
    supporting: [registry_extract, legal_opinion]
    stated: [correspondence, call, officer_note]
  ask: Can you identify the ultimate beneficial owners — the real people who ultimately own or control the company?
    We need to trace ownership through any holding companies or trusts to the natural persons at the top.
  if_unknown: Beneficial ownership chain incomplete or unverifiable
  leads_to:
  - indicator: CAS_BENEFICIAL_OWNERSHIP_001
    is: true
    reason: Beneficial ownership identified — detailed UBO verification needed
- id: OBS_OWN_003
  question: Is there a shareholders' agreement?
  answer: yes_no
  assumption: Shareholder rights and obligations are formally governed
  disproved_by: 'no'
  after: [OBS_OWN_001]
  when:
  - check: OBS_OWN_001
    is: true
  look_in: [01.02.a]
  evidence:
    best: [shareholder_agreement, jv_agreement]
    supporting: [memorandum_and_articles, board_resolution]
    stated: [correspondence]
  ask: Is there a shareholders' agreement in place between the owners of the company? This is a contract that defines
    shareholder rights, obligations, voting procedures, and exit mechanisms. If one exists, we would appreciate
    a copy.
- id: OBS_OWN_004
  question: Are there minority shareholder protections?
  answer: yes_no
  assumption: Minority shareholders have adequate legal protections
  disproved_by: 'no'
  after: [OBS_OWN_001]
  when:
  - check: OBS_OWN_001
    is: true
  - check: OBS_OWN_003
    is: true
  evidence:
    best: [shareholder_agreement, memorandum_and_articles]
    supporting: [legal_opinion, board_resolution]
    stated: [correspondence, call, officer_note]
  ask: Does the shareholders' agreement or articles of association include protections for minority shareholders?
    These typically include tag-along rights, anti-dilution provisions, pre-emptive rights, or board representation
    requirements.
- id: OBS_OWN_005
  question: Are there opaque or circular ownership/control relationships?
  answer: yes_no
  assumption: Ownership structure is straightforward with no concealment
  disproved_by: 'yes'
  due_by: screening
  after: [OBS_OWN_001]
  evidence:
    best: [beneficial_ownership_declaration, legal_opinion]
    supporting: [registry_extract, organizational_chart]
    stated: [correspondence]
  ask: Are there any parts of the ownership or control chain that are difficult to trace — for example, nominee
    shareholders, shell companies in opaque jurisdictions, trust structures without disclosed beneficiaries, or
    parties that own shares in each other (circular holdings)?
  if_unknown: Ownership opacity cannot be assessed — structure not fully disclosed
