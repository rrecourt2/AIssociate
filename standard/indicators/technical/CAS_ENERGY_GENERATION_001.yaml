id: CAS_ENERGY_GENERATION_001
title: Power Generation Assessment
workstream: WS_TO
due_by: concept
applies_to: [project]
applies_when:
- check: OBS_SECTOR_002
  is: renewable_energy
- check: OBS_SECTOR_002
  is: conventional_power
checks:
- id: OBS_EGEN_001
  question: What is the installed or planned generation capacity of the project?
  answer: number
  unit: MW
  assumption: Project capacity is defined and adequate for the investment thesis
  due_by: screening
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [business_plan, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: What is the installed (or planned) generation capacity of the project in megawatts (MW)? This could come
    from the feasibility study, project information memorandum, or equipment specifications.
- id: OBS_EGEN_002
  question: What is the expected capacity factor for the project?
  answer: number
  unit: percent
  assumption: Capacity factor assumptions are realistic and supported by resource data
  after: [OBS_EGEN_001]
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence, call, officer_note]
  ask: What capacity factor is assumed for the project? This is the ratio of actual expected generation to maximum
    possible generation, usually expressed as a percentage. It can be found in the energy yield study, resource
    assessment, or financial model assumptions.
  if_unknown: Capacity factor not established — unable to assess revenue projections
- id: OBS_EGEN_003
  question: Is the project connected to the grid, or does it have a confirmed grid connection agreement?
  answer: yes_no
  assumption: Grid connection is secured or not required
  disproved_by: 'no'
  after: [OBS_EGEN_001]
  look_in: [06.01.a]
  evidence:
    best: [material_contract, technical_feasibility]
    supporting: [regulatory_document, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Is the project already connected to the electricity grid, or do you have a signed grid connection agreement?
    If not yet connected, what is the status of the grid connection process? Please share the connection agreement
    or any correspondence with the grid operator.
  if_unknown: Grid connection status unknown — fundamental delivery risk
- id: OBS_EGEN_004
  question: Does the project have a signed power purchase agreement (PPA) or offtake arrangement?
  answer: yes_no
  assumption: Revenue is secured through a contracted offtake arrangement
  disproved_by: 'no'
  after: [OBS_EGEN_001]
  look_in: [06.01.a, 06.02.a]
  evidence:
    best: [offtake_agreement]
    supporting: [term_sheet, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does the project have a signed power purchase agreement (PPA) or other offtake arrangement? Please share
    a copy of the PPA or term sheet, or describe the offtake structure including the buyer, price mechanism (fixed,
    indexed, or merchant), and contract duration.
  if_unknown: No PPA or offtake — revenue stream is uncontracted and uncertain
- id: OBS_EGEN_005
  question: Is there a material curtailment risk for the project?
  answer: yes_no
  assumption: Project output can be fully dispatched without curtailment
  disproved_by: 'yes'
  after: [OBS_EGEN_003]
  look_in: [05.01.a]
  evidence:
    best: [technical_feasibility, material_contract]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Is there a risk that the project's generation output could be curtailed by the grid operator? This could
    happen due to grid congestion, transmission constraints, or dispatch limitations. Do you have a grid study or
    dispatch analysis that addresses curtailment risk?
  if_unknown: Curtailment risk not assessed — potential revenue shortfall
- id: OBS_EGEN_006
  question: Is the generation technology proven at commercial scale for this application?
  answer: yes_no
  assumption: Generation technology is commercially proven and bankable
  disproved_by: 'no'
  after: [OBS_EGEN_001]
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Is the generation technology being used proven at commercial scale? We are looking for evidence of similar
    installations operating successfully — such as reference projects from the equipment manufacturer, independent
    technology assessments, or operating history at comparable scale and conditions.
  if_unknown: Technology readiness not confirmed for this application
