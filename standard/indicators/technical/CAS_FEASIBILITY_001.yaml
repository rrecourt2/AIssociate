id: CAS_FEASIBILITY_001
title: Technical Feasibility
workstream: WS_TO
due_by: diligence
applies_to: [project]
checks:
- id: OBS_FEAS_001
  question: Has a feasibility study been conducted for the project or core business activity?
  answer: yes_no
  assumption: Project feasibility has been formally assessed
  disproved_by: 'no'
  due_by: screening
  look_in: [06.01.a]
  evidence:
    best: [technical_feasibility]
    supporting: [internal_memo, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Has a feasibility study been done for your project or core business? This could be a formal bankable feasibility
    study, a techno-economic assessment, or an internal analysis. A copy of the study or a summary of its conclusions
    would be helpful.
  if_unknown: No feasibility study located — unable to assess technical viability
- id: OBS_FEAS_002
  question: Are the core technology and assets proven at commercial scale?
  answer: yes_no
  assumption: Technology is unproven or only demonstrated at pilot scale
  disproved_by: 'yes'
  after: [OBS_FEAS_001]
  when:
  - check: OBS_FEAS_001
    is: true
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence]
  ask: Is the technology or equipment you are using proven at commercial scale? We are looking for evidence that
    similar installations operate successfully elsewhere — reference projects, manufacturer track records, or operating
    history at comparable scale.
  if_unknown: Technology readiness level not confirmed — risk of unproven technology
- id: OBS_FEAS_003
  question: Has an independent technical expert validated the feasibility conclusions?
  answer: yes_no
  assumption: Feasibility conclusions rely solely on management or sponsor assertions
  disproved_by: 'yes'
  after: [OBS_FEAS_001]
  evidence:
    best: [technical_feasibility, consultant_report]
    supporting: [internal_memo]
    stated: [correspondence]
  ask: Has an independent technical expert reviewed the feasibility study or validated the project's technical assumptions?
    This could be a lender's technical advisor, an independent engineer, or a specialist consultant.
- id: OBS_FEAS_004
  question: Are there material technical risks identified in the feasibility assessment?
  answer: yes_no
  assumption: No material technical risks exist
  disproved_by: 'yes'
  after: [OBS_FEAS_001]
  when:
  - check: OBS_FEAS_001
    is: true
  evidence:
    best: [technical_feasibility]
    supporting: [company_record, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Does the feasibility study or any technical assessment identify material technical risks? Examples include
    construction risk, technology performance risk, resource availability, or supply chain dependencies.
  if_unknown: Technical risk profile not documented
