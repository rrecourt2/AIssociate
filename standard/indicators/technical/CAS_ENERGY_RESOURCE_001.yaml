id: CAS_ENERGY_RESOURCE_001
title: Resource Assessment
workstream: WS_TO
due_by: diligence
applies_to: [project]
checks:
- id: OBS_ERES_001
  question: Is site-specific resource data available for the project?
  answer: yes_no
  assumption: Resource data exists and is sufficient for energy yield estimation
  disproved_by: 'no'
  due_by: screening
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Is site-specific resource data available for the project? For solar, this would be irradiance data (GHI/DNI);
    for wind, wind speed measurements at hub height; for hydro, flow data. Please share the resource dataset, measurement
    campaign report, or describe what data has been collected and over what period.
  if_unknown: No resource data available — unable to validate energy yield assumptions
- id: OBS_ERES_002
  question: Has an independent resource assessment been conducted by a qualified third party?
  answer: yes_no
  assumption: Resource estimates rely solely on developer or sponsor assumptions
  disproved_by: 'yes'
  after: [OBS_ERES_001]
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence]
  ask: Has an independent resource assessment been performed by a qualified third party? This is typically an energy
    yield report prepared by a recognized consultant such as DNV, UL, Vortex, or a similarly qualified firm. Please
    share the report or confirm who conducted it.
  if_unknown: No independent resource validation — resource risk unmitigated
- id: OBS_ERES_003
  question: What are the P50 and P90 energy yield estimates for the project?
  answer: number
  unit: GWh_per_year
  assumption: Energy yield uncertainty has been quantified with probabilistic estimates
  after: [OBS_ERES_001]
  when:
  - check: OBS_ERES_001
    is: true
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence]
  ask: What are the P50 and P90 annual energy yield estimates for the project? P50 is the median expected output;
    P90 is the output exceeded 90% of the time. These are typically found in the independent energy yield report.
    The P50/P90 ratio helps us understand resource uncertainty.
  if_unknown: P50/P90 estimates not available — unable to size debt against downside yield
- id: OBS_ERES_004
  question: What is the inter-annual variability of the resource at this site?
  answer: number
  unit: percent
  assumption: Resource variability is within acceptable bounds for debt service coverage
  after: [OBS_ERES_001]
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence, call, officer_note]
  ask: What is the year-to-year variability of the energy resource at this site? This is typically expressed as
    a coefficient of variation or standard deviation of annual resource values. It helps us understand how much
    generation might vary from one year to the next.
  if_unknown: Inter-annual variability not quantified — downside revenue risk unclear
- id: OBS_ERES_005
  question: Have degradation rates been estimated for the generation equipment?
  answer: yes_no
  assumption: Long-term output decline has been factored into revenue projections
  disproved_by: 'no'
  after: [OBS_ERES_001]
  look_in: [05.01.a, 05.02.a]
  evidence:
    best: [technical_feasibility]
    supporting: [consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Have degradation rates been estimated for the generation equipment? For solar, this is typically 0.4-0.7%
    per year panel degradation; for wind, blade and drivetrain performance decline. What rates are assumed in the
    financial model, and are they supported by manufacturer warranties or independent studies?
  if_unknown: Degradation rates not established — long-term revenue projections may be overstated
