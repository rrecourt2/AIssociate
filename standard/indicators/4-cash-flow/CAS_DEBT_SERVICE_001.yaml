id: CAS_DEBT_SERVICE_001
title: Cash flow against debt service
pillar: cash_flow
claim: The party's own cash flow covers the service of all its debt, this loan included, with room to spare in a bad year.
due_by: diligence
applies_to: [borrower, repayment_source]
applies_when:
- {check: OBS_SECTOR_001, is: corporate}
- {check: OBS_SECTOR_001, is: project}
matters_more_when:
- {check: OBS_COLLATERAL_001, is: unsecured, reason: Without security the party's cash flow is the only way out}
- {check: OBS_CASHFLOW_BASIS_001, is: projected, reason: 'The cover then rests on a forecast, not on cash that has already
    been earned'}
- {check: OBS_INVESTOR_ROLE_001, is: subordinated, reason: 'Senior lenders are paid first, so the cover has to hold after
    their debt service'}
look_again_when:
- {new_source: audited_annual_report, reason: 'A new year of cash flow changes the cover, and can be the new worst year'}
- {new_source: debt_schedule, reason: New or repaid debt changes what falls due}
- {new_source: term_sheet, reason: 'A change in amount, tenor, grace period or repayment profile changes the debt service'}
checks:
- id: OBS_DS_001
  question: 'How much cash did the party generate in the last financial year that was free to service debt: cash from operations
    after tax, after the change in working capital and after the capital spending needed to keep the business as it is,
    before interest and repayments?'
  answer: number
  unit: currency
  why: The top line of the cover. It starts from cash, not from profit, and takes off what must be spent before any lender
    is paid.
  due_by: concept
  look_in: [03.01.a, 03.02.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, financial_model, annual_report, prospectus]
    stated: [call, analyst_note, management_presentation]
  note: Take the figure from the cash flow statement. Leave out revaluations and other gains without cash, and money raised
    from new debt or new shares. Say which year and which currency. For a business with no full year behind it, use the
    first full year of the lender's base case and say so.
- id: OBS_DS_002
  question: How much interest and principal must the party pay on all its debt, this loan included, in the first full year
    in which this loan is being repaid?
  answer: number
  unit: currency
  why: The bottom line of the cover. The first year after any grace period is used, because a year in which only interest
    is paid flatters the cover.
  due_by: concept
  look_in: [04.03.a, 04.01.a]
  evidence:
    best: [debt_schedule, facility_agreement]
    supporting: [term_sheet, financial_model]
    stated: [correspondence, call, analyst_note]
  ask: Please send a schedule of all your loans and leases that shows, year by year, the interest and the principal that
    fall due on each.
  note: Include lease payments, and shareholder loans that must be paid. Take the interest on seasonal lines at the amounts
    drawn through the year, not at the year-end balance. Leave out the principal of revolving lines that are committed beyond
    the year, and say so.
- id: OBS_DS_003
  question: How many times did the party's cash flow available for debt service in the last financial year cover the debt
    service of the first full year of repayment, this loan included?
  answer: number
  unit: times
  assumption: Last year's cash flow covers the service of all the party's debt, this loan included, with room to spare
  flag_when: below 1.2
  why: Below 1.0 the party could not have paid from its own cash flow. At 1.2 the cash flow can fall by a sixth before a
    payment is missed, and lenders to operating businesses commonly look for that much or more. It is a convention. A business
    with contracted revenue can carry less, and one that sells at market prices needs more. An institution can set its own
    figure.
  due_by: concept
  look_in: [03.01.a, 04.03.a, 03.02.b]
  evidence:
    best: [audited_annual_report, debt_schedule]
    supporting: [financial_model, management_accounts, internal_memo, annual_report, prospectus]
    stated: [call, analyst_note, management_presentation]
  if_unknown: Until the cover is worked out, nobody has shown that the loan can be repaid from cash flow.
  note: Divide the answer to OBS_DS_001 by the answer to OBS_DS_002. A cover worked out from EBITDA (profit before interest,
    tax, depreciation and amortisation), before tax, working capital and capital spending, is not this figure. The test
    does not wait for the terms of the loan. If the cover is already below the reference point on the debt the party owes
    today, record that figure now and say that it is before the new loan. Record it again when the terms are known.
- id: OBS_DS_008
  question: In the lender's base case, what is the lowest yearly cover of debt service by cash flow available for debt service
    over the life of the loan?
  answer: number
  unit: times
  assumption: In every year of the base case the cash flow covers debt service with room to spare
  flag_when: below 1.2
  why: The same convention as OBS_DS_003. Lenders to projects with contracted revenue commonly size the debt at about this
    level or higher, and ask for more where revenue follows the market. An institution can set its own figure.
  when:
  - {check: OBS_SECTOR_001, is: project}
  - {check: OBS_LIFECYCLE_001, is: greenfield}
  - {check: OBS_CASHFLOW_BASIS_001, is: projected}
  look_in: [03.02.b]
  evidence:
    best: [internal_memo, consultant_report]
    supporting: [financial_model, financial_projections]
    stated: [call, analyst_note]
  if_unknown: Until the lowest cover is known, nobody has shown that the loan can be repaid from cash flow in every year.
  note: Say which year the lowest cover falls in. Work out the cash flow as in OBS_DS_001 and the debt service as in OBS_DS_002,
    year by year. The base case is the lender's own, or one an independent adviser has checked. The party's model as received
    is the party's own word. If no such case has been run, the check stays open.
- id: OBS_DS_004
  question: Would the party's cash flow available for debt service in the worst of the last five financial years have covered
    that same debt service in full?
  answer: yes_no
  assumption: The cash flow of a bad year still covers the service of all the party's debt
  disproved_by: 'no'
  why: The claim is about a bad year, not an average one. The party's own worst recent year is a bad year that has already
    happened.
  look_in: [03.01.a, 03.02.b]
  evidence:
    best: [audited_annual_report]
    supporting: [financial_model, management_accounts, internal_memo, annual_report, prospectus]
    stated: [call, analyst_note]
  note: For a party with fewer than five years of accounts, answer for the years there are and say how many. Where the business
    has changed so much that those years say little, say so. The downside case in Projections and downside then carries
    the test. The test does not wait for the terms of the loan. If the answer already goes against the assumption on the
    debt the party owes today, record it now and say that it is before the new loan. Answer again when the terms are known.
  leads_to:
  - {indicator: CAS_PROJECTIONS_001, is: false, reason: The downside case shows whether such a year would lead to a missed
      payment under this loan}
- id: OBS_DS_005
  question: What is the party's total debt after this loan, as a multiple of its EBITDA (profit before interest, tax, depreciation
    and amortisation) of the last financial year?
  answer: number
  unit: times
  assumption: After this loan the party owes no more than about four years of its EBITDA
  flag_when: above 4
  why: 'Bank supervisors in the euro area and in the United States use total debt above about four times EBITDA to mark
    out leveraged lending. Four is a guide for an operating company: read it against what businesses of this kind carry.
    An institution can set its own figure.'
  when:
  - {check: OBS_SECTOR_001, is: corporate}
  look_in: [03.01.a, 04.03.a]
  evidence:
    best: [audited_annual_report, debt_schedule]
    supporting: [management_accounts, financial_model, annual_report, prospectus]
    stated: [call, analyst_note]
  note: Count all borrowing, leases and shareholder loans that must be repaid, without taking cash off. Take the debt at
    its highest point in the year, not at the year-end. Take EBITDA without one-off items. Record in the reason the multiple
    before the loan, and the multiple on net debt (after the cash the party is free to use). The test does not wait for
    the terms of the loan. If the multiple is already above the reference point on the debt the party owes today, record
    that figure now and say that it is before the new loan. Record it again when the terms are known.
- id: OBS_DS_006
  question: Over the last three financial years taken together, was the party's cash from operations (before interest and
    tax) less than about two thirds of its EBITDA (profit before interest, tax, depreciation and amortisation)?
  answer: yes_no
  assumption: The party's profit turns into cash
  disproved_by: 'yes'
  why: EBITDA counts sales that are not yet collected and stock that is not yet sold. Where cash from operations stays well
    below it for years, profit is booked that does not arrive, or growth is using it up.
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, financial_model, annual_report, prospectus]
    stated: [call, analyst_note]
  note: Two thirds is a guide. Three years are taken together so that one year's swing in working capital does not decide
    the answer.
  leads_to:
  - {indicator: CAS_WORKING_CAP_001, is: true, reason: The gap between profit and cash usually sits in receivables and stock}
- id: OBS_DS_MIT_001
  question: Do the loan terms require a debt service reserve account that is funded in cash before the first repayment,
    holds at least the next payment of interest and principal, and is pledged to the lender?
  answer: yes_no
  mitigant: true
  assumption: A funded reserve pays the lender while the party's cash flow recovers
  disproved_by: 'no'
  when:
  - {check: OBS_DS_003, against: true}
  - {check: OBS_DS_008, against: true}
  - {check: OBS_DS_004, against: true}
  look_in: [04.01.a, 04.02.b]
  evidence:
    best: [facility_agreement, security_agreement]
    supporting: [term_sheet, bank_statement]
    stated: [correspondence, call, analyst_note]
  note: A reserve buys time for one or two payments. It does not mend a cash flow that stays short.
- id: OBS_DS_MIT_003
  question: Has an owner or sponsor undertaken in writing to pay in cash when the party's cash flow falls short of its debt
    service?
  answer: yes_no
  mitigant: true
  assumption: An owner or sponsor has bound itself to cover a shortfall in debt service
  disproved_by: 'no'
  when:
  - {check: OBS_DS_003, against: true}
  - {check: OBS_DS_008, against: true}
  - {check: OBS_DS_004, against: true}
  calls_for:
  - is: true
    link: [supports, guarantees]
  look_in: [04.02.a, 02.02.g]
  evidence:
    best: [guarantee_agreement, jv_agreement]
    supporting: [term_sheet, board_resolution]
    stated: [correspondence, call, analyst_note]
  ask: If cash flow fell short of a loan payment, would a shareholder be willing to sign an undertaking to put in the missing
    cash? Who would sign it?
  note: A statement that the owner stands behind the party, with no promise to pay, is a no.
  leads_to:
  - {indicator: CAS_SUPPORT_UNDERTAKING_001, is: true, reason: The undertaking counts only as far as the lender can enforce
      it and the giver can pay}
