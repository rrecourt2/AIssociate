id: CAS_PROJECTIONS_001
title: Projections and downside
pillar: cash_flow
claim: Repayment does not depend on the party doing better than it has done before, and debt service is still paid in a
  downside case.
due_by: diligence
applies_to: [borrower, repayment_source]
matters_more_when:
- {check: OBS_CASHFLOW_BASIS_001, is: projected, reason: 'The first way out is a forecast, so the forecast is what the lender
    is lending against'}
- {check: OBS_LIFECYCLE_001, is: greenfield, reason: A new business has no record to hold the forecast against}
- {check: OBS_CAPEX_PLAN_001, is: true, reason: Repayment counts on capacity that is not yet built}
look_again_when:
- {new_source: financial_model, reason: A new version of the model can change the assumptions and the downside}
- {new_source: audited_annual_report, reason: A new year of actual figures shows whether the forecast was met}
- {new_source: management_accounts, reason: Interim figures show whether the current year is on budget}
checks:
- id: OBS_PROJ_001
  question: Has the party prepared financial projections (a financial model, a business plan with figures, or a budget for
    several years)?
  answer: yes_no
  why: Opens the topic. A no does not close it. The party's record against its own budget (OBS_PROJ_008) and the downside
    case (OBS_PROJ_006) are asked either way.
  due_by: concept
  look_in: [03.02.a, 03.02.b]
  evidence:
    best: [financial_model, financial_projections]
    supporting: [board_minutes]
    stated: [business_plan, correspondence, call, officer_note]
  ask: Have you prepared financial projections, such as a financial model, a business plan with projected figures or a budget
    for the coming years? A yes or no is enough to start with.
- id: OBS_PROJ_002
  question: What period do the projections cover?
  answer: choice
  options: [1_year, 3_year, 5_year, beyond_5]
  why: A forecast that stops before the loan is repaid says nothing about the last payments.
  when:
  - {check: OBS_PROJ_001, is: true}
  look_in: [03.02.a, 03.02.b]
  evidence:
    best: [financial_model, financial_projections]
    supporting: [board_minutes]
    stated: [business_plan, call, officer_note]
  note: Set the period against the life of this loan, and say whether the projections reach the final repayment.
- id: OBS_PROJ_003
  question: 'Are the assumptions behind the projections written down, so that each can be checked against a source: volumes,
    prices, costs, capital spending, working capital, interest and exchange rates?'
  answer: yes_no
  assumption: The projections rest on assumptions that are written down and can be checked
  disproved_by: 'no'
  due_by: concept
  when:
  - {check: OBS_PROJ_001, is: true}
  look_in: [03.02.b, 03.02.a]
  evidence:
    best: [financial_model, consultant_report]
    supporting: [financial_projections, internal_memo]
    stated: [business_plan, call, officer_note]
  ask: Can you send us the assumptions behind your projections, with the source of each? In a model this is usually the
    assumptions sheet.
  note: Figures typed into the model with no source are not written down in this sense.
- id: OBS_PROJ_004
  question: 'Has someone independent of the party, and of whoever built the projections, reviewed them: the arithmetic of
    the model and the sources of its inputs?'
  answer: yes_no
  assumption: Someone independent of the party has tested the projections
  disproved_by: 'no'
  when:
  - {check: OBS_PROJ_001, is: true}
  look_in: [03.02.b]
  evidence:
    best: [consultant_report]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Has anyone outside your company reviewed the projections, for example a model auditor or a financial adviser? Can
    we see the report?
  note: A model audit or an independent adviser's review counts. So does the lender's own rebuild of the figures, if it
    is written down. The auditor's signature on past accounts does not.
- id: OBS_PROJ_005
  question: How do the revenue growth and the margin in the projections compare with what the party achieved in the last
    five years?
  answer: choice
  options: [conservative, in_line, aggressive]
  assumption: The projections ask for nothing the party has not achieved before
  flag_when: is aggressive
  why: A forecast above the party's own best years asks the lender to believe in a business that has not existed yet. Repayment
    then depends on the improvement, not on the record.
  when:
  - {check: OBS_PROJ_001, is: true}
  look_in: [03.02.b, 03.01.a]
  evidence:
    best: [audited_annual_report, financial_model]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  note: 'Aggressive: growth or margin in any projected year is above the best of the last five years. In line: both stay
    within the range of those years. Conservative: both stay at or below their average. For a business with no history,
    compare with businesses of the same kind and say which.'
- id: OBS_PROJ_008
  question: Did the party's revenue or operating profit in the last financial year fall short of its own budget or forecast
    for that year by more than about a tenth?
  answer: yes_no
  assumption: The party has met its own forecasts
  disproved_by: 'yes'
  why: The best test of a forecast is the forecaster's record. A party that missed its own budget by a wide margin last
    year is asking the lender to trust the next one.
  due_by: concept
  look_in: [03.01.a, 03.01.b, 02.02.a]
  evidence:
    best: [audited_annual_report, consultant_report]
    supporting: [board_minutes, management_accounts, company_record]
    stated: [correspondence, call, officer_note]
  ask: What budget did your board approve for last year, and how did revenue and operating profit turn out against it? Please
    send the budget as it was approved.
  note: A tenth is a guide. Use the budget that was approved before the year began, not a later revision. A party that set
    no budget has no record to show. Leave the check open for it and say so.
- id: OBS_PROJ_006
  question: Is all debt service still paid when due in a downside case that sets revenue, margin and timing no better than
    the worst the party has seen in the last five years?
  answer: yes_no
  assumption: Debt service is still paid in a downside case
  disproved_by: 'no'
  why: The base case is what the party hopes for. The lender is repaid in the case that happens.
  look_in: [03.02.b]
  evidence:
    best: [internal_memo, consultant_report]
    supporting: [financial_model]
    stated: [call, officer_note]
  ask_whom: lender
  if_unknown: Nobody knows how much can go wrong before a payment is missed.
  note: A case that trims the base case by a few percent is not a downside. For a business without five years behind it,
    use the worst that businesses of the same kind have seen and say which. If no such case has been run, the check stays
    open.
- id: OBS_PROJ_007
  question: By what share can revenue fall below the base case, with costs behaving as they did in the party's past, before
    a payment of debt service is missed?
  answer: number
  unit: percent
  why: The room for error, in one figure. It is read against the largest fall in revenue the party has had in a year.
  look_in: [03.02.b]
  evidence:
    best: [consultant_report]
    supporting: [financial_model, internal_memo]
    stated: [call, officer_note]
  note: Give the lowest figure over the life of the loan, and the year it falls in.
