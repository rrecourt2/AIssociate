id: CAS_DEBT_001
title: Existing debt
pillar: cash_flow
claim: The party has paid its lenders as agreed, and what it already owes is all known to the lender.
due_by: diligence
applies_to: [borrower, repayment_source, guarantor]
applies_when:
- {check: OBS_SECTOR_001, is: corporate}
- {check: OBS_SECTOR_001, is: project}
matters_more_when:
- {check: OBS_LIFECYCLE_001, is: distressed, reason: A business in distress has usually already missed a payment or asked
    for a waiver}
- {check: OBS_INVESTOR_ROLE_002, is: true, reason: 'Other financing is in place, so the new loan has to fit beside it'}
look_again_when:
- {new_source: debt_schedule, reason: A new debt schedule shows the debt at a new date}
- {new_source: audited_annual_report, reason: 'New accounts can show borrowings, charges or a breach that were not there
    before'}
checks:
- id: OBS_DEBT_001
  question: Does the party owe money to banks, other lenders, lessors or its shareholders?
  answer: yes_no
  why: Opens the topic. A "no" is not the end of it. OBS_DEBT_007 checks it against the accounts and the registry.
  due_by: screening
  calls_for:
  - is: true
    link: [lends_to]
    end: to
  look_in: [04.03.a, 03.01.a]
  evidence:
    best: [audited_annual_report, debt_schedule]
    supporting: [management_accounts, facility_agreement]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Do you owe money to any bank, lender, leasing company or shareholder at the moment? A yes or no is enough to start
    with.
- id: OBS_DEBT_002
  question: What is the total debt outstanding, including leases and shareholder loans?
  answer: number
  unit: currency
  why: The starting figure for leverage and for debt service.
  due_by: concept
  when:
  - {check: OBS_DEBT_001, is: true}
  look_in: [04.03.a, 03.01.a]
  evidence:
    best: [audited_annual_report, debt_schedule]
    supporting: [management_accounts, facility_agreement]
    stated: [correspondence, call, officer_note]
  ask: How much do you owe in total today, to all lenders together? Please include leases and loans from shareholders.
  note: Take the figure at its highest point in the year where borrowing is seasonal, and say which date it is for.
- id: OBS_DEBT_008
  question: In the last three years, has the party missed a payment, breached a covenant, asked a lender for a waiver or
    a standstill, or had a loan rescheduled?
  answer: yes_no
  assumption: The party has paid and performed as agreed under its loans
  disproved_by: 'yes'
  due_by: concept
  when:
  - {check: OBS_DEBT_001, is: true}
  look_in: [03.01.a, 04.03.a, 10.02.a]
  evidence:
    best: [audited_annual_report, facility_agreement]
    supporting: [debt_schedule, management_accounts, board_minutes]
    stated: [correspondence, call, officer_note]
  ask: In the last three years, was there any moment when a payment to a lender was late, a covenant was not met, or you
    asked a lender for more time?
  note: A party that says yes is believed. A party that says no is believed once the accounts or a lender bear it out.
- id: OBS_DEBT_003
  question: When does the debt fall due?
  answer: choice
  options: [short_term_dominant, balanced, long_term_dominant]
  assumption: The debt does not fall due faster than the party's cash flow can repay it
  flag_when: is short_term_dominant
  why: Debt due within a year must be repaid from cash or rolled over. If the lenders do not roll it over, a profitable
    business can still fail.
  due_by: concept
  when:
  - {check: OBS_DEBT_001, is: true}
  look_in: [04.03.a, 03.01.a]
  evidence:
    best: [audited_annual_report, debt_schedule]
    supporting: [management_accounts, facility_agreement]
    stated: [correspondence, call, officer_note]
  ask: Is most of your debt due within the next year, spread over several years, or mostly due later? A repayment schedule
    would answer this.
- id: OBS_DEBT_007
  question: Do the audited accounts, the security registry or a credit report show borrowings, leases or charges that the
    party has not mentioned?
  answer: yes_no
  assumption: The party has told the lender about all its debt
  disproved_by: 'yes'
  look_in: [03.01.a, 02.01.c]
  evidence:
    best: [audited_annual_report, registry_extract]
    supporting: [management_accounts, bank_statement, credit_rating_report]
    stated: [call, officer_note]
  note: This check does not hang on OBS_DEBT_001, so that the topic cannot close on one answer. If the search finds nothing,
    record what was searched, where and when.
- id: OBS_DEBT_009
  question: Has the party guaranteed the debt of someone else, or given security for it?
  answer: yes_no
  assumption: The party answers only for its own debt
  disproved_by: 'yes'
  look_in: [03.01.a, 04.02.a]
  evidence:
    best: [audited_annual_report, guarantee_agreement]
    supporting: [management_accounts, board_minutes, registry_extract]
    stated: [correspondence, call, officer_note]
  ask: Have you signed a guarantee for anyone else's borrowing, or pledged any of your assets for it? For example for a
    sister company, a shareholder or a supplier.
- id: OBS_DEBT_004
  question: Does any of the debt rank behind the senior lenders (subordinated loans, shareholder loans)?
  answer: yes_no
  why: Debt that ranks behind is a cushion for a senior lender, as long as it cannot be repaid first.
  applies_to: [borrower, repayment_source]
  when:
  - {check: OBS_DEBT_001, is: true}
  look_in: [04.03.a, 04.02.c, 03.01.a]
  evidence:
    best: [facility_agreement, intercreditor_agreement, audited_annual_report]
    supporting: [debt_schedule, term_sheet]
    stated: [call, officer_note]
- id: OBS_DEBT_005
  question: Do the existing loans carry financial covenants?
  answer: yes_no
  why: Existing covenants limit what a new lender can ask for, and a breach of them can bring every loan down together.
  applies_to: [borrower, repayment_source]
  when:
  - {check: OBS_DEBT_001, is: true}
  look_in: [04.03.a, 03.01.a]
  evidence:
    best: [facility_agreement]
    supporting: [audited_annual_report, debt_schedule]
    stated: [correspondence, call, officer_note]
  ask: Do your current loan agreements set financial covenants, such as a minimum debt service cover or a maximum leverage?
  leads_to:
  - {indicator: CAS_COVENANT_DESIGN_001, is: true, reason: The new covenants have to fit beside the existing ones}
  - {indicator: CAS_OTHER_LENDERS_001, is: true, reason: A lender with covenants can call its loan before this lender can
      act}
- id: OBS_DEBT_006
  question: What is the ratio of debt to equity at its highest point in the year?
  answer: number
  unit: ratio
  why: Leverage is read at its worst, not at the year-end date the party chose.
  applies_to: [borrower, repayment_source]
  when:
  - {check: OBS_DEBT_001, is: true}
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
    stated: [call, officer_note]
- id: OBS_DEBT_MIT_001
  question: Have the lenders concerned confirmed in writing that the missed payment or breach is cured or waived?
  answer: yes_no
  mitigant: true
  assumption: The lenders concerned have confirmed that the default is cured or waived
  disproved_by: 'no'
  when:
  - {check: OBS_DEBT_008, against: true}
  look_in: [10.02.a, 04.03.a]
  evidence:
    best: [facility_agreement, correspondence]
    supporting: [audited_annual_report, board_minutes]
    stated: [call, officer_note]
  note: The letter must come from the lender concerned. The party's own account of it is not a confirmation.
