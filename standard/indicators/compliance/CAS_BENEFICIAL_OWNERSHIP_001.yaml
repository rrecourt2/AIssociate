id: CAS_BENEFICIAL_OWNERSHIP_001
title: Beneficial Ownership and Control Chain
workstream: WS_CI
due_by: diligence
applies_to: [borrower, guarantor, sponsor]
checks:
- id: OBS_BO_001
  question: Is beneficial ownership fully disclosed through the control chain?
  answer: yes_no
  assumption: Party has disclosed all natural persons who ultimately own or control it
  disproved_by: 'no'
  due_by: screening
  look_in: [02.02.a]
  evidence:
    best: [beneficial_ownership_declaration, kyc_package]
    supporting: [registry_extract, legal_opinion]
    stated: [correspondence, call, officer_note]
  ask: Has your company fully disclosed its beneficial ownership — that is, identified all natural persons who ultimately
    own or control the company, directly or indirectly? We need the ownership chain traced through any intermediary
    companies, trusts, or other structures.
  if_unknown: Beneficial ownership disclosure incomplete or not provided
- id: OBS_BO_002
  question: Are all UBOs with more than 25% ownership identified?
  answer: yes_no
  assumption: All significant beneficial owners (>25% threshold) are known
  disproved_by: 'no'
  due_by: concept
  after: [OBS_BO_001]
  when:
  - check: OBS_BO_001
    is: true
  evidence:
    best: [beneficial_ownership_declaration]
    supporting: [shareholder_register, registry_extract]
    stated: [correspondence, call, officer_note]
  ask: Can you confirm that every person who owns more than 25% of the company (directly or indirectly) has been
    identified by name, nationality, and date of birth? The 25% threshold is the standard for most AML regulations.
- id: OBS_BO_003
  question: Are any UBOs politically exposed persons?
  answer: yes_no
  assumption: No beneficial owners hold or have held prominent public positions
  disproved_by: 'yes'
  due_by: screening
  after: [OBS_BO_001]
  when:
  - check: OBS_BO_001
    is: true
  evidence:
    best: [aml_screening, beneficial_ownership_declaration]
    supporting: [company_certificate]
    stated: [correspondence]
  ask: Are any of the beneficial owners politically exposed persons (PEPs)? A PEP is someone who holds or has recently
    held a prominent public function — such as a head of state, senior government official, senior military officer,
    or senior judicial figure — or their close family members and associates.
  leads_to:
  - indicator: CAS_PEP_001
    is: true
    reason: UBO identified as PEP — enhanced due diligence required
- id: OBS_BO_004
  question: Is the beneficial ownership/control chain consistent with business rationale?
  answer: yes_no
  assumption: Ownership structure serves a legitimate business purpose
  disproved_by: 'no'
  after: [OBS_BO_001]
  when:
  - check: OBS_BO_001
    is: true
  - check: OBS_BO_003
    is: true
  evidence:
    best: [business_plan, management_presentation]
    supporting: [legal_opinion, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does the ownership and control chain make sense given the nature of the business? For example, is there a
    clear commercial reason for any holding companies, trusts, or multi-layered structures? Chains that appear more
    complex than the business requires can be a concern.
- id: OBS_BO_005
  question: Are there nominees or trust structures in the ownership chain?
  answer: yes_no
  assumption: Ownership is held directly without nominees or trust intermediaries
  disproved_by: 'yes'
  due_by: concept
  after: [OBS_BO_001]
  when:
  - check: OBS_BO_001
    is: true
  evidence:
    best: [beneficial_ownership_declaration, shareholder_register]
    supporting: [legal_opinion]
    stated: [correspondence, call, officer_note]
  ask: Are any shares held by nominee shareholders or through trust structures? If so, please identify the nominee
    or trustee and the person on whose behalf the shares are held. We need to see through any nominee arrangements
    to the real beneficial owner.
  if_unknown: Nominee or trust arrangements not disclosed or not verifiable
