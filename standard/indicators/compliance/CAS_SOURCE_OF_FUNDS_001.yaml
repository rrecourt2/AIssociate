id: CAS_SOURCE_OF_FUNDS_001
title: Source of Funds
workstream: WS_CI
due_by: diligence
applies_to: [borrower, guarantor, sponsor]
checks:
- id: OBS_SOF_001
  question: Is the source of funds for the transaction identified?
  answer: yes_no
  assumption: The origin of funds being used in this transaction is known
  disproved_by: 'no'
  due_by: screening
  look_in: [02.02.a, 06.02.a]
  evidence:
    best: [company_certificate, bank_statement]
    supporting: [executive_summary, management_presentation]
    stated: [correspondence, call, officer_note]
  ask: Can you identify the source of funds for this transaction — that is, where the money is coming from? This
    could be operating cash flows, proceeds from a prior investment, loan proceeds, shareholder contributions, or
    other sources. A written declaration or bank statements showing the fund origin would be helpful.
  if_unknown: Source of funds not identified — critical for AML compliance
- id: OBS_SOF_002
  question: Is the source of funds consistent with known business activities?
  answer: yes_no
  assumption: Funds originate from the entity's normal course of business
  disproved_by: 'no'
  due_by: concept
  after: [OBS_SOF_001]
  when:
  - check: OBS_SOF_001
    is: true
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [bank_statement, business_plan]
    stated: [correspondence, call, officer_note]
  ask: Is the source of funds consistent with what we know about the company's business activities and financial
    position? For example, if the company claims funds come from operating profits, do the financial statements
    support that level of cash generation?
- id: OBS_SOF_003
  question: Are there any unusual or complex fund flows?
  answer: yes_no
  assumption: Fund flows follow straightforward, expected patterns
  disproved_by: 'yes'
  due_by: concept
  after: [OBS_SOF_001]
  when:
  - check: OBS_SOF_001
    is: true
  evidence:
    best: [bank_statement, investment_plan]
    supporting: [management_presentation, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Are there any unusual patterns in how funds are flowing into or through the transaction? Examples of concerns
    include funds passing through multiple intermediary accounts without clear business reason, round-trip transactions,
    payments to or from unrelated third parties, or fund flows through high-risk jurisdictions.
  if_unknown: Fund flow patterns not assessed — bank statements or flow diagrams needed
- id: OBS_SOF_004
  question: Is there documentation supporting the source of funds?
  answer: yes_no
  assumption: Source of funds is evidenced by verifiable documentation
  disproved_by: 'no'
  after: [OBS_SOF_001]
  when:
  - check: OBS_SOF_001
    is: true
  evidence:
    best: [bank_statement, audited_annual_report, facility_agreement]
    supporting: [company_certificate, material_contract]
    stated: [correspondence]
  ask: Can you provide documentary evidence supporting the declared source of funds? Acceptable documents include
    bank statements showing the fund origin, audited accounts demonstrating cash generation, loan agreements for
    borrowed funds, or share sale agreements for proceeds from equity disposals.
