id: CAS_PEP_001
title: Politically Exposed Persons
workstream: WS_CI
due_by: diligence
applies_to: [borrower, guarantor, sponsor]
checks:
- id: OBS_PEP_001
  question: Are any connected persons politically exposed persons?
  answer: yes_no
  assumption: No directors, shareholders, or key management are PEPs
  disproved_by: 'yes'
  due_by: screening
  look_in: [02.02.a, 06.02.a]
  evidence:
    best: [aml_screening, beneficial_ownership_declaration]
    supporting: [company_certificate]
    stated: [correspondence]
  ask: Are any of the company's directors, shareholders, beneficial owners, or senior managers politically exposed
    persons (PEPs)? A PEP is someone who holds or has recently held a prominent public function, or a close family
    member or associate of such a person.
- id: OBS_PEP_002
  question: What is the nature of the PEP connection?
  answer: choice
  options: [direct, family, close_associate]
  assumption: PEP connection type is known and categorized
  due_by: screening
  after: [OBS_PEP_001]
  when:
  - check: OBS_PEP_001
    is: true
  evidence:
    best: [aml_screening, beneficial_ownership_declaration]
    supporting: [company_certificate, legal_opinion]
    stated: [correspondence, call, officer_note]
  ask: What is the nature of the PEP connection? Is the person themselves a PEP (direct), a close family member
    of a PEP (family), or a known close associate of a PEP (close_associate)? Please specify which individual and
    their relationship to the company.
- id: OBS_PEP_003
  question: Is there enhanced due diligence documentation for the PEP?
  answer: yes_no
  assumption: Enhanced due diligence has been performed on PEP connections
  disproved_by: 'no'
  after: [OBS_PEP_001]
  when:
  - check: OBS_PEP_001
    is: true
  evidence:
    best: [adverse_media_screen]
    supporting: [company_certificate, legal_opinion]
    stated: [correspondence]
  ask: Has enhanced due diligence (EDD) been performed for the PEP connection? EDD typically includes verification
    of the source of wealth, source of funds, closer scrutiny of the business relationship, and senior management
    approval. Please provide any EDD documentation.
- id: OBS_PEP_004
  question: Is there ongoing monitoring of PEP status?
  answer: yes_no
  assumption: PEP status is monitored on an ongoing basis for changes
  disproved_by: 'no'
  after: [OBS_PEP_001]
  when:
  - check: OBS_PEP_001
    is: true
  evidence:
    best: [corporate_governance_policy, company_record]
    supporting: [company_certificate, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your company have a process for ongoing monitoring of PEP connections? This means regularly re-screening
    PEPs for changes in status (e.g., leaving office) and reviewing the business relationship at defined intervals.
    How often is PEP status reviewed?
