id: CAS_TERM_SHEET_001
title: Terms
pillar: facility
claim: The loan's tenor and repayment schedule fit the cash flow that repays it.
due_by: diligence
applies_to: [facility]
matters_more_when:
- {check: OBS_LIFECYCLE_001, is: greenfield, reason: 'No cash comes in until the project is built and running, so the grace
    period and the first instalments carry the whole schedule'}
- {check: OBS_CASHFLOW_BASIS_001, is: projected, reason: Terms fitted to a forecast fit only as well as the forecast holds}
look_again_when:
- {new_source: term_sheet, reason: 'A new draft can change the amount, the tenor or the schedule'}
- {new_source: facility_agreement, reason: The signed agreement can differ from the term sheet that was approved}
- {new_source: financial_model, reason: A new model moves the cash flow the terms were fitted to}
checks:
- id: OBS_TS_001
  question: Have the lender and the borrower agreed a term sheet or heads of terms for the facility?
  answer: yes_no
  why: Opens the topic. Until the terms are on paper, the tests below are answered from what is proposed, and the answer
    should say so.
  due_by: screening
  look_in: [04.01.a]
  evidence:
    best: [term_sheet]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Is there a term sheet or heads of terms that you and the lender have both accepted? Please share the latest version
    and say whether it is signed.
- id: OBS_TS_002
  question: Does the term sheet state the amount, the currency, the tenor, the grace period, the repayment schedule, the
    interest rate and the fees, with none of them left open?
  answer: yes_no
  assumption: The main terms are written down and none is still to be agreed
  disproved_by: 'no'
  when:
  - {check: OBS_TS_001, is: true}
  look_in: [04.01.a, 04.01.b]
  evidence:
    best: [term_sheet, facility_agreement]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  note: A term marked "to be agreed", or a range in place of a figure, counts as left open.
- id: OBS_TS_007
  question: Set against a month-by-month cash flow, does any repayment fall due before the cash to pay it has come in (during
    a ramp-up, or ahead of the season's sales)?
  answer: yes_no
  assumption: Each repayment falls due after the cash that pays it has come in
  disproved_by: 'yes'
  when:
  - {check: OBS_TS_001, is: true}
  look_in: [04.01.a, 03.02.b, 03.01.b]
  evidence:
    best: [term_sheet, facility_agreement, technical_feasibility]
    supporting: [financial_model, financial_projections, management_accounts]
    stated: [business_plan, correspondence, call, officer_note]
  ask: In which months does your cash come in, and when would the first repayment fall? If the loan pays for an investment,
    when will that investment start to earn?
  note: A yearly cash flow hides this. Use a monthly or quarterly one for the grace period, the ramp-up and one full season.
    For a project under construction, the first repayment is set against completion under OBS_ECON_007.
- id: OBS_TS_008
  question: 'Does repayment in full depend on a refinancing or a sale at maturity: a bullet, or a final instalment larger
    than the cash flow of its year can pay?'
  answer: yes_no
  assumption: The loan is repaid in full from cash flow by its final maturity, without a refinancing or a sale
  disproved_by: 'yes'
  due_by: concept
  when:
  - {check: OBS_TS_001, is: true}
  look_in: [04.01.a, 03.02.b]
  evidence:
    best: [term_sheet, facility_agreement]
    supporting: [financial_model, financial_projections, internal_memo]
    stated: [business_plan, correspondence, call, officer_note]
  note: A working-capital line that is repaid in full from each trading cycle does not depend on a refinancing. One that
    is only ever rolled over does.
  leads_to:
  - {indicator: CAS_PROJECTIONS_001, is: true, reason: The cash flow and the value at maturity have to be strong enough
      for another lender to take the loan over}
- id: OBS_TS_004
  question: Are the proposed tenor, grace period and repayment profile within what lenders have agreed for comparable loans
    in this sector and country?
  answer: yes_no
  why: Terms more generous than any precedent need a reason that belongs to this deal. Comparable means the same sector,
    the same country or region and the same kind of borrower.
  when:
  - {check: OBS_TS_001, is: true}
  look_in: [04.01.a, 04.03.b]
  evidence:
    best: [dfi_facility_document, facility_agreement]
    supporting: [internal_memo, market_study]
    stated: [call, officer_note]
  ask_whom: lender
  if_unknown: Where no comparable loan is known, the terms have no outside reference. The credit paper should say so.
- id: OBS_TS_010
  question: Does the price of the loan (margin and fees together) meet the return the lender requires for a credit of this
    risk, tenor and rank?
  answer: yes_no
  why: A price below the lender's own requirement means the risk is carried for less than it costs. This is the lender's
    judgement of its own loan, not a test of the borrower.
  due_by: approval
  when:
  - {check: OBS_TS_001, is: true}
  look_in: [04.01.a]
  evidence:
    best: [internal_memo]
    supporting: [term_sheet]
    stated: [call, officer_note]
  ask_whom: lender
- id: OBS_TS_MIT_001
  question: Do the loan terms require the borrower to use surplus cash to prepay this loan (a cash sweep), so that the final
    payment shrinks in the years the business does well?
  answer: yes_no
  mitigant: true
  assumption: Surplus cash reduces the debt that would have to be refinanced
  disproved_by: 'no'
  when:
  - {check: OBS_TS_008, against: true}
  look_in: [04.01.a, 04.01.b]
  evidence:
    best: [facility_agreement]
    supporting: [term_sheet, financial_model]
    stated: [correspondence, call, officer_note]
  note: Check what counts as surplus cash, and whether dividends are paid before the sweep or after it.
