id: CAS_CONDITIONS_001
title: Conditions and follow-up
pillar: facility
claim: Everything left open at approval is written down as a condition, a covenant or an agreed action, and each is met
  when it falls due, before the money moves or by its date after.
due_by: disbursement
applies_to: [facility]
applies_when:
- {check: OBS_TS_011, answered: true}
matters_more_when:
- {check: OBS_LIFECYCLE_001, is: greenfield, reason: 'The money is drawn in stages while the project is built, and each
    drawing has conditions of its own'}
- {check: OBS_LIFECYCLE_001, is: distressed, reason: A business in distress changes fast between approval and disbursement}
look_again_when:
- {new_source: conditions_precedent_checklist, reason: 'A new checklist shows which conditions are met, waived or still
    open'}
- {new_source: facility_agreement, reason: 'The signed agreement fixes the conditions and the undertakings, and may differ
    from what was approved'}
- {check: OBS_COND_005, is: true, reason: A waived or deferred condition has to be followed until it is met}
checks:
- id: OBS_COND_001
  question: Does every claim that is challenged or not tested at approval have against it a condition precedent, a covenant,
    or an agreed action with an owner and a date?
  answer: yes_no
  assumption: Nothing is left open at approval without a condition, a covenant or an agreed action
  disproved_by: 'no'
  due_by: approval
  look_in: [04.01.a, 08.01.b]
  evidence:
    best: [internal_memo]
    supporting: [term_sheet, conditions_precedent_checklist]
    stated: [call, analyst_note]
  ask_whom: lender
  note: Start from the tool's own list of claims that are challenged or not tested. An open point that the approval paper
    mentions but ties to nothing counts as a no.
- id: OBS_COND_002
  question: Are the conditions precedent listed in the term sheet or the facility agreement, each worded so that a named
    document or a fact that can be looked up shows whether it is met?
  answer: yes_no
  assumption: Each condition precedent can be checked against a document or a fact
  disproved_by: 'no'
  due_by: approval
  look_in: [04.01.a, 04.01.b, 08.01.b]
  evidence:
    best: [facility_agreement, term_sheet, conditions_precedent_checklist]
    supporting: [internal_memo]
    stated: [correspondence, call, analyst_note]
  note: A condition such as "insurance in place" passes only if it names what has to be delivered (the policy, the broker's
    letter). One that says only "to the lender's satisfaction" does not pass.
- id: OBS_COND_003
  question: 'Since approval, has anything that the decision rested on changed: the latest figures of the parties that repayment
    relies on, their owners or managers, the structure of the deal, a licence or a contract, or the terms as documented
    against the terms approved?'
  answer: yes_no
  assumption: Nothing that the approval rested on has changed since it was given
  disproved_by: 'yes'
  look_in: [03.01.b, 04.01.b, 02.01.c]
  evidence:
    best: [audited_annual_report, facility_agreement, registry_extract, company_certificate]
    supporting: [management_accounts, interim_financial_statements, internal_memo, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask_whom: lender
  note: Ask at signing and again before each disbursement. If the review finds nothing, record what was looked at and when
    (the latest accounts, the registry, the press, the signed terms against the approved terms).
- id: OBS_COND_004
  question: Before each disbursement so far, was every condition for it met, or waived or deferred in writing, with the
    document that shows it on file?
  answer: yes_no
  assumption: No money moved while a condition was neither met nor formally let go
  disproved_by: 'no'
  look_in: [08.01.b, 08.01.a]
  evidence:
    best: [conditions_precedent_checklist, legal_opinion]
    supporting: [internal_memo, correspondence]
    stated: [call, analyst_note]
  ask_whom: lender
- id: OBS_COND_005
  question: Has any condition precedent been waived, or deferred to a date after disbursement?
  answer: yes_no
  assumption: No condition precedent was waived or deferred
  disproved_by: 'yes'
  look_in: [08.01.b, 10.02.a]
  evidence:
    best: [conditions_precedent_checklist, internal_memo]
    supporting: [correspondence]
    stated: [call, analyst_note]
  ask_whom: lender
  note: Record which condition, why it was let go, and what it was there to protect.
- id: OBS_COND_006
  question: Do payment records show that the money drawn so far was spent on the purposes named in the facility agreement?
  answer: yes_no
  assumption: The money was used for the agreed purpose
  disproved_by: 'no'
  due_by: monitoring
  look_in: [03.01.b, 10.01.a, 10.03.a]
  evidence:
    best: [bank_statement, consultant_report, audited_annual_report]
    supporting: [company_record, company_certificate, management_accounts, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Please show how the money drawn so far was spent, with the invoices and the proof of payment for the larger items.
  note: The borrower's own certificate of use is its word. Trace the larger payments to invoices and bank statements, or
    rely on an engineer's or auditor's report that did.
- id: OBS_COND_007
  question: Have all accounts, compliance certificates and other reports that fell due under the facility agreement in the
    last twelve months arrived complete and by their due dates?
  answer: yes_no
  assumption: The borrower reports in full and on time
  disproved_by: 'no'
  due_by: monitoring
  look_in: [10.01.a, 03.01.a, 03.01.i]
  evidence:
    best: [audited_annual_report, interim_financial_statements, company_certificate]
    supporting: [internal_memo, correspondence, annual_report, prospectus]
    stated: [call, analyst_note]
  ask_whom: lender
  note: Compare the date each report was received with the date it was due. Late figures are often the first sign that the
    figures are bad.
- id: OBS_COND_008
  question: Is every agreed action whose date has passed (a condition deferred to after disbursement, an action plan item,
    an undertaking with a date) complete?
  answer: yes_no
  assumption: Agreed actions are completed by their dates
  disproved_by: 'no'
  due_by: monitoring
  look_in: [10.01.a, 07.02.c, 10.03.a]
  evidence:
    best: [consultant_report, registry_extract, regulatory_document]
    supporting: [company_record, company_certificate, internal_memo]
    stated: [correspondence, call, analyst_note]
  ask: Which of the agreed actions are complete, which are late, and what shows it for each?
  note: Complete means that the thing itself is there (the registered charge, the permit, the policy), not that work on
    it has started.
- id: OBS_COND_009
  question: Was the waiver, the deferral or the change approved at the level that the lender's rules require for it, and
    does whatever it leaves open have an owner and a date?
  answer: yes_no
  mitigant: true
  assumption: The waiver, deferral or change was approved at the level the lender's rules require, and what it leaves open
    has an owner and a date
  disproved_by: 'no'
  when:
  - {check: OBS_COND_003, against: true}
  - {check: OBS_COND_005, against: true}
  look_in: [10.02.a, 04.01.b]
  evidence:
    best: [internal_memo, facility_agreement]
    supporting: [conditions_precedent_checklist, correspondence]
    stated: [call, analyst_note]
  ask_whom: lender
  note: For a change to what was approved, that is usually the level that approved the loan. An analyst's own decision to
    let a condition go is not an approval.
