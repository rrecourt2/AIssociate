id: CAS_LEGAL_CAPACITY_001
title: Legal standing
pillar: facility
claim: The party exists in law, is in good standing, is not in insolvency proceedings, and has the power to take on what
  it signs in this deal.
due_by: diligence
applies_to: [borrower, guarantor]
matters_more_when:
- {check: OBS_LIFECYCLE_001, is: distressed, reason: A business in distress is the one most likely to face a creditor's
    petition or to have let its filings lapse}
- {check: OBS_BORROWER_001, is: spv, reason: A company set up for the deal has no record to show that it exists and is kept
    in order}
look_again_when:
- {new_source: registry_extract, reason: A new extract shows the party's standing at a new date}
- {new_source: memorandum_and_articles, reason: Amended articles can widen or narrow what the party may do}
- {new_source: legal_opinion, reason: 'Counsel''s opinion can confirm the party''s existence and powers, or qualify them'}
checks:
- id: OBS_LEGAL_001
  question: Is the party incorporated and registered as a legal person?
  answer: yes_no
  assumption: The party exists in law and can be held to what it signs
  disproved_by: 'no'
  due_by: screening
  look_in: [02.01.a, 02.01.c]
  evidence:
    best: [certificate_of_incorporation, registry_extract, legal_opinion]
    supporting: [kyc_package, memorandum_and_articles]
    stated: [correspondence, call, analyst_note]
  ask: Under which name, number and country is the company registered? Please share the certificate of incorporation or
    a recent extract from the registry.
  note: Check that the name and the registration number are those of the party that will sign, not of a sister company with
    a similar name. For a natural person an official identity document takes the place of the registration. For a public
    body it is the law or decree that set it up.
- id: OBS_LEGAL_006
  question: Is the party in insolvency proceedings, administration, receivership or a court-supervised restructuring, or
    is a petition to wind it up pending?
  answer: yes_no
  assumption: The party is not in insolvency proceedings and no petition to wind it up is pending
  disproved_by: 'yes'
  due_by: screening
  look_in: [02.01.c, 02.06.d, 03.01.a]
  evidence:
    best: [registry_extract, legal_opinion, regulatory_document]
    supporting: [audited_annual_report, adverse_media_screen, credit_rating_report]
    stated: [correspondence, call, analyst_note]
  ask: Has the company, or any creditor, filed for its insolvency, administration or winding-up, or for a restructuring
    under the court's protection?
  note: Search the company registry, the insolvency or court register and the press. If the search finds nothing, record
    what was searched, where and when. This check does not hang on OBS_LEGAL_001.
  leads_to:
  - {indicator: CAS_LITIGATION_001, is: true, reason: 'A petition is a claim in court, and it is seldom the only one'}
  - {indicator: CAS_DEBT_001, is: true, reason: Proceedings follow from debts that were not paid}
- id: OBS_LEGAL_002
  question: 'Does the company registry show the party in good standing: annual returns filed, fees paid, and no notice of
    striking off or dissolution?'
  answer: yes_no
  assumption: The party is in good standing with the registry and is not about to be struck off
  disproved_by: 'no'
  due_by: concept
  when:
  - {check: OBS_LEGAL_001, is: true}
  look_in: [02.01.c, 08.01.a]
  evidence:
    best: [registry_extract, legal_opinion]
    supporting: [tax_clearance, company_certificate]
    stated: [correspondence, call, analyst_note]
  ask: Are all annual returns filed and all registry fees paid? A recent certificate of good standing or registry extract
    would show it.
  note: Record the date of the extract. Standing can lapse between diligence and signing, so a fresh extract is usual before
    the documents are signed.
  leads_to:
  - {indicator: CAS_CONDITIONS_001, is: false, reason: A lapse that is not cured by approval has to become a condition precedent}
- id: OBS_LEGAL_003
  question: Do the party's constitutional documents give it the power to do its part in this deal (to borrow, to guarantee
    another party's debt, or to give security)?
  answer: yes_no
  assumption: The party has the power to take on the obligations it signs
  disproved_by: 'no'
  look_in: [02.01.b, 08.01.a]
  evidence:
    best: [memorandum_and_articles, legal_opinion]
    supporting: [company_certificate, internal_memo]
    stated: [correspondence, call, analyst_note]
  ask: Do the company's articles allow it to borrow, to give guarantees and to give security? Please share the current articles
    with all amendments.
  if_unknown: An obligation that the party had no power to take on can be challenged when the lender comes to rely on it.
  note: Read the objects and the powers in the current articles, with all amendments. For a guarantor, look for the power
    to answer for someone else's debt, not only to borrow. Limits on what the directors may approve are asked under OBS_AUTH_004.
