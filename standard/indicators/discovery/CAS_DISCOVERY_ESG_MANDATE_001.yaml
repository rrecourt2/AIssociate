id: CAS_DISCOVERY_ESG_MANDATE_001
title: ESG / Sustainability Mandate Discovery
workstream: WS_ES
due_by: screening
applies_to: [deal]
why_it_matters:
  debt: ESG failures can create covenant/regulatory risk for debt holders
  equity: ESG credentials affect exit universe and valuation multiples
checks:
- id: OBS_ESG_MANDATE_001
  question: Is there a specific sustainability mandate or commitment?
  answer: choice
  options: [none, integration, dfi_impact]
  look_in: [01.01.a]
  evidence:
    best: [private_placement_memorandum, corporate_governance_policy, regulatory_document]
    supporting: [internal_memo]
    stated: [call, officer_note, correspondence]
  ask: 'Does the investor (or target investor base) have specific ESG/sustainability requirements? For example:
    - No specific mandate beyond basic screening - ESG integration (considering ESG factors in analysis) - SFDR
    Article 8 (promoting environmental/social characteristics) - SFDR Article 9 (sustainable investment objective)
    - DFI/impact mandate (development impact requirements) - Labelled instrument (green bond, social bond framework)'
  ask_whom: lender
- id: OBS_ESG_MANDATE_002
  question: Are there multiple investor types being targeted with different mandates?
  answer: yes_no
  after: [OBS_ESG_MANDATE_001]
  look_in: [01.01.a]
  evidence:
    best: [internal_memo]
    supporting: [term_sheet]
    stated: [call, officer_note, correspondence]
  ask: Is the entity targeting multiple types of investors who may have different ESG/sustainability requirements?
    For example, approaching both commercial banks and impact investors, or both Article 8 and Article 9 funds?
- id: OBS_ESG_MANDATE_003
  question: Are there specific exclusion lists applicable?
  answer: yes_no
  after: [OBS_ESG_MANDATE_001]
  look_in: [01.01.a]
  evidence:
    best: [corporate_governance_policy, private_placement_memorandum]
    supporting: [internal_memo]
    stated: [call, officer_note, correspondence]
  ask: Are there specific exclusion lists that apply? For example, restrictions on fossil fuels, weapons, tobacco,
    controversial sectors, or specific country exclusions?
  ask_whom: lender
