id: CAS_DISCOVERY_BORROWER_001
title: Primary Financed Party Discovery
workstream: WS_FIN
due_by: screening
applies_to: [deal]
why_it_matters:
  debt: Primary financed-party structure determines recourse and ring-fencing effectiveness
  equity: Primary financed-party structure affects governance and value extraction paths
checks:
- id: OBS_BORROWER_001
  question: What is the primary financed-party structure?
  answer: choice
  options: [spv, operating_entity, holding_company, fund_vehicle]
  look_in: [01.01.a, 02.01.a, 03.01.a]
  evidence:
    best: [audited_annual_report, registry_extract]
    supporting: [organizational_chart, internal_memo]
    stated: [call, officer_note, correspondence]
  ask: 'What type of entity is the primary financed party, borrower, or investee? - SPV: a special purpose vehicle
    set up specifically for this asset or transaction - Operating entity: a company that runs its own business with
    employees and operations - Holding company: a parent entity that owns subsidiaries - Fund vehicle: an investment
    fund (LP, SICAV, etc.)'
- id: OBS_BORROWER_002
  question: Does the primary financed party have employees?
  answer: yes_no
  after: [OBS_BORROWER_001]
  look_in: [03.01.a, 01.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note, correspondence]
  ask: Does this entity directly employ staff? Or is it a shell/SPV where operations are outsourced to a manager
    or service provider?
- id: OBS_BORROWER_003
  question: Is the primary financed party part of a larger group?
  answer: yes_no
  after: [OBS_BORROWER_001]
  look_in: [02.01.a, 03.01.a]
  evidence:
    best: [audited_annual_report, organizational_chart]
    supporting: [registry_extract, internal_memo]
    stated: [call, officer_note, correspondence]
  ask: Is this entity part of a larger corporate group? Does it have a parent company, sister companies, or other
    related entities?
  if_unknown: Group structure unknown — scope of analysis may be incomplete
  leads_to:
  - indicator: CAS_RELATED_PARTY_001
    is: true
    reason: Group membership increases related party transaction risk
- id: OBS_COLLATERAL_001
  question: What is the collateral scope?
  answer: choice
  options: [single_asset, multi_asset, enterprise, unsecured]
  after: [OBS_BORROWER_001]
  look_in: [10.01.a, 10.03.a]
  evidence:
    best: [term_sheet, facility_agreement]
    supporting: [internal_memo, security_agreement]
    stated: [call, officer_note, correspondence]
  ask: 'What is being offered or expected as collateral/security? - Single asset: one specific asset (e.g., one
    building, one project) - Multi-asset: a portfolio of assets - Enterprise: the whole business / all assets -
    Unsecured: no specific collateral'
- id: OBS_TRANSACTION_TOPOLOGY_001
  question: Which entities, projects, assets, facilities, and material contracts are in the proposed transaction
    perimeter?
  answer: text
  after: [OBS_BORROWER_001]
  look_in: [01.01.a, 01.02.a, 06.01.a]
  evidence:
    best: [organizational_chart, term_sheet]
    supporting: [internal_memo, correspondence]
    stated: [call, officer_note]
  ask: 'Please provide the transaction structure at a high level: financed-party entities, projects/assets, facilities
    or tranches, key contracts, and which parties are inside the transaction perimeter. A structure chart, term
    sheet, or short written description is enough at this stage.'
  if_unknown: Transaction topology unknown — subject-specific diligence cannot be prioritized reliably
- id: OBS_SUPPORT_TOPOLOGY_001
  question: Are there guarantees, support undertakings, cash sweeps, or other support links between transaction
    parties?
  answer: yes_no
  after: [OBS_BORROWER_001]
  look_in: [06.01.a, 06.02.a]
  evidence:
    best: [term_sheet, guarantee_agreement, facility_agreement]
    supporting: [internal_memo, organizational_chart]
    stated: [call, officer_note, correspondence]
  ask: Are any parties supporting each other through guarantees, completion undertakings, cash sweeps, reserve sharing,
    cross-defaults, or other debt-service support arrangements? If yes, please identify who supports whom and when
    that support starts or ends.
  if_unknown: Support topology unknown — transaction recourse may be incomplete
  leads_to:
  - indicator: CAS_PORTFOLIO_SUPPORT_001
    is: true
    reason: Inter-party support can centralize credit risk and drive prioritization
  - indicator: CAS_COMPLETION_SUPPORT_001
    is: true
    reason: Guarantees and undertakings need event-based trigger/release analysis
- id: OBS_SUPPORT_EVENTS_001
  question: Which events trigger or release the support arrangements?
  answer: text
  after: [OBS_SUPPORT_TOPOLOGY_001]
  when:
  - check: OBS_SUPPORT_TOPOLOGY_001
    is: true
  look_in: [06.01.a, 06.02.a]
  evidence:
    best: [term_sheet, guarantee_agreement, facility_agreement]
    supporting: [internal_memo]
    stated: [call, officer_note, correspondence]
  ask: For each support arrangement, what events trigger support and what events release it? Examples include project
    completion, financial completion, COD, DSRA funding, debt-service shortfall, facility repayment, or another
    documented milestone.
- id: OBS_KEY_CONTRACTS_001
  question: Which material contracts generate or protect repayment cash flows?
  answer: text
  after: [OBS_BORROWER_001]
  look_in: [06.01.a, 03.01.a]
  evidence:
    best: [term_sheet, offtake_agreement, company_record]
    supporting: [internal_memo, business_plan]
    stated: [call, officer_note]
  ask: Which contracts are most important to repayment? Please identify key offtake, concession, EPC, O&M, grid
    connection, supply, or management contracts and the relevant counterparties.
  leads_to:
  - indicator: CAS_OFFTAKER_CREDIT_001
    answered: true
    reason: Contracted repayment cash flow requires counterparty credit assessment
- id: OBS_CASHFLOW_BASIS_001
  question: What is the primary cash flow basis?
  answer: choice
  options: [contracted, projected, historical, mixed]
  after: [OBS_BORROWER_001]
  look_in: [03.01.a, 10.02.a]
  evidence:
    best: [audited_annual_report, financial_projections, company_record]
    supporting: [management_accounts, offtake_agreement]
    stated: [call, officer_note]
  ask: 'How is the entity''s cash flow primarily supported? - Contracted: long-term contracts, leases, or offtake
    agreements - Projected: based on forecasts and business plans (limited track record) - Historical: well-established
    track record of actual cash flows - Mixed: combination of contracted and market-based revenue'
