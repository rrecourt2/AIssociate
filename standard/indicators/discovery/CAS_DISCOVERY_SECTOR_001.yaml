id: CAS_DISCOVERY_SECTOR_001
title: Sector & Asset Class Discovery
workstream: WS_FIN
due_by: screening
applies_to: [deal]
why_it_matters:
  debt: Sector determines which downside risks are structural
  equity: Sector determines growth characteristics and exit universe
checks:
- id: OBS_SECTOR_001
  question: What is the primary business activity of the entity?
  answer: choice
  options: [real_estate, infrastructure, corporate, financial_institution, fund]
  look_in: [01.01.a, 03.01.a]
  evidence:
    best: [audited_annual_report, business_plan]
    supporting: [management_accounts, public_source]
    stated: [call, officer_note, correspondence]
  ask: What does this entity primarily do? Own/manage properties, build/operate infrastructure, manufacture/sell
    goods or services, provide financial services, manage investments?
- id: OBS_SECTOR_002
  question: What is the specific sector or property type?
  answer: choice
  options: [office, retail, residential, logistics, hospitality, healthcare, data_centre, mixed_use, student_housing,
    senior_living, self_storage, renewable_energy, conventional_power, transport, telecoms, water_waste, social_infra,
    isic_linked]
  after: [OBS_SECTOR_001]
  look_in: [01.01.a, 03.01.a]
  evidence:
    best: [audited_annual_report, business_plan]
    supporting: [management_accounts, public_source]
    stated: [call, officer_note]
  ask: 'What specific type of asset does this entity focus on? For example: office, logistics, residential, renewable
    energy, transport, manufacturing, etc.'
- id: OBS_SECTOR_003
  question: Is the entity a regulated financial institution?
  answer: yes_no
  after: [OBS_SECTOR_001]
  look_in: [01.01.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note, correspondence]
  ask: Is this entity regulated as a financial institution (bank, insurer, fund manager, broker-dealer)?
  if_unknown: Regulatory status unknown — may affect scope of analysis
- id: OBS_VALUE_CHAIN_001
  question: Where does the entity sit in its sector's value chain?
  answer: choice
  options: [developer, owner_operator, asset_manager, contractor, reit_platform, primary_producer, manufacturer,
    distributor, retailer, service_provider, concessionaire, epc, operator, originator, intermediary, fund_manager]
  after: [OBS_SECTOR_001]
  look_in: [01.01.a, 01.02.a]
  evidence:
    best: [audited_annual_report, business_plan]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: What is the entity's primary role? E.g., does it develop assets, own and manage them, provide services, manufacture
    goods, or manage investments?
- id: OBS_SECTOR_CONFIRM_001
  question: Does the entity own or lease physical property as a primary activity?
  answer: yes_no
  after: [OBS_SECTOR_001]
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report, financial_projections]
    supporting: [management_accounts]
- id: OBS_SECTOR_CONFIRM_002
  question: Is revenue primarily from rent, lease payments, or property sales?
  answer: yes_no
  after: [OBS_SECTOR_001]
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
