id: CAS_RATE_PRICE_RISK_001
title: Interest rate and price risk
pillar: liquidity
claim: A rise in interest rates, or a move in commodity prices against the party's stock and forward contracts, would not
  stop the party from servicing its debt.
due_by: diligence
applies_to: [borrower, repayment_source]
applies_when:
- {check: OBS_SECTOR_001, is: corporate}
- {check: OBS_SECTOR_001, is: project}
matters_more_when:
- {check: OBS_VALUE_CHAIN_001, is: trader, reason: A trader lives on the difference between two prices and finances its
    stock with short-term debt}
- {check: OBS_SECTOR_002, is: agribusiness, reason: 'A crop is bought in one season and sold over the year, at prices that
    move in between'}
- {check: OBS_VALUE_CHAIN_001, is: primary_producer, reason: A primary producer sells at the price the market gives on the
    day}
look_again_when:
- {new_source: debt_schedule, reason: 'New debt, or debt that has been refinanced, changes the share that follows the market
    rate'}
- {new_source: hedge_document, reason: 'A new hedge, or one that has run off, changes what is covered'}
- {new_source: audited_annual_report, reason: The notes on derivatives and on stock show the positions at a new date}
checks:
- id: OBS_RATE_001
  question: What share of the party's debt, the proposed loan included, carries a floating rate or falls due for refinancing
    within twelve months?
  answer: number
  unit: percent
  why: This is the debt whose cost follows the market. Short-term debt at a fixed rate counts, because it takes the new
    rate when it is rolled over.
  due_by: concept
  look_in: [04.03.a, 04.01.b, 03.01.a]
  evidence:
    best: [facility_agreement, audited_annual_report]
    supporting: [debt_schedule, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: How much of your borrowing is at a floating rate, and how much falls due within the next twelve months?
- id: OBS_RATE_002
  question: If interest rates rose by three percentage points, would the party's operating cash flow of the last full year
    still cover the interest and the scheduled repayments on its debt as contracted, the proposed loan included and before
    any hedge?
  answer: yes_no
  assumption: The party can service its debt after a rise in interest rates of three percentage points
  disproved_by: 'no'
  look_in: [03.01.a, 04.03.a, 03.02.b]
  evidence:
    best: [audited_annual_report, facility_agreement]
    supporting: [debt_schedule, financial_model, management_accounts]
    stated: [management_presentation, call, officer_note]
  note: Three points is a guide. Where the reference rate has stood more than three points above today's level within the
    last ten years, test against that level. For a business without a full year of trading, use the first full year of the
    base case.
  leads_to:
  - {indicator: CAS_DEBT_SERVICE_001, is: false, reason: The cover for debt service is too thin to take a rise in rates}
- id: OBS_PRICE_001
  question: Does the party buy or sell a commodity whose price is set on a market and changes from day to day?
  answer: yes_no
  why: Opens price risk. A "no" is not the end of it. OBS_PRICE_003 is asked whatever the answer, against the accounts.
  due_by: screening
  look_in: [03.01.a, 06.01.a, 06.04.a]
  evidence:
    best: [audited_annual_report, offtake_agreement, supply_agreement]
    supporting: [management_accounts, market_study]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Is the price of what you sell, or of your main input, set on a commodity market? Which one?
- id: OBS_PRICE_002
  question: Taken at its seasonal peak, is the party's open price position (stock that is neither sold nor hedged, and forward
    sales at a fixed price for which the goods are neither bought nor hedged) so large that a price move of a fifth against
    it would cost more than the operating profit of the last full year?
  answer: yes_no
  assumption: A price move of a fifth against the party's open position would cost less than a year's operating profit
  disproved_by: 'yes'
  when:
  - {check: OBS_PRICE_001, is: true}
  look_in: [04.03.a, 03.01.a, 10.03.a]
  evidence:
    best: [hedge_document, audited_annual_report]
    supporting: [company_record, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: At the busiest point of your season, how much stock do you hold that is not yet sold or hedged? And how much have
    you sold forward at a fixed price without having bought the goods?
  note: A fifth is a guide. Use a larger move where the price of this commodity has moved by more within a season. The year-end
    accounts seldom show the peak, so ask for the position report of the peak month.
  leads_to:
  - {indicator: CAS_WORKING_CAP_001, is: true, reason: 'Stock that is not sold is also financed, usually with short-term
      debt'}
- id: OBS_PRICE_003
  question: Do the accounts or the party's position reports show futures, options or forward contracts that are larger than
    its physical purchases and sales, or in goods it does not deal in?
  answer: yes_no
  assumption: The party uses futures, options and forward contracts only to cover its physical business
  disproved_by: 'yes'
  due_by: concept
  look_in: [03.01.a, 04.03.a, 10.03.a]
  evidence:
    best: [audited_annual_report, hedge_document]
    supporting: [company_record, management_accounts, board_minutes]
    stated: [correspondence, call, officer_note]
  note: This check does not hang on OBS_PRICE_001, so that the topic cannot close on one answer. Large gains or losses on
    derivatives in the accounts of a party that says it does not deal in commodities are a sign. If the search finds nothing,
    record what was searched, where and when.
- id: OBS_PRICE_004
  question: In the last five years, has a buyer or a supplier walked away from a forward contract at a fixed price with
    the party, or forced the party to renegotiate it, after the market price moved?
  answer: yes_no
  assumption: The party's buyers and suppliers have honoured their forward contracts when the price moved against them
  disproved_by: 'yes'
  due_by: concept
  when:
  - {check: OBS_PRICE_001, is: true}
  look_in: [03.01.a, 10.03.a, 02.02.a]
  evidence:
    best: [audited_annual_report, legal_opinion]
    supporting: [company_record, board_minutes, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: When prices last moved sharply, did any buyer refuse to take delivery, or any supplier fail to deliver at the agreed
    price? What did it cost you?
  note: A forward contract fixes the price only as long as the other side performs. A party that says yes is believed.
- id: OBS_RATE_003
  question: Has the party fixed or capped the interest rate on enough of its floating-rate debt, by a swap, a cap or a switch
    to a fixed rate, that it could service its debt after a rise of three percentage points?
  answer: yes_no
  mitigant: true
  assumption: An interest hedge or a fixed rate keeps the debt service within the party's cash flow after a rise in rates
  disproved_by: 'no'
  when:
  - {check: OBS_RATE_002, against: true}
  look_in: [04.03.a, 04.01.b]
  evidence:
    best: [hedge_document, facility_agreement]
    supporting: [debt_schedule, term_sheet, management_accounts]
    stated: [correspondence, call, officer_note]
  note: A hedge that ends before the debt does covers only the years it runs.
- id: OBS_PRICE_005
  question: Does the party have a written price-risk policy with position limits, and does someone who does not trade (finance,
    risk or the board) check the positions against those limits at least once a month?
  answer: yes_no
  mitigant: true
  assumption: Position limits are written down and are checked by someone outside trading
  disproved_by: 'no'
  when:
  - {check: OBS_PRICE_002, against: true}
  - {check: OBS_PRICE_003, against: true}
  look_in: [02.05.a, 03.01.e, 02.02.a]
  evidence:
    best: [corporate_governance_policy, audit_management_letter]
    supporting: [board_minutes, company_record]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Who sets the limits on how much unsold stock and how many open contracts the traders may hold? Who checks them, and
    how often? Please share the policy and a recent limit report.
  note: Ask for a limit report from a month in which the price moved. A limit that was raised each time it was reached is
    not a limit.
  leads_to:
  - {indicator: CAS_INTERNAL_CONTROLS_001, is: false, reason: Trading without limits that someone else checks is a gap in
      control}
