id: CAS_FX_001
title: Currency risk
pillar: liquidity
claim: A move in the exchange rate, in either direction, would not stop the party from servicing its debt.
due_by: diligence
applies_to: [borrower, repayment_source]
matters_more_when:
- {check: OBS_VALUE_CHAIN_001, is: primary_producer, reason: Primary producers often sell at prices set in a foreign currency
    and pay their costs in local currency}
- {check: OBS_VALUE_CHAIN_001, is: manufacturer, reason: Manufacturers often buy imported inputs and sell at home}
- {check: OBS_CAPEX_PLAN_001, is: true, reason: Imported equipment is usually priced in a foreign currency}
look_again_when:
- {new_source: hedge_document, reason: 'A new hedge, or one that has run off, changes how much of the exposure is covered'}
- {new_source: term_sheet, reason: The currency of the proposed loan may have changed}
- {new_source: audited_annual_report, reason: The currency note and the exchange gains and losses show the exposure at a
    new date}
checks:
- id: OBS_FX_001
  question: Does the party earn any of its revenue in a foreign currency, or at prices that are set in one?
  answer: yes_no
  why: Opens the revenue side. A "no" is not the end of it. OBS_FX_008, OBS_FX_CAPEX_001 and OBS_FX_TRANSLATION_001 are
    asked whatever the answer, and the currency note in the audited accounts shows whether the answer is right.
  due_by: screening
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Do you earn revenue in a foreign currency, or sell at prices that follow one? A revenue breakdown by currency or
    a rough share is enough to start with.
  note: Foreign means any currency other than the one in which the party pays most of its costs.
- id: OBS_FX_003
  question: In which foreign currencies does the party earn revenue?
  answer: choice
  options: [USD, EUR, GBP, other]
  many: true
  why: Revenue covers a payment only in the same currency, or in one that moves with it.
  due_by: concept
  when:
  - {check: OBS_FX_001, is: true}
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [correspondence, call, officer_note]
  note: Where the answer is other, name the currency.
- id: OBS_FX_002
  question: What share of the party's revenue is earned in a foreign currency, or at prices set in one?
  answer: number
  unit: percent
  assumption: A rise in the local currency would reduce only a small part of the party's revenue
  flag_when: above 20
  why: Revenue in a foreign currency buys less against local costs when the local currency rises, or when local inflation
    runs ahead of the exchange rate. Above about a fifth of revenue, a move of a fifth in the rate shifts total revenue
    by 4 per cent or more, a large part of a normal operating margin. The figure is a guide carried over from earlier practice,
    and an institution can set its own. The same revenue is a cover for costs and debt in that currency, which OBS_HEDGE_004
    asks about.
  due_by: concept
  when:
  - {check: OBS_FX_001, is: true}
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [correspondence, call, officer_note]
  ask: What share of your revenue is in foreign currency, or at prices that follow one? A rough percentage is fine at this
    stage.
- id: OBS_FX_007
  question: Does the party pay any of its costs in a foreign currency, or at prices that follow one (imported inputs, fuel,
    freight, licence fees)?
  answer: yes_no
  why: Opens the cost side. A party that sells only at home can still be hit through what it buys.
  due_by: screening
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report, supply_agreement]
    supporting: [management_accounts, company_record]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Do you pay for anything in a foreign currency, or at a price that goes up when the local currency falls? Think of
    imported raw materials, fuel, spare parts, freight and licence fees.
  if_unknown: A breakdown of costs by currency is not in the documents so far.
- id: OBS_FX_INPUT_001
  question: What share of the party's input costs is imported, or priced at import parity so that it rises when the local
    currency falls?
  answer: number
  unit: percent
  assumption: A fall in the local currency would raise only a small part of the party's input costs
  flag_when: above 25
  why: Inputs that follow the exchange rate cost more on the day the currency falls, while selling prices follow later or
    not at all. Above about a quarter of input costs, a fall of a fifth in the currency raises total input cost by 5 per
    cent or more, which many margins cannot carry. The figure is a guide carried over from earlier practice, and an institution
    can set its own.
  due_by: concept
  when:
  - {check: OBS_FX_007, is: true}
  look_in: [03.01.a, 03.01.b, 06.04.a]
  evidence:
    best: [audited_annual_report, supply_agreement]
    supporting: [management_accounts, company_record]
    stated: [correspondence, call, officer_note]
  ask: Roughly what share of your input costs is imported, or priced off international markets even when billed in local
    currency (imported gas, fuel or raw materials, for example)?
  note: Inputs billed in local currency at a price that follows the import price count as imported.
- id: OBS_FX_008
  question: Is any of the party's debt, the proposed loan included, owed in a currency other than the one in which the party
    earns the cash flow that services it?
  answer: yes_no
  assumption: The party's debt is owed in the currency of the cash flow that services it
  disproved_by: 'yes'
  due_by: concept
  look_in: [04.03.a, 04.01.b, 03.01.a]
  evidence:
    best: [facility_agreement, audited_annual_report]
    supporting: [debt_schedule, term_sheet, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: Is any of your borrowing in a different currency from the income you repay it with? For example a loan in dollars
    or euros repaid from sales in local currency.
  leads_to:
  - {indicator: CAS_COUNTRY_RISK_001, is: true, reason: Debt owed in a foreign currency also has to be converted and transferred
      abroad}
- id: OBS_FX_CAPEX_001
  question: Is any committed capital expenditure, or other large purchase commitment, priced in a currency other than that
    of the money set aside to pay for it?
  answer: yes_no
  assumption: Capital expenditure and large purchase commitments are funded in the currency in which they are priced
  disproved_by: 'yes'
  look_in: [06.02.a, 06.04.a, 01.02.a]
  evidence:
    best: [epc_contract, supply_agreement, material_contract]
    supporting: [investment_plan, financial_model, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: Are any of your equipment orders, building contracts or other large purchases priced in a foreign currency? In which
    currency is the money that will pay for them?
  if_unknown: A fall in the currency between the order and the payment would leave the investment plan short of funds.
- id: OBS_FX_TRANSLATION_001
  question: Does more than about a fifth of the party's assets, liabilities or profit sit in subsidiaries or balances that
    are kept in a currency other than its reporting currency?
  answer: yes_no
  assumption: Only a small part of the party's balance sheet and profit is translated from another currency
  disproved_by: 'yes'
  why: Translation moves reported equity, leverage and profit without any cash moving. That can breach a covenant on net
    worth or leverage.
  look_in: [03.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, organizational_chart]
    stated: [correspondence, call, officer_note]
  ask: Do you have subsidiaries, assets or liabilities that are kept in another currency and translated into your reporting
    currency? Roughly what share of the group do they make up?
  note: About a fifth is a guide. What counts is whether a currency move could breach a covenant by translation alone.
- id: OBS_FX_PASSTHROUGH_001
  question: When a fall in the local currency raises its input costs, can the party raise its selling prices to recover
    the rise within one quarter?
  answer: choice
  options: [full_passthrough, partial, administered_prices, none]
  mitigant: true
  assumption: The party recovers a currency-driven rise in its input costs through its selling prices within one quarter
  flag_when: is not full_passthrough
  why: Only a full recovery within a quarter keeps the margin whole. With a partial one, or with prices set by the state,
    the party carries the rest itself.
  when:
  - {check: OBS_FX_INPUT_001, against: true}
  look_in: [03.01.a, 06.01.a, 03.01.b]
  evidence:
    best: [audited_annual_report, offtake_agreement, material_contract]
    supporting: [management_accounts, company_record]
    stated: [management_presentation, correspondence, call, officer_note]
  ask: When a weaker currency raises your input costs, can you raise your selling prices to match within a quarter, fully
    or in part? Or are your prices set or capped by the state?
  note: Look at what happened to the gross margin in the last year in which the currency fell sharply. That is better evidence
    than a price clause that has never been used.
- id: OBS_HEDGE_004
  question: In each foreign currency, is the gap between what the party receives and what it pays in a year (costs, capital
    expenditure and debt service) smaller than about a fifth of its yearly operating cash flow?
  answer: yes_no
  mitigant: true
  assumption: Receipts and payments in the same currency offset each other, so that only a small net amount is exposed
  disproved_by: 'no'
  when:
  - {check: OBS_FX_002, against: true}
  - {check: OBS_FX_INPUT_001, against: true}
  - {check: OBS_FX_008, against: true}
  - {check: OBS_FX_CAPEX_001, against: true}
  look_in: [03.01.a, 03.01.b, 03.02.b]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, financial_model, company_record]
    stated: [correspondence, call, officer_note]
  ask: Do you have costs or debt in the same foreign currencies as your revenue? For each currency, how much do you receive
    and how much do you pay in a year?
  note: About a fifth is a guide. Take the year of the loan in which the gap is widest. The risk note in the audited accounts
    usually gives the net position in each currency.
- id: OBS_HEDGE_003
  question: What share of the party's net foreign-currency exposure of the next twelve months is covered by hedging contracts
    (forwards, swaps or options)?
  answer: number
  unit: percent
  mitigant: true
  assumption: Hedging contracts cover most of the party's net foreign-currency exposure of the next twelve months
  flag_when: at most 50
  why: When half or less is hedged, at least half of any currency move still reaches the cash flow. Treasury policies commonly
    hedge between half and all of the committed exposure of the coming year. An institution can set its own point.
  when:
  - {check: OBS_FX_002, against: true}
  - {check: OBS_FX_INPUT_001, against: true}
  - {check: OBS_FX_008, against: true}
  - {check: OBS_FX_CAPEX_001, against: true}
  look_in: [04.03.a, 03.01.a]
  evidence:
    best: [hedge_document, audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [correspondence, call, officer_note]
  ask: What part of your foreign-currency exposure for the next twelve months is hedged today, and with which contracts?
    Please share the confirmations or the bank's hedge report.
  note: Count only contracts that are signed. Where there are none, the answer is 0. The party's own figure needs the bank's
    confirmations behind it.
- id: OBS_HEDGE_TENOR_001
  question: 'Do the hedging contracts run for as long as the exposure they cover: for a loan in a foreign currency, to its
    final maturity?'
  answer: yes_no
  mitigant: true
  assumption: The hedges run for as long as the exposure they cover
  disproved_by: 'no'
  when:
  - {check: OBS_FX_002, against: true}
  - {check: OBS_FX_INPUT_001, against: true}
  - {check: OBS_FX_008, against: true}
  - {check: OBS_FX_CAPEX_001, against: true}
  look_in: [04.03.a, 03.01.b]
  evidence:
    best: [hedge_document]
    supporting: [management_accounts, debt_schedule]
    stated: [correspondence, call, officer_note]
  note: Where hedges are rolled over each year, the answer is no. The party then depends on being able to roll them, at
    a price nobody knows yet. Where there are no hedging contracts, the answer is no.
- id: OBS_HEDGE_COUNTERPARTY_001
  question: Are the hedging contracts made under a signed master agreement with a supervised bank that is not part of the
    party's own group?
  answer: yes_no
  mitigant: true
  assumption: The hedges are with a supervised bank outside the group, under a signed agreement
  disproved_by: 'no'
  when:
  - {check: OBS_FX_002, against: true}
  - {check: OBS_FX_INPUT_001, against: true}
  - {check: OBS_FX_008, against: true}
  - {check: OBS_FX_CAPEX_001, against: true}
  look_in: [04.03.a, 10.03.a]
  evidence:
    best: [hedge_document, credit_rating_report]
    supporting: [company_record, management_accounts]
    stated: [correspondence, call, officer_note]
  note: Record the bank's rating where it has one. A hedge with a weak bank fails when the currency moves most. Where there
    are no hedging contracts, the answer is no.
- id: OBS_HEDGE_001
  question: Has the party's board approved a written policy that says which foreign-currency exposures are hedged, up to
    what share, for how long and with which instruments?
  answer: yes_no
  mitigant: true
  assumption: The party hedges its currency exposure under a written policy approved by its board
  disproved_by: 'no'
  when:
  - {check: OBS_FX_002, against: true}
  - {check: OBS_FX_INPUT_001, against: true}
  - {check: OBS_FX_008, against: true}
  - {check: OBS_FX_CAPEX_001, against: true}
  look_in: [02.05.a, 03.01.a, 02.02.a]
  evidence:
    best: [corporate_governance_policy, audited_annual_report]
    supporting: [board_minutes, company_record]
    stated: [correspondence, call, officer_note, management_presentation]
  ask: Do you have a written policy for managing currency risk, approved by your board? Please share it.
  note: A policy shows that hedging is done by rule and will be kept up. It does not show how much is hedged today, which
    OBS_HEDGE_003 asks.
