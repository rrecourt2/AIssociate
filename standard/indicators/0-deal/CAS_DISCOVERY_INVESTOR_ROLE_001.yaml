id: CAS_DISCOVERY_INVESTOR_ROLE_001
title: The request
pillar: deal
claim: The lender can provide what is asked for, the money goes to a use that can be checked and not to someone who is already
  in the business, and with the other sources it pays for the whole plan.
due_by: screening
applies_to: [deal]
matters_more_when:
- {check: OBS_LIFECYCLE_001, is: distressed, reason: 'In a business in distress, new money is often wanted to pay out those
    who are already in it'}
- {check: OBS_LIFECYCLE_001, is: greenfield, reason: A new business that runs out of money before it is finished earns nothing
    to repay with}
look_again_when:
- {new_source: term_sheet, reason: 'A new term sheet can change the amount, the rank or the purpose'}
- {new_source: investment_plan, reason: A new plan of sources and uses can change where the money goes and whether the plan
    is funded}
checks:
- id: OBS_REQUEST_001
  question: 'What is the lender asked for: how much, in which currency, for how long and for what purpose?'
  answer: text
  why: Everything else is read against the request. The answer also puts the facility into the structure.
  calls_for:
  - {answered: true, kind: facility}
  look_in: [04.01.a, 01.02.a, 01.01.a]
  evidence:
    best: [term_sheet, facility_agreement]
    supporting: [investment_plan, internal_memo]
    stated: [executive_summary, correspondence, call, analyst_note]
  ask: What are you asking us for? How much, in which currency, for how long, and what will the money pay for?
- id: OBS_REQUEST_003
  question: 'Does the money pay for a project or an asset that can be named: something that is built, bought or expanded,
    such as a plant, a production line or a site?'
  answer: yes_no
  why: The checks on a project are asked of the project that the loan pays for, and of no other. A yes puts that project
    or asset into the structure, linked to the facility. A no means that the money goes into the business as a whole.
  calls_for:
  - is: true
    link: [finances]
  look_in: [01.02.a, 04.01.a, 01.01.a]
  evidence:
    best: [term_sheet, facility_agreement]
    supporting: [investment_plan, internal_memo]
    stated: [executive_summary, business_plan, correspondence, call, analyst_note]
  ask: Will the money pay for one thing that you can name, such as a new plant or line, or the purchase of an asset? Or
    will it go into the business as a whole?
  note: Record the project or the asset as a subject, and link the facility to it with a link of the kind finances. Where
    the money pays for several, link each of them. Working capital, a refinancing and general purposes are a no. Other projects
    of the business are described in facts and on pages. They get no such link and are not checked.
  leads_to:
  - {indicator: CAS_FEASIBILITY_001, is: true, reason: 'What the loan pays for is described there, and examined for whether
      it can be built or bought and run as planned'}
- id: OBS_INVESTOR_ROLE_001
  question: Where would the lender rank against the others who have put money into the business?
  answer: choice
  options: [senior_secured, senior_unsecured, subordinated, mezzanine, preferred_equity, common_equity, co_invest, guarantee]
  why: The rank says who is paid before the lender when there is not enough for everyone, and so what has to be known about
    those who stand ahead.
  look_in: [04.01.a, 04.02.c]
  evidence:
    best: [term_sheet, facility_agreement, intercreditor_agreement]
    supporting: [internal_memo]
    stated: [correspondence, call, analyst_note]
  ask: What kind of financing are you looking for? A senior loan with or without security, a loan that ranks behind other
    lenders, equity, or a guarantee?
  if_unknown: Until the rank is known, nobody can say who would be paid before the lender.
  note: Choose guarantee where the lender gives a guarantee and lends no money. Choose co_invest where the lender takes
    a share in another investor's deal, on that investor's terms.
- id: OBS_INVESTOR_ROLE_002
  question: Does the business already have other financing in place (loans from banks or other lenders, bonds, leases, shareholder
    loans)?
  answer: yes_no
  why: Opens the topic. The new loan has to fit beside what is already there. A "no" is checked against the accounts and
    the registry under existing debt.
  calls_for:
  - is: true
    link: [lends_to, ranks_behind]
  look_in: [03.01.a, 04.03.a]
  evidence:
    best: [audited_annual_report, facility_agreement]
    supporting: [debt_schedule, management_accounts, term_sheet, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Does the business already have loans, bonds, leases or shareholder loans? A yes or no is enough to start with.
  leads_to:
  - {indicator: CAS_OTHER_LENDERS_001, is: true, reason: 'Each lender that is already there can rank ahead, hold security
      or call its loan first'}
  - {indicator: CAS_DEBT_001, is: true, reason: 'What is already owed, and how it has been paid, is examined there'}
- id: OBS_INVESTOR_ROLE_003
  question: 'What does the financing of the business consist of: for each loan or other financing the provider, the amount,
    the rank, the security and the final maturity, and the equity the owners have paid in?'
  answer: text
  why: Shows what stands ahead of the lender, beside it and behind it, and when the others must be repaid.
  due_by: concept
  when:
  - {check: OBS_INVESTOR_ROLE_002, is: true}
  look_in: [04.03.a, 03.01.a, 04.02.c]
  evidence:
    best: [audited_annual_report, facility_agreement, intercreditor_agreement]
    supporting: [debt_schedule, management_accounts, shareholder_register, annual_report, prospectus]
    stated: [correspondence, call, analyst_note]
  ask: Please list all the financing of the business. For each loan or lease we need the lender, the amount, the security
    and the final repayment date, and we need the equity that has been paid in. A table is ideal.
  if_unknown: Without the full list, nobody can say what ranks ahead of the lender or what falls due before its loan.
- id: OBS_REQUEST_002
  question: Are the amount, the currency, the tenor and the rank that are asked for all within what the lender's own policies
    and limits allow for this country, this sector and this client?
  answer: yes_no
  assumption: The lender can provide what is asked for under its own policies and limits
  disproved_by: 'no'
  evidence:
    best: [internal_memo]
    stated: [analyst_note, call]
  ask_whom: lender
  note: This is about the lender's own products and limits. For the country limit, ask whoever keeps the limits and record
    the date. Whether the lender is the right source of the money is asked under impact and additionality.
- id: OBS_USE_001
  question: Is the use of the money set out item by item, each with an amount, so that every item can later be checked against
    an invoice, a contract or a payment?
  answer: yes_no
  assumption: The use of the money is specific enough to be checked after it is paid out
  disproved_by: 'no'
  due_by: concept
  look_in: [01.02.a, 04.01.a]
  evidence:
    best: [facility_agreement, technical_feasibility]
    supporting: [investment_plan, term_sheet, financial_model]
    stated: [business_plan, executive_summary, call, analyst_note]
  ask: Could you give us a list of what the money will pay for, with an amount for each item?
  note: A purpose such as "general corporate purposes", "expansion" or "working capital", without a list of what is to be
    paid for, is a no.
- id: OBS_USE_002
  question: Does any part of the money go to shareholders, related parties or existing lenders (to repay a loan, buy shares,
    pay a dividend or settle an amount owed to them)?
  answer: yes_no
  assumption: All of the money goes into the business, and none of it pays out someone who is already in it
  disproved_by: 'yes'
  calls_for:
  - is: true
    link: [lends_to, owns]
  look_in: [01.02.a, 04.01.a, 03.01.a]
  evidence:
    best: [facility_agreement, audited_annual_report]
    supporting: [investment_plan, term_sheet, debt_schedule, annual_report, prospectus]
    stated: [executive_summary, correspondence, call, analyst_note]
  ask: Will any of the money be used to repay an existing loan or a shareholder loan, to settle an amount owed to a related
    company, to pay a dividend or to buy shares?
  note: Record with the answer who is paid, how much, and why that party wants its money now. A refinancing is not a fault
    in itself. The point is to know who leaves, and whether they leave because they know something.
  leads_to:
  - {indicator: CAS_OTHER_LENDERS_001, is: true, reason: A lender that is repaid may know the business better than the lender
      that replaces it}
  - {indicator: CAS_RELATED_PARTY_001, is: true, reason: Money that goes to owners or related parties leaves the business
      the loan is repaid from}
- id: OBS_USE_003
  question: Do the committed sources of money (this loan, other loans and the owners' own money) cover the whole cost of
    what is planned, including an allowance for cost overruns and the working capital needed until the plan pays for itself?
  answer: yes_no
  assumption: The whole plan is funded from committed sources, with room for overruns and for working capital
  disproved_by: 'no'
  due_by: concept
  look_in: [01.02.a, 03.02.b, 04.03.b]
  evidence:
    best: [technical_feasibility, facility_agreement, dfi_facility_document]
    supporting: [investment_plan, financial_model, board_resolution, bank_statement]
    stated: [business_plan, correspondence, call, analyst_note]
  ask: Could you show us the full cost of the plan and where each part of the money comes from? Which of these sources are
    signed or already paid in, and which are still being discussed?
  if_unknown: A plan that is only partly funded can stop half way, with the lender's money already spent.
  note: Committed means signed or paid in. A source that is still being negotiated is not committed. Equity the sponsor
    intends to put in, or a loan still in another lender's approval process, is not committed. Say how much is still open
    and who is expected to provide it.
  leads_to:
  - {indicator: CAS_COMPLETION_SUPPORT_001, is: false, reason: A gap in the funding has to be closed by someone who is bound
      to close it}
  - {indicator: CAS_CONDITIONS_001, is: false, reason: Funding that is not yet committed is usually made a condition of
      the first drawdown}
- id: OBS_USE_004
  question: Is at least about a third of the cost of the plan paid in cash by the owners or from the business's own retained
    cash, before the lender's money or in step with it, and not in kind, by revaluing assets or with borrowed money?
  answer: yes_no
  assumption: The owners carry a share of the plan in cash and stand to lose it first
  disproved_by: 'no'
  due_by: concept
  when:
  - {check: OBS_CAPEX_PLAN_001, is: true}
  - {check: OBS_LIFECYCLE_001, is: greenfield}
  look_in: [03.01.a, 04.01.a, 01.02.a]
  evidence:
    best: [audited_annual_report, facility_agreement, jv_agreement]
    supporting: [investment_plan, financial_model, bank_statement, shareholder_resolution, annual_report, prospectus]
    stated: [business_plan, correspondence, call, analyst_note]
  ask: How much of the cost of the plan do the owners pay themselves, in cash? When is that money paid in, before our loan
    is drawn or alongside it, and where does it come from?
  note: A third is a guide. An institution can set its own share.
  leads_to:
  - {indicator: CAS_SOURCE_OF_FUNDS_001, reason: 'Where the owners'' money comes from, and whether it is theirs, is examined
      there'}
- id: OBS_USE_MIT_001
  question: Is everything that is paid out owed to a lender that is neither a shareholder nor a related party, on a loan
    that was being paid as agreed (no missed payment, waiver or rescheduling in the last twelve months)?
  answer: yes_no
  mitigant: true
  assumption: Only outside lenders are repaid, on loans that were being paid as agreed, so the lender replaces a creditor
    and neither rescues one nor pays out an owner
  disproved_by: 'no'
  due_by: diligence
  when:
  - {check: OBS_USE_002, against: true}
  look_in: [03.01.a, 04.03.a, 10.02.a]
  evidence:
    best: [audited_annual_report, correspondence]
    supporting: [debt_schedule, bank_statement, management_accounts, annual_report, prospectus]
    stated: [call, analyst_note]
  note: A letter counts as best evidence only if it comes from the lender that is repaid. Twelve months is a guide.
