id: CAS_LITIGATION_001
title: Litigation & Disputes
workstream: WS_LEG
due_by: diligence
applies_to: [borrower]
why_it_matters:
  debt: Material litigation can impair cash flow or force asset disposals
  equity: Litigation overhang may depress valuation if unresolved
matters_more_when:
- check: OBS_BORROWER_001
  is: operating_entity
  reason: Operating entities face broader litigation exposure from operations
- check: OBS_SECTOR_001
  is: corporate
  reason: Corporate entities may face product liability, employment, or commercial disputes
checks:
- id: OBS_LIT_001
  question: Are there any pending or threatened legal proceedings against the entity?
  answer: yes_no
  assumption: Entity is free from material litigation risk
  disproved_by: 'yes'
  due_by: screening
  look_in: [02.04.a]
  evidence:
    best: [legal_opinion, audited_annual_report]
    supporting: [internal_memo, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: Is your company currently involved in any lawsuits, arbitrations, or other legal proceedings? Are there any
    threatened claims or disputes that could result in legal action? Please include any details from your auditors'
    notes on contingent liabilities.
  note: 'If no: regulatory investigations still need checking.'
- id: OBS_LIT_002
  question: What is the total estimated financial exposure from pending proceedings?
  answer: number
  unit: currency
  assumption: Litigation exposure is immaterial to the entity's financial position
  after: [OBS_LIT_001]
  when:
  - check: OBS_LIT_001
    is: true
  look_in: [02.04.a]
  evidence:
    best: [legal_opinion, audited_annual_report]
    supporting: [internal_memo]
    stated: [correspondence]
  ask: What is the total estimated financial exposure from all pending legal proceedings? This includes potential
    damages, settlement amounts, and legal costs. Your legal counsel or auditors should have an estimate.
- id: OBS_LIT_003
  question: Has the entity made adequate financial provisions for litigation exposure?
  answer: yes_no
  assumption: Litigation risk is adequately provisioned in the financial statements
  disproved_by: 'no'
  after: [OBS_LIT_001]
  when:
  - check: OBS_LIT_001
    is: true
  look_in: [02.04.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, legal_opinion]
    stated: [correspondence]
  ask: Has the company set aside adequate financial provisions (reserves) for potential losses from pending legal
    proceedings? This should be visible in the financial statements under provisions or contingent liabilities.
- id: OBS_LIT_004
  question: Are there any ongoing or pending regulatory investigations involving the entity?
  answer: yes_no
  assumption: Entity is not subject to regulatory scrutiny
  disproved_by: 'yes'
  after: [OBS_LIT_001]
  when:
  - check: OBS_LIT_001
    is: false
  look_in: [02.04.a]
  evidence:
    best: [regulatory_document, legal_opinion]
    supporting: [internal_memo, company_record]
    stated: [correspondence, call, officer_note]
  ask: Is the company subject to any regulatory investigations, inquiries, or enforcement proceedings by any government
    agency or regulatory body? This includes tax authorities, sector regulators, or anti-corruption bodies.
- id: OBS_LIT_005
  question: Has the entity been subject to any enforcement actions or sanctions in the past five years?
  answer: yes_no
  assumption: Entity has a clean regulatory track record
  disproved_by: 'yes'
  after: [OBS_LIT_004]
  when:
  - check: OBS_LIT_004
    is: true
  look_in: [02.04.a]
  evidence:
    best: [regulatory_document, legal_opinion]
    supporting: [company_record]
    stated: [correspondence, call, officer_note]
  ask: Has the company received any fines, sanctions, or enforcement actions from regulators in the past five years?
    This includes penalties for non-compliance with any laws or regulations.
