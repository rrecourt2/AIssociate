id: CAS_REGULATORY_001
title: Regulatory Compliance
workstream: WS_LEG
due_by: diligence
applies_to: [borrower]
why_it_matters:
  debt: Regulatory non-compliance can trigger license revocation, destroying debt service capacity
  equity: Regulatory barriers to entry can protect franchise value
matters_more_when:
- check: OBS_SECTOR_001
  is: financial_institution
  reason: Financial institutions face pervasive regulation — compliance is existential
- check: OBS_VALUE_CHAIN_001
  is: concessionaire
  reason: Concessionaires operate under regulatory frameworks — license conditions are critical
- check: OBS_SECTOR_003
  is: true
  reason: Regulated entity confirmed — regulatory compliance is a core requirement
- check: OBS_SECTOR_001
  is: infrastructure
  reason: Infrastructure typically operates under regulatory or concession frameworks
checks:
- id: OBS_REG_001
  question: Does the entity operate in a regulated industry requiring specific licenses or permits?
  answer: yes_no
  assumption: Entity operates in unregulated space with no licensing requirements
  disproved_by: 'yes'
  due_by: screening
  look_in: [02.06.a]
  evidence:
    best: [operational_license, regulatory_document]
    supporting: [legal_opinion, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your company operate in a regulated industry? Do you need specific licenses, permits, or regulatory
    approvals to carry out your business activities? Examples include banking licenses, telecom licenses, mining
    permits, or environmental permits.
- id: OBS_REG_002
  question: Are all required licenses and permits current and in good standing?
  answer: yes_no
  assumption: Entity is fully licensed to conduct its operations
  disproved_by: 'no'
  after: [OBS_REG_001]
  when:
  - check: OBS_REG_001
    is: true
  look_in: [02.06.a]
  evidence:
    best: [operational_license, regulatory_document]
    supporting: [legal_opinion]
    stated: [correspondence, call, officer_note]
  ask: Are all your licenses and permits current? Have they been renewed on time? Please share copies of your key
    licenses or a confirmation from the regulator that they are in good standing.
- id: OBS_REG_003
  question: Has the entity received any regulatory notices, warnings, or show-cause orders?
  answer: yes_no
  assumption: Entity has not attracted adverse regulatory attention
  disproved_by: 'yes'
  after: [OBS_REG_001]
  when:
  - check: OBS_REG_001
    is: true
  look_in: [02.06.a]
  evidence:
    best: [regulatory_document]
    supporting: [legal_opinion, company_record]
    stated: [correspondence, call, officer_note]
  ask: Has your company received any notices, warnings, or show-cause orders from any regulatory body? This includes
    notices of non-compliance, breach notices, or requests for corrective action.
- id: OBS_REG_004
  question: Is there pending or proposed regulation that could materially affect the business?
  answer: yes_no
  assumption: Regulatory environment is stable and predictable
  disproved_by: 'yes'
  look_in: [02.06.a]
  evidence:
    best: [legal_opinion, regulatory_document]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Are you aware of any upcoming regulations, legislative changes, or regulatory reforms that could significantly
    affect your business? This includes changes to licensing requirements, pricing regulations, tax rules, or environmental
    standards.
  if_unknown: Regulatory horizon not assessed
