id: CAS_ENERGY_REGULATORY_001
title: Energy Regulatory Framework
workstream: WS_LEG
due_by: concept
applies_to: [project]
applies_when:
- check: OBS_SECTOR_002
  is: renewable_energy
- check: OBS_SECTOR_002
  is: conventional_power
checks:
- id: OBS_EREG_001
  question: Does the project hold the required energy generation license or permit?
  answer: yes_no
  assumption: Project is licensed to generate and sell electricity
  disproved_by: 'no'
  due_by: screening
  look_in: [07.01.a, 07.02.a]
  evidence:
    best: [operational_license, regulatory_document]
    supporting: [legal_opinion, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Does the project hold the required energy generation license or permit from the relevant energy regulatory
    authority? Please share a copy of the license or permit, or confirm the license number, issuing authority, and
    validity period.
  if_unknown: Licensing status unknown — cannot confirm right to operate
- id: OBS_EREG_002
  question: Is the tariff structure regulated, or does the project sell at merchant prices?
  answer: choice
  options: [regulated_tariff, feed_in_tariff, auction_price, merchant, hybrid]
  assumption: Revenue pricing mechanism is understood and predictable
  after: [OBS_EREG_001]
  when:
  - check: OBS_EREG_001
    is: true
  look_in: [06.01.a, 07.01.a]
  evidence:
    best: [offtake_agreement, regulatory_document]
    supporting: [legal_opinion, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Is the project's electricity selling price regulated by a tariff authority, set through a competitive auction,
    or determined by merchant market prices? Please describe the pricing mechanism and share the relevant tariff
    order, PPA pricing clause, or auction award letter.
  if_unknown: Tariff structure not clarified — revenue predictability unclear
- id: OBS_EREG_003
  question: Is there material risk of adverse regulatory change affecting the project's economics?
  answer: yes_no
  assumption: Regulatory framework is stable with no pending adverse changes
  disproved_by: 'yes'
  after: [OBS_EREG_001]
  when:
  - check: OBS_EREG_001
    is: true
  look_in: [07.01.a, 07.02.a]
  evidence:
    best: [legal_opinion, regulatory_document]
    supporting: [consultant_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Is there a risk that government or regulatory changes could adversely affect the project's revenue or operating
    conditions? This includes proposed changes to tariffs, renewable energy policies, grid access rules, or tax
    incentives. Has your legal counsel assessed the regulatory change risk?
  if_unknown: Regulatory change risk not assessed — potential for adverse policy shifts
- id: OBS_EREG_004
  question: Is the project dependent on government subsidies, tax incentives, or preferential tariffs?
  answer: yes_no
  assumption: Project economics are viable without subsidy support
  disproved_by: 'yes'
  after: [OBS_EREG_001]
  look_in: [06.01.a, 07.01.a, 05.01.a]
  evidence:
    best: [technical_feasibility, offtake_agreement, regulatory_document]
    supporting: [business_plan, consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Is the project dependent on government subsidies, tax incentives (such as accelerated depreciation or tax
    holidays), or preferential tariffs (such as feed-in tariffs) for its financial viability? Would the project
    remain viable if these incentives were reduced or removed?
  if_unknown: Subsidy dependency not assessed — risk of stranded investment if incentives withdrawn
  leads_to:
  - indicator: CAS_REVENUE_001
    is: true
    reason: Subsidy-dependent project — revenue analysis must assess downside without incentives
- id: OBS_EREG_005
  question: Does the project comply with applicable grid code requirements?
  answer: yes_no
  assumption: Project meets all grid code technical requirements for connection and operation
  disproved_by: 'no'
  after: [OBS_EREG_001]
  when:
  - check: OBS_EREG_001
    is: true
  look_in: [07.01.a]
  evidence:
    best: [material_contract, technical_feasibility, regulatory_document]
    supporting: [consultant_report]
    stated: [correspondence, call, officer_note]
  ask: Does the project comply with the applicable grid code requirements? This includes technical standards for
    frequency response, voltage regulation, fault ride-through, and power quality. Please share the grid code compliance
    certificate or the interconnection study that confirms compliance.
  if_unknown: Grid code compliance not confirmed — risk of connection refusal or penalties
