id: CAS_CONTRACT_REVIEW_001
title: Material Contracts Review
workstream: WS_LEG
due_by: diligence
applies_to: [borrower]
checks:
- id: OBS_CONT_001
  question: Does the entity have material contracts that represent a significant portion of revenue or operations?
  answer: yes_no
  assumption: Entity's revenue is diversified and not dependent on specific contracts
  disproved_by: 'yes'
  due_by: screening
  look_in: [02.05.a]
  evidence:
    best: [material_contract, audited_annual_report]
    supporting: [internal_memo, management_accounts]
    stated: [correspondence, call, officer_note]
  ask: Does your company have any material contracts — contracts that represent a significant portion of your revenue,
    or that your business depends on? Examples include major customer contracts, supply agreements, distribution
    agreements, or joint venture agreements.
- id: OBS_CONT_002
  question: What are the key terms and conditions of material contracts?
  answer: text
  assumption: Material contract terms are understood and acceptable
  after: [OBS_CONT_001]
  when:
  - check: OBS_CONT_001
    is: true
  look_in: [02.05.a]
  evidence:
    best: [material_contract]
    supporting: [legal_opinion, internal_memo]
    stated: [correspondence]
  ask: 'Please share copies of your material contracts, or a summary of key terms including: parties, duration,
    pricing, termination provisions, renewal terms, and any unusual clauses. We need to understand the commercial
    commitments.'
- id: OBS_CONT_003
  question: Do any material contracts contain change-of-control provisions?
  answer: yes_no
  assumption: Transaction will not trigger change-of-control clauses in existing contracts
  disproved_by: 'yes'
  after: [OBS_CONT_001]
  when:
  - check: OBS_CONT_001
    is: true
  look_in: [02.05.a]
  evidence:
    best: [material_contract, legal_opinion]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Do any of your material contracts include change-of-control provisions? These are clauses that allow a counterparty
    to terminate or renegotiate the contract if there is a change in ownership or control of your company.
- id: OBS_CONT_004
  question: Are there material contracts expiring or due for renewal within 12 months?
  answer: yes_no
  assumption: Revenue base is secure for the near term
  disproved_by: 'yes'
  after: [OBS_CONT_001]
  when:
  - check: OBS_CONT_001
    is: true
  look_in: [02.05.a]
  evidence:
    best: [material_contract, internal_memo]
    supporting: [management_accounts]
    stated: [correspondence, call, officer_note]
  ask: Are any of your material contracts expiring within the next 12 months? If so, what is the plan for renewal?
    Are there risks that counterparties may not renew, or may seek significantly different terms?
  if_unknown: Contract expiry schedule not available
