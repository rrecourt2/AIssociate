id: CAS_LIQUIDITY_001
title: Liquidity Assessment
workstream: WS_FIN
due_by: diligence
applies_to: [borrower, guarantor]
why_it_matters:
  debt: Liquidity shortfall is often the proximate cause of default
  equity: Excess liquidity may indicate inefficient capital deployment
  hybrid: liquidity risk for subordinated positions — cash sweep exposure
matters_more_when:
- check: OBS_BORROWER_001
  is: operating_entity
  reason: Operating entity — working capital and liquidity management are core
- check: OBS_LIFECYCLE_001
  is: distressed
  reason: Distressed entity — liquidity is the immediate survival concern
- check: OBS_LIFECYCLE_001
  is: greenfield
  reason: Greenfield — liquidity needs during construction phase are critical
matters_less_when:
- check: OBS_BORROWER_001
  is: spv
  reason: SPV — liquidity typically governed by reserve accounts and waterfall
checks:
- id: OBS_LIQ_001
  question: Does the entity maintain cash reserves?
  answer: yes_no
  assumption: Entity has no liquidity buffer
  disproved_by: 'yes'
  due_by: screening
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [bank_statement, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your company keep cash reserves or liquid investments on hand? A simple yes or no is fine — we will
    ask about the amount later if needed.
- id: OBS_LIQ_002
  question: What is the current ratio?
  answer: number
  unit: ratio
  assumption: Short-term liquidity is adequate
  after: [OBS_LIQ_001]
  when:
  - check: OBS_LIQ_001
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: What is your company's current ratio (current assets divided by current liabilities)? If you don't have this
    number handy, we can calculate it from your latest balance sheet.
- id: OBS_LIQ_003
  question: Does the entity have access to committed credit lines?
  answer: yes_no
  assumption: Entity has no backstop liquidity facility
  disproved_by: 'yes'
  after: [OBS_LIQ_001]
  look_in: [10.01.a, 03.01.a]
  evidence:
    best: [facility_agreement]
    supporting: [audited_annual_report, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your company have access to any committed credit lines or overdraft facilities that you can draw on
    if needed? Please include both drawn and undrawn amounts.
- id: OBS_LIQ_004
  question: Has the entity experienced cash flow shortfalls in the past 2 years?
  answer: yes_no
  assumption: Cash flow has been consistently positive
  disproved_by: 'yes'
  after: [OBS_LIQ_001]
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, bank_statement]
    stated: [correspondence, call, officer_note]
  ask: In the last two years, has your company ever run short of cash to meet its obligations — for example, delayed
    payments to suppliers, missed payroll, or needed emergency funding?
  if_unknown: Cash flow history not available for the past 2 years
- id: OBS_LIQ_005
  question: What is the average days payable outstanding?
  answer: number
  unit: days
  assumption: Payment practices are within normal terms
  after: [OBS_LIQ_004]
  when:
  - check: OBS_LIQ_004
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [company_record, internal_memo]
    stated: [call, officer_note]
  ask: On average, how many days does it take your company to pay its suppliers? If you have an accounts payable
    aging report, that would be ideal.
