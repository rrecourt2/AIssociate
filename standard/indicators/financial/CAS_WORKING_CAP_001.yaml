id: CAS_WORKING_CAP_001
title: Working Capital Assessment
workstream: WS_FIN
due_by: diligence
applies_to: [borrower]
look_again_when:
- check: OBS_RP_PERIMETER_001
  is: true
  reason: Reporting perimeter changed — working-capital trends are not comparable across the restructuring
checks:
- id: OBS_WC_001
  question: What is the cash conversion cycle?
  answer: number
  unit: days
  assumption: Working capital cycle is efficient
  due_by: concept
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: How many days does it take from paying your suppliers to collecting cash from your customers? If you don't
    know this number, we can calculate it from your receivables, inventory, and payables figures.
- id: OBS_WC_002
  question: Are receivables aging within normal terms?
  answer: yes_no
  assumption: Customers are paying on time
  disproved_by: 'no'
  after: [OBS_WC_001]
  when:
  - check: OBS_WC_001
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [company_record]
    stated: [call, officer_note]
  ask: Are your customers generally paying within the agreed credit terms? An accounts receivable aging report would
    be ideal, but you can also tell us your average days sales outstanding (DSO).
  if_unknown: Receivables aging data not available
- id: OBS_WC_003
  question: Is inventory management documented?
  answer: yes_no
  assumption: Inventory is managed with formal policies and controls
  disproved_by: 'no'
  after: [OBS_WC_001]
  when:
  - check: OBS_WC_001
    is: true
  look_in: [03.01.a, 06.01.a]
  evidence:
    best: [audited_annual_report, company_record]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: Does your company have documented inventory management practices — for example, stock count procedures, reorder
    policies, or inventory tracking systems? This is mainly relevant if you hold physical stock.
- id: OBS_WC_004
  question: Has working capital requirement increased disproportionately to revenue?
  answer: yes_no
  assumption: Working capital scales proportionately with business growth
  disproved_by: 'yes'
  after: [OBS_WC_001]
  when:
  - check: OBS_WC_001
    is: true
  - check: OBS_WC_002
    is: false
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: Over the past 2-3 years, has the amount of cash tied up in your day-to-day operations (receivables plus inventory
    minus payables) grown faster than your revenue? We can check this from your financial statements if you share
    them.
  if_unknown: Multi-year working capital trend data not available
