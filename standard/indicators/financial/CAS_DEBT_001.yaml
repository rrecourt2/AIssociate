id: CAS_DEBT_001
title: Debt Structure Assessment
workstream: WS_FIN
due_by: diligence
applies_to: [borrower, guarantor]
why_it_matters:
  debt: Debt burden and maturity profile are the primary downside concern for lenders
  hybrid: Mezzanine/subordinated position requires understanding of senior debt cushion
  equity: Debt is relevant context for equity but not the primary value driver
matters_more_when:
- check: OBS_INVESTOR_ROLE_001
  is: senior_secured
  reason: Senior secured investor — understanding existing debt structure is critical
- check: OBS_INVESTOR_ROLE_001
  is: senior_unsecured
  reason: Senior unsecured investor — debt layering and subordination matter
- check: OBS_INVESTOR_ROLE_002
  is: true
  reason: Existing capital structure — intercreditor dynamics need assessment
- check: OBS_LIFECYCLE_001
  is: distressed
  reason: Distressed entity — debt restructuring analysis essential
matters_less_when:
- check: OBS_INVESTOR_ROLE_001
  is: common_equity
  reason: Equity investor — debt is context, not the primary concern
checks:
- id: OBS_DEBT_001
  question: Does the entity have existing debt?
  answer: yes_no
  assumption: Entity is debt-free
  disproved_by: 'yes'
  due_by: screening
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [internal_memo, company_record]
    stated: [correspondence, call, officer_note]
  ask: Does your company currently owe money to any banks, lenders, or other creditors? A simple yes or no is enough
    to start — we can get into the details later.
- id: OBS_DEBT_002
  question: What is the total debt outstanding?
  answer: number
  unit: currency
  assumption: Debt quantum is immaterial
  after: [OBS_DEBT_001]
  when:
  - check: OBS_DEBT_001
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, facility_agreement]
    stated: [correspondence]
  ask: What is the total amount of debt your company currently owes across all lenders? Please include both short-term
    and long-term borrowings. An approximate figure from your latest accounts is fine.
  if_unknown: Total debt figure not available in current documents
- id: OBS_DEBT_003
  question: What is the debt maturity profile?
  answer: choice
  options: [short_term_dominant, balanced, long_term_dominant]
  assumption: Debt maturity is well-distributed
  after: [OBS_DEBT_001]
  when:
  - check: OBS_DEBT_001
    is: true
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, facility_agreement]
    stated: [internal_memo]
  ask: Is most of your debt due within the next year (short-term), spread across different timeframes (balanced),
    or mostly due in more than a year (long-term)? You can share a maturity schedule if available.
- id: OBS_DEBT_004
  question: Is there subordinated or mezzanine debt in the capital structure?
  answer: yes_no
  assumption: All debt is senior / pari passu
  disproved_by: 'yes'
  after: [OBS_DEBT_001]
  when:
  - check: OBS_DEBT_001
    is: true
  look_in: [03.01.a, 10.01.a]
  evidence:
    best: [facility_agreement, audited_annual_report]
    supporting: [term_sheet, internal_memo]
    stated: [call, officer_note]
  ask: Does your company have any subordinated debt or mezzanine financing? This is debt that ranks below senior
    lenders in priority of repayment.
- id: OBS_DEBT_005
  question: Are there debt covenants in existing facilities?
  answer: yes_no
  assumption: Existing debt is covenant-free
  disproved_by: 'yes'
  after: [OBS_DEBT_001]
  look_in: [10.01.a, 03.01.a]
  evidence:
    best: [facility_agreement]
    supporting: [audited_annual_report, company_certificate]
    stated: [correspondence, call, officer_note]
  ask: Do your current loan agreements include financial covenants — for example, minimum debt service coverage,
    maximum leverage, or restrictions on additional borrowing?
  leads_to:
  - indicator: CAS_COVENANT_DESIGN_001
    is: true
    reason: Existing covenants need review for new facility structuring
- id: OBS_DEBT_006
  question: What is the current debt-to-equity ratio?
  answer: number
  unit: ratio
  assumption: Leverage is within acceptable range
  after: [OBS_DEBT_001]
  when:
  - check: OBS_DEBT_001
    is: false
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: What is your company's debt-to-equity ratio? If you don't have this calculated, we can work it out from your
    latest balance sheet — just share total debt and total equity figures.
