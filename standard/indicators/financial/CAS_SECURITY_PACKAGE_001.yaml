id: CAS_SECURITY_PACKAGE_001
title: Security Package Design
workstream: WS_FIN
due_by: diligence
applies_to: [facility]
why_it_matters:
  debt: Security package quality determines recovery rate in downside scenarios
  equity: Security package is not a value driver for equity investors
  hybrid: subordination analysis — priority of claims in waterfall
matters_more_when:
- check: OBS_INVESTOR_ROLE_001
  is: senior_secured
  reason: Senior secured — security package is the primary downside protection
- check: OBS_INVESTOR_ROLE_001
  is: mezzanine
  reason: Mezzanine — second-priority security or structural protections matter
- check: OBS_INVESTOR_ROLE_001
  is: senior_unsecured
  reason: Senior unsecured — negative pledge and structural protections may substitute
matters_less_when:
- check: OBS_INVESTOR_ROLE_001
  is: common_equity
  reason: Equity investor — no security package; value protection through governance instead
- check: OBS_INVESTOR_ROLE_001
  is: preferred_equity
  reason: Preferred equity — limited security; liquidation preference provides some protection
checks:
- id: OBS_SECPKG_001
  question: What assets are available as security for the proposed transaction?
  answer: choice
  options: [real_estate, equipment, receivables, inventory, shares, cash_deposits, none]
  assumption: Entity has identifiable assets available as collateral
  due_by: screening
  look_in: [06.02.a]
  evidence:
    best: [audited_annual_report, company_record]
    supporting: [management_accounts, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: What assets does your company own that could be offered as security for this financing? Examples include
    real estate, equipment, receivables, inventory, or shares in subsidiaries. A summary of major assets with approximate
    values would be helpful.
- id: OBS_SECPKG_002
  question: Is a corporate guarantee available from a parent company or sponsor?
  answer: yes_no
  assumption: Transaction has credit support beyond the borrower's own assets
  disproved_by: 'no'
  after: [OBS_SECPKG_001]
  when:
  - check: OBS_SECPKG_001
    is: true
  look_in: [06.02.a]
  evidence:
    best: [guarantee_agreement, internal_memo]
    supporting: [audited_annual_report]
    stated: [correspondence, call, officer_note]
  ask: Is a parent company, holding company, or sponsor willing to provide a corporate guarantee for this transaction?
    If so, please share their financial statements so we can assess the guarantee's value.
- id: OBS_SECPKG_003
  question: Is real estate security available and unencumbered?
  answer: yes_no
  assumption: Real property collateral is available and free of prior claims
  disproved_by: 'no'
  after: [OBS_SECPKG_001]
  when:
  - check: OBS_SECPKG_001
    is: true
  look_in: [06.02.a, 07.01.a]
  evidence:
    best: [security_agreement, valuation_report]
    supporting: [legal_opinion]
    stated: [correspondence]
  ask: Does the company own real estate (land or buildings) that could serve as security? Are these properties free
    of existing mortgages or liens? Title deeds and a recent valuation would be very helpful.
  leads_to:
  - indicator: CAS_ASSET_CONDITION_001
    is: true
    reason: Real estate available as security — technical condition assessment needed
- id: OBS_SECPKG_004
  question: Are cash flow assignments from specific contracts or revenue streams feasible?
  answer: yes_no
  assumption: Cash flow assignment is a viable security mechanism
  disproved_by: 'no'
  after: [OBS_SECPKG_001]
  when:
  - check: OBS_SECPKG_001
    is: true
  look_in: [06.02.a]
  evidence:
    best: [material_contract, legal_opinion]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Can specific revenue streams or contract payments be assigned as security? For example, can payments from
    your main customers be directed through an escrow or collection account controlled by the lender?
- id: OBS_SECPKG_005
  question: Is the proposed security package consistent with the transaction's risk profile?
  answer: yes_no
  assumption: Security package adequately mitigates the identified risks
  disproved_by: 'no'
  after: [OBS_SECPKG_001]
  look_in: [06.02.a]
  evidence:
    best: [internal_memo]
    supporting: [company_record]
    stated: [correspondence, call, officer_note]
  ask: Considering the overall risk profile of the transaction, is the proposed combination of security (collateral,
    guarantees, assignments) sufficient? Does the total security cover provide adequate protection relative to the
    loan amount?
- id: OBS_FACILITY_EXPOSURE_001
  question: What exposure does this relationship carry for the facility?
  answer: number
  why: Facility exposure drives subject materiality and ask depth
  due_by: screening
  applies_to: [borrows]
  evidence:
    best: [term_sheet, facility_agreement]
    supporting: [internal_memo, company_record]
    stated: [correspondence]
- id: OBS_GUARANTEE_CAP_001
  question: What is the maximum guaranteed amount under this relationship?
  answer: number
  why: Guarantee cap drives sponsor materiality and ask depth
  due_by: screening
  applies_to: [guarantees]
  evidence:
    best: [guarantee_agreement, term_sheet]
    supporting: [internal_memo]
    stated: [correspondence]
- id: OBS_GUARANTEE_KIND_001
  question: What kind of guarantee does this relationship represent?
  answer: choice
  options: [payment, full, limited, partial_loss_share, performance]
  why: Guarantee type determines how credit support is interpreted
  due_by: screening
  applies_to: [guarantees]
  evidence:
    best: [guarantee_agreement, term_sheet]
    supporting: [internal_memo]
    stated: [correspondence]
