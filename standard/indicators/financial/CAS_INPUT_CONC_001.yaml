id: CAS_INPUT_CONC_001
title: Critical Input and Supplier Concentration
workstream: WS_FIN
due_by: diligence
applies_to: [borrower, guarantor]
why_it_matters:
  debt: An input interruption stops production and debt service capacity directly
  equity: Secured cheap input supply can be a structural margin advantage
matters_more_when:
- check: OBS_VALUE_CHAIN_001
  is: primary_producer
  reason: Primary producers typically convert one feedstock; concentration is structural
- check: OBS_VALUE_CHAIN_001
  is: manufacturer
  reason: Manufacturers often depend on a small number of critical inputs or utilities
risk:
  statement: Production depends on a concentrated or interruptible critical input
  checks: [OBS_INPUT_001, OBS_INPUT_002, OBS_INPUT_003, OBS_INPUT_004, OBS_INPUT_005, OBS_INPUT_006, OBS_INPUT_007]
mitigant:
  statement: Input supply is secured by tenor, price protection, or substitutability
  checks: [OBS_INPUT_MIT_001, OBS_INPUT_MIT_002, OBS_INPUT_MIT_003]
look_again_when:
- check: OBS_INPUT_005
  is: true
  reason: Supply interruption occurred — re-evaluate severity and mitigants
- new_source: supply_agreement
  reason: New supply contract filed — re-evaluate tenor and price protection
- older_than_days: 180
  checks: [OBS_INPUT_005, OBS_INPUT_006]
  reason: Interruption and contract-tenor data older than 6 months
checks:
- id: OBS_INPUT_001
  question: Does any single input (commodity, utility, or supplier) account for a material share of production cost?
  answer: yes_no
  assumption: Input base is diversified; no single dependency
  disproved_by: 'yes'
  due_by: screening
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [internal_memo]
    stated: [call, officer_note]
  ask: Is there one input — a feedstock, raw material, or utility such as gas or power — that your production cannot
    run without, or one supplier that provides a large share of your input costs? Name the input and supplier if
    so.
  note: 'If no: check the answer against the composition of cost of sales before treating the topic as closed.'
- id: OBS_INPUT_002
  question: What share of cost of sales does the largest single input represent?
  answer: number
  unit: percent
  assumption: Largest input is below the concentration threshold
  flag_when: above 30
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
  ask: Roughly what share of your cost of sales is the single largest input (for example feedstock gas, key raw
    material, or energy)?
- id: OBS_INPUT_003
  question: How many qualified suppliers can deliver the critical input at the required volume?
  answer: choice
  options: [single_source, dual_source, multiple, commodity_market]
  assumption: Input is freely substitutable across suppliers
  flag_when: is single_source
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [supply_agreement, audited_annual_report]
    supporting: [internal_memo]
    stated: [call, officer_note]
  ask: Could another supplier deliver this input at the volume you need — or is there effectively only one source
    (for example a dedicated gas allocation or single pipeline)?
  if_unknown: Supplier substitutability unknown — single-source risk cannot be assessed
- id: OBS_INPUT_004
  question: Is the input price or allocation administered by government policy, levy, or sovereign commitment?
  answer: yes_no
  assumption: Input pricing is market-based with no policy dependency
  disproved_by: 'yes'
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [supply_agreement, audited_annual_report]
    supporting: [internal_memo]
    stated: [call, officer_note]
  ask: Is the price or allocation of this input set or guaranteed by government policy — for example a sovereign
    pricing commitment, an allocation quota, or a levy/cess regime?
- id: OBS_INPUT_005
  question: Has supply of the critical input been interrupted or curtailed in the last 24 months?
  answer: yes_no
  assumption: No interruptions in the recent operating record
  disproved_by: 'yes'
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [audited_annual_report, quarterly_report]
    supporting: [internal_memo]
    stated: [call, officer_note]
  ask: Has this input ever been cut, curtailed, or suspended in the last two years — even briefly? Production volume
    tables in your reports will be compared against capacity, so please include partial curtailments.
  note: The company has a reason to understate this. Check it against an independent source.
- id: OBS_INPUT_006
  question: What is the remaining tenor of the supply contract in years?
  answer: number
  unit: years
  assumption: Supply is contracted well beyond the financing horizon
  flag_when: below 5
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [supply_agreement]
    supporting: [audited_annual_report, internal_memo]
    stated: [call, officer_note]
  ask: Until when is the supply of this input contractually secured? Please state the end date of the current supply
    agreement or allocation.
  if_unknown: Supply contract tenor unknown — cannot compare against facility maturity
- id: OBS_INPUT_007
  question: Is there pending litigation or regulatory action affecting input price or supply (levies, cess, allocation
    disputes)?
  answer: yes_no
  assumption: No input-side legal or regulatory exposure
  disproved_by: 'yes'
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [audited_annual_report]
    supporting: [legal_opinion, internal_memo]
    stated: [call, officer_note]
  ask: Are there any court cases, levies under dispute, or regulatory proceedings that affect what you pay for this
    input or whether you receive it?
- id: OBS_INPUT_MIT_001
  question: Which structural protections exist for the critical input?
  answer: choice
  options: [fixed_price_sovereign, take_or_pay, storage_buffer, dual_sourcing, none]
  assumption: No structural protection exists
  flag_when: is not none
  after: [OBS_INPUT_001]
  when:
  - check: OBS_INPUT_001
    is: true
  evidence:
    best: [supply_agreement, audited_annual_report]
    supporting: [internal_memo]
    stated: [call, officer_note]
  ask: 'What protects this supply: a fixed-price or sovereign commitment, a take-or-pay contract, storage you control,
    or a second source?'
- id: OBS_INPUT_MIT_002
  question: Can production switch to an alternative input or alternative plant within one quarter?
  answer: yes_no
  assumption: Substitution is not feasible within a relevant horizon
  disproved_by: 'yes'
  after: [OBS_INPUT_003]
  evidence:
    best: [internal_memo, technical_feasibility]
    stated: [call, officer_note]
  ask: If this input stopped tomorrow, could you keep producing — by switching fuel, plant, or product mix — within
    roughly three months?
- id: OBS_INPUT_MIT_003
  question: What share of earnings is generated by operations NOT dependent on the concentrated input source?
  answer: number
  unit: percent
  assumption: Cash generation is diversified across input sources
  flag_when: below 50
  after: [OBS_INPUT_001]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [internal_memo]
  ask: Of your operating earnings, roughly what share comes from plants or operations that do not rely on the concentrated
    input source?
