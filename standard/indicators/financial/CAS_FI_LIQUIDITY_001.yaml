id: CAS_FI_LIQUIDITY_001
title: FI Liquidity Management
workstream: WS_FIN
due_by: concept
applies_to: [borrower]
applies_when:
- check: OBS_SECTOR_001
  is: financial_institution
- check: OBS_SECTOR_003
  is: true
checks:
- id: OBS_FIL_001
  question: What is the liquid assets ratio?
  answer: number
  unit: percent
  assumption: Institution holds adequate liquid assets relative to liabilities
  due_by: screening
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: What is your current liquid assets ratio — i.e., liquid assets (cash, government securities, central bank
    balances) as a percentage of total deposits or short-term liabilities? The latest prudential return figure would
    be ideal.
- id: OBS_FIL_002
  question: Is the deposit base concentrated in a small number of depositors?
  answer: yes_no
  assumption: Deposit base is diversified and stable
  disproved_by: 'yes'
  after: [OBS_FIL_001]
  look_in: [03.01.a, 08.01.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: Do your top 10 or top 20 depositors account for a significant share of total deposits — for example, more
    than 25%? A deposit concentration analysis showing the breakdown by depositor size bands would be very helpful.
- id: OBS_FIL_003
  question: Is there a material maturity mismatch between assets and liabilities?
  answer: yes_no
  assumption: Asset and liability maturities are reasonably matched
  disproved_by: 'yes'
  after: [OBS_FIL_001]
  look_in: [03.01.a, 08.01.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: Does your institution have a significant maturity mismatch — for example, funding long-term loans with short-term
    deposits? Please share your asset-liability maturity ladder or gap analysis if available.
- id: OBS_FIL_004
  question: Does the institution have access to central bank or lender-of-last-resort facilities?
  answer: yes_no
  assumption: Emergency liquidity backstop is available
  disproved_by: 'no'
  after: [OBS_FIL_001]
  look_in: [04.01.a, 09.01.a]
  evidence:
    best: [regulatory_document, facility_agreement]
    supporting: [internal_memo, management_accounts]
    stated: [call, officer_note]
  ask: Does your institution have access to central bank lending facilities — such as a discount window, repo facility,
    or emergency lending arrangements? Has the institution used these facilities in the past 12 months?
- id: OBS_FIL_005
  question: What is the institution's interbank exposure?
  answer: number
  unit: percent
  assumption: Interbank exposure is manageable and well-monitored
  after: [OBS_FIL_001]
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: What is the size of your interbank placements and borrowings — both as absolute amounts and as a percentage
    of total assets? Are these primarily overnight, short-term, or longer-term? Has interbank exposure been increasing
    or decreasing?
  if_unknown: Interbank exposure data not available
