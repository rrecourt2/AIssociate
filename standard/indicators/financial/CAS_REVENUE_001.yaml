id: CAS_REVENUE_001
title: Revenue Analysis
workstream: WS_FIN
due_by: diligence
applies_to: [borrower, guarantor]
why_it_matters:
  debt: Revenue stability and predictability directly affect debt service capacity
  equity: Revenue growth trajectory affects value creation and exit multiples
matters_more_when:
- check: OBS_CASHFLOW_BASIS_001
  is: contracted
  reason: Contracted cashflow — revenue analysis focuses on counterparty quality and contract terms
- check: OBS_COLLATERAL_001
  is: single_asset
  reason: Single asset — revenue concentration inherent, analysis is critical
- check: OBS_VALUE_CHAIN_001
  is: contractor
  reason: Contractor value chain — project-based revenue needs pipeline analysis
- check: OBS_LIFECYCLE_001
  is: stabilized
  reason: Stabilized — historical revenue track record is key evidence
matters_less_when:
- check: OBS_BORROWER_001
  is: fund_vehicle
  reason: Fund vehicle — revenue analysis less relevant, NAV and portfolio analysis instead
- check: OBS_LIFECYCLE_001
  is: greenfield
  reason: Greenfield — no operating revenue yet, projections indicator more relevant
checks:
- id: OBS_REV_001
  question: Does the entity generate revenue?
  answer: yes_no
  assumption: Entity is pre-revenue
  disproved_by: 'yes'
  due_by: screening
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, management_accounts]
    supporting: [internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Does your company currently earn revenue from selling products or services? A simple yes or no is fine.
- id: OBS_REV_002
  question: What is the primary revenue model?
  answer: choice
  options: [product_sales, services, subscriptions, project_based, mixed]
  assumption: Revenue model is diversified
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a, 01.01.a]
  evidence:
    best: [audited_annual_report, business_plan]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: How does your company primarily earn money? Is it through selling products, providing services, subscription
    fees, project-based contracts, or a mix of these?
- id: OBS_REV_003
  question: Is revenue concentrated in fewer than 3 customers?
  answer: yes_no
  assumption: Revenue base is diversified across customers
  disproved_by: 'yes'
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, internal_memo]
    stated: [correspondence, call, officer_note]
  ask: Do your top 3 customers account for more than half of your total revenue? If you can share a breakdown of
    revenue by customer, that would be very helpful.
  if_unknown: Customer concentration unknown — revenue resilience may be overstated
- id: OBS_REV_004
  question: What is the revenue growth rate over the last 3 years?
  answer: number
  unit: percent
  assumption: Revenue trajectory is stable or growing
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: What has your average annual revenue growth been over the past 3 years? If you can share revenue figures
    for each of the last 3 years, we can calculate this.
- id: OBS_REV_005
  question: Is revenue seasonal?
  answer: yes_no
  assumption: Revenue is evenly distributed throughout the year
  disproved_by: 'yes'
  after: [OBS_REV_001]
  look_in: [03.02.a]
  evidence:
    best: [management_accounts]
    supporting: [audited_annual_report, internal_memo]
    stated: [call, officer_note]
  ask: Does your revenue vary significantly by season or time of year? For example, do you earn most of your revenue
    during certain months or quarters?
- id: OBS_REV_006
  question: Are there contracted or recurring revenue streams?
  answer: yes_no
  assumption: All revenue is transactional / one-off
  disproved_by: 'yes'
  after: [OBS_REV_001]
  look_in: [03.01.a, 10.02.a]
  evidence:
    best: [audited_annual_report, offtake_agreement]
    supporting: [management_accounts, material_contract]
    stated: [call, officer_note]
  ask: Does your company have any long-term contracts, subscriptions, or recurring revenue arrangements that provide
    predictable income? Examples include supply agreements, service contracts, or subscription plans.
- id: OBS_BUYER_CONC_001
  question: Does any single customer account for 10% or more of revenue (IFRS 8 major-customer disclosure)?
  answer: yes_no
  assumption: The revenue base is granular with no major customer
  disproved_by: 'yes'
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
    stated: [call, officer_note]
  ask: 'Do the notes to your audited accounts disclose any customer that represents 10% or more of revenue? Note:
    under IFRS 8 auditors must disclose this — the absence of the disclosure is itself evidence of a granular customer
    base.'
- id: OBS_REC_SECURITY_001
  question: What share of trade receivables is credit-enhanced (bank guarantees, letters of credit, collateral)?
  answer: number
  unit: percent
  assumption: Receivables are substantially credit-enhanced
  flag_when: below 50
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
    stated: [call, officer_note]
  ask: Of the money customers owe you, what share is covered by bank guarantees, letters of credit, or other collateral?
    Your trade receivables note typically splits secured from unsecured.
- id: OBS_REC_GOV_001
  question: What share of total receivables is due from government bodies (subsidies, tax refunds, duties)?
  answer: number
  unit: percent
  assumption: Government receivables are immaterial
  flag_when: above 20
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
    stated: [call, officer_note]
  ask: How much of what you are owed comes from government bodies — unpaid subsidies, tax or duty refunds, or sales
    to state entities — and how old are those balances?
- id: OBS_PREPAY_001
  question: What share of revenue is collected in advance as customer prepayments (contract liabilities)?
  answer: number
  unit: percent
  assumption: Customers do not prefund purchases
  flag_when: above 5
  after: [OBS_REV_001]
  when:
  - check: OBS_REV_001
    is: true
  look_in: [03.01.a]
  evidence:
    best: [audited_annual_report]
    supporting: [management_accounts]
    stated: [call, officer_note]
  ask: Do customers pay you before delivery? Your balance sheet may show this as contract liabilities or advances
    from customers. Roughly what share of a year's sales is prepaid at any time? This is a strength signal — it
    indicates market power and reduces collection risk.
