id: CAS_FI_PORTFOLIO_001
title: Loan Portfolio Quality
workstream: WS_FIN
due_by: diligence
applies_to: [borrower]
applies_when:
- check: OBS_SECTOR_001
  is: financial_institution
- check: OBS_SECTOR_003
  is: true
checks:
- id: OBS_FIP_001
  question: What is the non-performing loan (NPL) ratio?
  answer: number
  unit: percent
  assumption: Asset quality is within acceptable bounds
  due_by: screening
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: What is your current non-performing loan (NPL) ratio — i.e., the percentage of your total loan portfolio
    that is classified as non-performing (typically 90+ days past due)? The latest prudential return or audited
    financials would be ideal.
- id: OBS_FIP_002
  question: Is the provisioning level adequate relative to NPLs?
  answer: yes_no
  assumption: Loan loss provisions adequately cover non-performing exposures
  disproved_by: 'no'
  after: [OBS_FIP_001]
  when:
  - check: OBS_FIP_001
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: What is your provision coverage ratio — i.e., total loan loss provisions as a percentage of non-performing
    loans? A ratio above 100% indicates full coverage. Please share the breakdown by loan classification category
    if available.
- id: OBS_FIP_003
  question: Is the loan portfolio concentrated by sector, geography, or single borrower?
  answer: yes_no
  assumption: Portfolio is diversified across sectors, geographies, and borrowers
  disproved_by: 'yes'
  after: [OBS_FIP_001]
  when:
  - check: OBS_FIP_001
    is: true
  look_in: [03.01.a, 08.01.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, company_record]
    stated: [call, officer_note]
  ask: Is your loan portfolio concentrated in any single sector (e.g., agriculture, real estate), geographic region,
    or individual borrower? Specifically, does any single sector exceed 25% of the portfolio, or any single borrower
    exceed 10%? Portfolio segmentation data would be very helpful.
- id: OBS_FIP_004
  question: What is the volume and trend of restructured loans?
  answer: number
  unit: percent
  assumption: Restructured loans are not masking underlying asset quality deterioration
  after: [OBS_FIP_001]
  when:
  - check: OBS_FIP_001
    is: true
  look_in: [03.01.a, 03.02.a]
  evidence:
    best: [audited_annual_report, regulatory_document]
    supporting: [management_accounts, internal_memo]
    stated: [call, officer_note]
  ask: What percentage of your loan portfolio has been restructured in the past 12 months? Has this percentage been
    increasing or decreasing over time? Please include the criteria you use for classifying a loan as restructured.
  if_unknown: Restructured loan data not available
- id: OBS_FIP_005
  question: Does the entity have a documented write-off policy?
  answer: yes_no
  assumption: Write-off practices follow a formal, documented policy
  disproved_by: 'no'
  after: [OBS_FIP_001]
  when:
  - check: OBS_FIP_001
    is: true
  look_in: [08.01.a, 03.01.a]
  evidence:
    best: [corporate_governance_policy, audited_annual_report]
    supporting: [internal_memo, board_minutes]
    stated: [call, officer_note]
  ask: Does your institution have a formal, documented policy for writing off non-performing loans? What are the
    criteria and approval thresholds? Please share a copy of the write-off policy or the relevant section of your
    credit policy manual.
