name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  attach-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match plugin.json
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")"
      - run: python3 scripts/package.py
      - name: Attach both ZIPs to the release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
