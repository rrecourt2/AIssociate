[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aissociate"
description = "The tool of the AIssociate plugin: keeps the record of an investment deal against the Bankability DDQ."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
dynamic = ["version"]

[project.scripts]
aissociate = "aissociate.__main__:main"

[tool.setuptools]
packages = ["aissociate"]

[tool.setuptools.dynamic]
version = {attr = "aissociate.__version__"}

[tool.setuptools.package-data]
aissociate = ["standard.json", "wiki.html"]
