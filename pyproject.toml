[project]
name = "aissociate"
version = "0.5.6"
requires-python = ">=3.9"
dependencies = []  # tools/ use the Python standard library only

[dependency-groups]
dev = ["pytest>=8", "python-docx>=1.1", "openpyxl>=3.1"]  # independent readers for tests only

[tool.pytest.ini_options]
pythonpath = ["tools", "scripts"]
testpaths = ["tests"]
