<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiki</title>
<!-- The wiki of one deal, in one file. It loads nothing: the pages and the record are in the script at the foot.
     The tool writes this file each time it runs `pages`. Change the pages, not this file. -->
<style>
:root { --paper: #fbfaf6; --ink: #22262b; --soft: #6a6f76; --line: #e4e0d6; --tint: #f2efe6; --mark: #1d5c57;
  --text: Charter, "Bitstream Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --plain: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --paper: #1a1b1d; --ink: #dddbd3; --soft: #9b9a93; --line: #34363a; --tint: #232528; --mark: #86c8c0; } }
* { box-sizing: border-box; }
body { margin: 0; display: grid; grid-template-columns: 17rem minmax(0, 1fr) auto; min-height: 100vh;
  background: var(--paper); color: var(--ink); font: 1.0625rem/1.65 var(--text); }
a { color: var(--mark); text-decoration-thickness: 1px; text-underline-offset: 0.15em; }
nav, #card { position: sticky; top: 0; height: 100vh; overflow-y: auto; font: 0.875rem/1.45 var(--plain); }
nav { padding: 1.75rem 1.25rem; border-right: 1px solid var(--line); }
nav strong { display: block; font: 600 1.15rem/1.3 var(--text); }
nav small, nav h2, nav p { color: var(--soft); }
nav input { width: 100%; margin: 1rem 0 0.5rem; padding: 0.45rem 0.6rem; font: inherit; color: inherit;
  background: transparent; border: 1px solid var(--line); border-radius: 6px; }
nav input:focus { outline: 2px solid var(--mark); outline-offset: -1px; }
nav h2 { margin: 1.25rem 0 0.25rem; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
nav a { display: block; margin: 0 -0.5rem; padding: 0.25rem 0.5rem; border-radius: 5px; color: inherit; text-decoration: none; }
nav a:hover, nav a.here { background: var(--tint); } nav a.here { color: var(--mark); font-weight: 600; }
nav a span { display: block; color: var(--soft); font-size: 0.8rem; font-weight: 400; }
mark { background: none; color: var(--mark); font-weight: 600; }
main { max-width: 46rem; margin-left: clamp(0rem, 5vw, 5rem); padding: 2.5rem 2.25rem 6rem; overflow-wrap: break-word;
  container-type: inline-size; }
h1, h2, h3, h4 { font-weight: 600; line-height: 1.25; margin: 2.2rem 0 0.6rem; }
h1 { font-size: 2rem; margin-top: 0; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; } h3, h4 { font-size: 1.08rem; }
p, ul, ol, blockquote, .wide, .tool { margin: 0 0 1rem; }
ul, ol { padding-left: 1.3rem; } li { margin: 0.3rem 0; } li ul, li ol { margin-bottom: 0; }
code { font: 0.86em ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--tint); padding: 0.1em 0.3em;
  border-radius: 4px; }
blockquote { padding-left: 1rem; border-left: 3px solid var(--line); color: var(--soft); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; } .wide { overflow-x: auto; }
table { border-collapse: collapse; font: 0.85rem/1.45 var(--plain); font-variant-numeric: tabular-nums; }
th, td { padding: 0.4rem 0.9rem 0.4rem 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { color: var(--soft); font-weight: 600; }
.tool { padding: 0.6rem 1.1rem; background: var(--tint); border-radius: 8px; font-size: 0.94rem; }
.tool summary { color: var(--soft); font: 600 0.7rem var(--plain); letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; }
.tool[open] summary { margin-bottom: 0.6rem; }
.cites { color: var(--soft); font: 0.78em var(--plain); white-space: nowrap; }
a.cite { color: inherit; cursor: pointer; white-space: nowrap; text-decoration: underline dotted; }
a.cite:hover { color: var(--mark); }
#card { width: 21rem; padding: 1.75rem 1.25rem; border-left: 1px solid var(--line); overflow-wrap: anywhere; }
#card h2 { margin: 0 0 0.75rem; font: 600 1rem var(--plain); } #card h2 small { color: var(--soft); font-weight: 400; }
#card p { font: 1rem/1.5 var(--text); } #card dd { margin: 0; overflow-wrap: anywhere; }
#card dt { margin-top: 0.7rem; color: var(--soft); font-size: 0.75rem; }
#card button { float: right; border: 0; background: none; color: var(--soft); font-size: 1.3rem; line-height: 1; cursor: pointer; }
main.broad { max-width: 78rem; }
.filters { position: sticky; top: 0; z-index: 1; margin: 0 -0.5rem 1rem; padding: 0.6rem 0.5rem 0.2rem; background: var(--paper); }
.filters button { margin: 0 0.4rem 0.4rem 0; padding: 0.3rem 0.8rem; font: 0.82rem var(--plain); color: inherit; cursor: pointer;
  background: transparent; border: 1px solid var(--line); border-radius: 999px; }
.filters button.on { background: var(--mark); border-color: var(--mark); color: var(--paper); }
.filters small { opacity: 0.75; }
.state { padding: 0.1rem 0.55rem; border-radius: 999px; background: var(--tint); white-space: nowrap; font-size: 0.78rem; }
tr[data-group="To answer"] .state { background: #f4e2b8; color: #5b4300; }
tr[data-group="Answered"] .state { background: #d6ebda; color: #1d4d2b; }
tr[data-group="Waiting"] .state { background: #dee6f0; color: #2b4462; }
tr.against .state { background: #f4d3ce; color: #6d1e15; }
.checks table { width: 100%; table-layout: fixed; }
.checks th:nth-child(1) { width: 7rem; } .checks th:nth-child(3) { width: 17%; } .checks th:nth-child(4) { width: 21%; }
.checks th:nth-child(5) { width: 7rem; } .checks th:nth-child(6) { width: 6.5rem; }
@container (max-width: 62rem) {  /* no room for six columns: each check is a block, its cells under one another with their names */
  .checks table, .checks tbody, .checks tr, .checks td { display: block; }
  .checks tr { padding: 0.8rem 0; border-bottom: 1px solid var(--line); }
  .checks td { max-width: 48rem; padding: 0.1rem 0; border: 0; }
  .checks td:nth-child(2) { margin: 0.35rem 0; font-size: 0.95rem; }
  .checks td:nth-child(n+3)::before { content: attr(data-label) ": "; color: var(--soft); }
  .checks td:nth-child(n+5) { display: inline-block; margin-right: 1.5rem; }
  .checks thead, .checks tr[hidden], .checks td[data-empty] { display: none; } }
#toggle { display: none; }
@media (max-width: 85rem) {  /* no room for a third column: the record that was asked for comes up from the foot */
  #card { position: fixed; inset: auto 0 0 17rem; width: auto; height: auto; max-height: 50vh; z-index: 2; background: var(--paper);
    border: 0; border-top: 1px solid var(--line); box-shadow: 0 -8px 24px rgb(0 0 0 / 0.1); } }
@media (max-width: 60rem) {  /* a narrow window: the menu folds away above the page */
  body { display: block; } main { margin: 0 auto; padding: 1.5rem 1.25rem 4rem; } #card { left: 0; }
  nav { position: static; height: auto; padding: 1rem 1.25rem; border: 0; border-bottom: 1px solid var(--line); }
  #toggle { display: block; float: right; padding: 0.3rem 0.8rem; font: inherit; color: inherit; cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; }
  nav:not(.open) #search, nav:not(.open) #menu { display: none; } }
@media print { nav, #card, .filters { display: none; } body { display: block; } }
</style>
</head>
<body>
<nav><button id="toggle" aria-expanded="false">Menu</button><strong id="deal"></strong><small id="as-of"></small>
  <input id="search" type="search" placeholder="Search the pages" aria-label="Search the pages"><div id="menu"></div></nav>
<main id="page"></main>
<aside id="card" hidden></aside>
<script id="data" type="application/json">{{DATA}}</script>
<script>
"use strict";
const data = JSON.parse(document.getElementById("data").textContent);
const TABLES = {sources: "source", facts: "fact", subjects: "subject", links: "link", decisions: "decision", questions: "question"};
const ID = /\b[A-Z]-\d{3,}\b/g, ITEM = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const decode = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
const encoded = path => path.split("/").map(encodeURIComponent).join("/");
const table = id => Object.keys(TABLES).find(name => data[name][id]);
const cite = (id, more = "") => table(id) ? `<a class="cite" tabindex="0" data-id="${id}">${id}${more}</a>` : id;

// The pages: for each path from the wiki folder, its title, its text without the top lines, and its shelf.
const pages = {};
for (const [path, raw] of Object.entries(data.pages)) {
  const top = /^---\n([\s\S]*?)\n---\n?/.exec(raw), text = top ? raw.slice(top[0].length) : raw;
  const title = (top && /^title:[ \t]*["']?(.*?\S)["']?[ \t]*$/m.exec(top[1]) || /^#\s+(.+)$/m.exec(text) || [0, path])[1];
  const shelf = ["index.md", "sources.md", "checks.md", data.documents, ...data.drafts].includes(path) ? "" : path.includes("/") ? path.split("/")[0] : "other";
  pages[path] = {title, text, shelf};
}
let here = "index.md";  // the page that is open

function resolve(from, href) {  // where a relative link on a page leads, as a path from the wiki folder
  const parts = from.split("/").slice(0, -1);
  for (const part of decode(href.split("#")[0]).split("/")) {
    if (part === ".." && parts.length && parts[parts.length - 1] !== "..") parts.pop();
    else if (part && part !== ".") parts.push(part);
  }
  return parts.join("/").replace(/^\.\.\/wiki\//, "");  // a draft that links back into the wiki
}

function link(words, href) {  // another page opens in this view, a document or a website in a new tab
  if (/^(https?|mailto):/i.test(href)) return `<a href="${esc(href)}" target="_blank" rel="noopener">${words}</a>`;
  const path = resolve(here, href);
  return pages[path] ? `<a href="#${encoded(path)}">${words}</a>` : `<a href="./${encoded(path)}" target="_blank">${words}</a>`;
}

function inline(text) {  // code, links, bold, italic and citations within one line
  const kept = [], keep = html => `\u0001${kept.push(html) - 1}\u0001`;  // set aside, so that nothing below touches it
  text = text.replace(/`([^`]+)`/g, (_, code) => keep(`<code>${esc(code)}</code>`))
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, words, href) => keep(link(esc(words), href)));
  return esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/\[[A-Z]-\d{3,}(, ?[A-Z]-\d{3,})*\]/g, '<span class="cites">$&</span>').replace(ID, id => cite(id))
    .replace(/\u0001(\d+)\u0001/g, (_, n) => kept[n]);
}

function rows(lines) {  // a table: the first line is its head, the second only separates
  const row = (line, tag) => "<tr>" + line.trim().replace(/^\||\|$/g, "").split("|")
    .map(cell => `<${tag}>${inline(cell.trim())}</${tag}>`).join("") + "</tr>";
  return `<div class="wide"><table><thead>${row(lines[0], "th")}</thead><tbody>` +
    lines.slice(2).map(line => row(line, "td")).join("") + "</tbody></table></div>";
}

function items(lines) {  // a list, with lists inside it by how far their items are indented
  const open = [];
  let html = "";
  for (const line of lines) {
    const item = ITEM.exec(line);
    if (!item) { html += " " + inline(line.trim()); continue; }  // the item above goes on
    const indent = item[1].length, tag = /\d/.test(item[2]) ? "ol" : "ul";
    while (open.length && open[open.length - 1][0] > indent) html += `</li></${open.pop()[1]}>`;
    if (open.length && open[open.length - 1][0] === indent) html += "</li>";
    else { open.push([indent, tag]); html += `<${tag}>`; }
    html += "<li>" + inline(item[3]);
  }
  while (open.length) html += `</li></${open.pop()[1]}>`;
  return html;
}

function render(text) {  // the Markdown the pages use, block by block
  const lines = text.split("\n"), out = [];
  const take = more => {  // the line at hand, and the lines after it that go with it
    const got = [lines[at++]];
    while (at < lines.length && more(lines[at])) got.push(lines[at++]);
    return got;
  };
  let at = 0;
  while (at < lines.length) {
    const line = lines[at], head = /^(#{1,6})\s+(.*)$/.exec(line);
    if (!line.trim()) at++;
    else if (/^<!--.*-->\s*$/.test(line)) {  // the tool's markers frame its part of the page. Other comments stay hidden
      out.push(/tool:begin/.test(line) ? '<details class="tool"><summary>From the record</summary>'
        : /tool:end/.test(line) ? "</details>" : "");
      at++;
    } else if (head) {
      out.push(`<h${head[1].length}>${inline(head[2])}</h${head[1].length}>`);
      at++;
    } else if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) {
      out.push("<hr>");
      at++;
    } else if (line.startsWith(">")) {
      out.push(`<blockquote>${render(take(l => l.startsWith(">")).map(l => l.replace(/^> ?/, "")).join("\n"))}</blockquote>`);
    } else if (line.startsWith("|") && /^\|[\s:|-]*-[\s:|-]*$/.test(lines[at + 1] || "")) {
      out.push(rows(take(l => l.startsWith("|"))));
    } else if (ITEM.test(line)) {
      out.push(items(take(l => ITEM.test(l) || /^\s+\S/.test(l))));
    } else {
      out.push(`<p>${inline(take(l => l.trim() && !/^(#{1,6}\s|>|\||<!--)/.test(l) && !ITEM.test(l)).join(" "))}</p>`);
    }
  }
  return out.join("");
}

function card(id) {  // what the record holds under an ID: a fact with its value, its date, its source and the place in it
  const record = data[table(id)][id], lines = [];
  const plain = v => v === true ? "yes" : v === false ? "no" : Array.isArray(v) ? v.map(plain).join("; ")
    : v && typeof v === "object" ? Object.values(v).map(plain).join(": ")
    : typeof v === "number" && Math.abs(v) >= 10000 ? v.toLocaleString("en-GB") : String(v);  // a year stays as it is
  const named = v => esc(plain(v)).replace(ID, i => cite(i, table(i) === "subjects" ? " " + esc(data.subjects[i].name || "") : ""));
  const page = /\bpp?(?:ages?|\.)\s*(\d+)/i.exec(record.place || "");  // a PDF opens at the page that the place names
  const file = (path, at = "") => `<a href="../../${encoded(path)}${at}" target="_blank">${esc(path)}</a>`;  // from the wiki folder
  const main = ["statement", "title", "name", "decision", "text"].find(key => record[key]);
  for (const [key, value] of Object.entries(record)) {
    if (["rev", "fingerprint", "label", "unit", main].includes(key) || value == null || value === "" || value === "current") continue;
    let html = key === "where" || key === "extract" ? file(value) : named(value);
    if (key === "value") html = esc(record.label ? record.label + ": " : "") + html + " " + esc(record.unit || "");
    const source = key === "source" && data.sources[value];
    const pdf = /PDF\s+pp?(?:ages?|\.)?\s*(\d+)/i.exec(record.place || "");  // a place may name the page of the PDF itself
    const at = pdf ? pdf[1] : page && Number(page[1]) + (source && source.page_offset || 0);  // if not, it is a printed page
    if (source) html += [" " + esc(source.title) + (source.date ? ", " + esc(source.date) : ""),
      source.where && file(source.where, page ? "#page=" + at : ""), source.extract && file(source.extract)]
      .filter(Boolean).join("<br>");
    lines.push(`<dt>${esc(key[0].toUpperCase() + key.slice(1).replace(/_/g, " "))}</dt><dd>${html}</dd>`);
  }
  el("card").innerHTML = `<button aria-label="Close">&times;</button><h2>${id} <small>${TABLES[table(id)]}</small></h2>` +
    (main ? `<p>${named(record[main])}</p>` : "") + (data.where[id] ? `<a href="#${encoded(data.where[id])}">Open its page</a>` : "") +
    `<dl>${lines.join("")}</dl>`;
  el("card").hidden = false;
}

const bare = text => text.replace(/<!-- tool:begin sources -->[^]*?<!-- tool:end -->/g, " ").replace(/<!--.*?-->/g, " ").replace(/\]\([^)]*\)/g, "]").replace(/[*#|`>\[\]]+/g, " ")
  .replace(/\s+/g, " ");  // the words of a page without its Markdown, for the search
const starts = word => new RegExp("(?<![\\p{L}\\p{N}])" + word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "iu");  // at the start of a word

function menu() {  // the pages by shelf, or the pages that hold the words searched for
  const words = el("search").value.split(/\s+/).filter(Boolean);  // a page must hold each of them, at the start of a word
  const entry = (path, name) => {
    const text = bare(pages[path].text), hit = words.length ? text.search(starts(words[0])) : -1;
    const near = hit < 0 ? "" : " <span>" + esc(text.slice(Math.max(0, hit - 30), hit)) + "<mark>" +
      esc(text.substr(hit, words[0].length)) + "</mark>" + esc(text.substr(hit + words[0].length, 50)) + "</span>";
    return `<a href="#${encoded(path)}"${path === here ? ' class="here"' : ""}>${esc(name || pages[path].title)}${near}</a>`;
  };
  const shown = Object.keys(pages).filter(path => words.every(word => starts(word).test(pages[path].title + "\n" + bare(pages[path].text))));
  const shelf = name => {
    const paths = shown.filter(path => pages[path].shelf === name);
    return paths.length ? `<h2>${esc(data.shelves[name] || name)}</h2>` + paths.map(path => entry(path)).join("") : "";
  };
  const shelves = [...new Set([...Object.keys(data.shelves), ...shown.map(path => pages[path].shelf)])].filter(Boolean);
  el("menu").innerHTML = words.length ? shown.map(path => entry(path)).join("") || "<p>No page holds these words.</p>"
    : entry("index.md", "Contents") + entry("sources.md", "Sources") + entry(data.documents, "Documents") +
      shelves.map(shelf).join("") + (data.drafts.length ? "<h2>Drafts</h2>" + data.drafts.map(path => entry(path)).join("") : "") +
      (pages["checks.md"] ? "<h2>Checks</h2>" + entry("checks.md", "The due diligence list") : "");
}

const GROUPS = {"To answer": ["open", "contested"], "Waiting": ["waiting"], "Answered": ["answered"],
  "Not relevant or off": ["not relevant", "off", "parked"]};
let chosen = "To answer";  // the states that show on the page of checks, kept while the reader looks at other pages

function filters(rows) {  // on a page of checks: a mark on each state, and buttons that choose which states show
  const marked = tr => {  // a row of the checks that were marked for this deal: it shows whatever is chosen, and is counted further down
    let node = tr.closest(".wide");
    while (node && !/^H[1-3]$/.test(node.tagName)) node = node.previousElementSibling;
    return Boolean(node) && node.textContent === "What matters most";
  };
  for (const tr of rows) {
    tr.dataset.group = Object.keys(GROUPS).find(name => GROUPS[name].includes(tr.cells[0].textContent.split(",")[0]));
    tr.cells[0].innerHTML = `<span class="state">${tr.cells[0].innerHTML}</span>`;
    tr.classList.toggle("against", /\(against the claim\)/.test(tr.textContent));
    tr.dataset.count = tr.cells[2].textContent.split("; ").length;  // a row may stand for several subjects: one a line
    tr.cells[2].innerHTML = tr.cells[2].innerHTML.split("; ").join("<br>");
    const heads = [...tr.closest("table").querySelectorAll("th")].map(th => th.textContent);  // each cell carries the name of its
    [...tr.cells].forEach((td, i) => td.textContent.trim() ? td.dataset.label = heads[i] : td.dataset.empty = "");  // column
    tr.closest(".wide").classList.add("checks");
  }
  rows = rows.filter(tr => !marked(tr));
  const bar = document.createElement("p"), count = name => rows.filter(tr => name === "All" || tr.dataset.group === name)
    .reduce((sum, tr) => sum + Number(tr.dataset.count), 0);
  bar.className = "filters";
  bar.innerHTML = [...Object.keys(GROUPS), "All"].map(name => `<button data-show="${name}">${name} <small>${count(name)}</small></button>`).join("");
  el("page").querySelector("h1").after(bar);
  const choose = name => {
    chosen = name;
    for (const button of bar.children) button.classList.toggle("on", button.dataset.show === name);
    for (const tr of rows) tr.hidden = name !== "All" && tr.dataset.group !== name;
    for (const wide of new Set(rows.map(tr => tr.closest(".wide")))) {  // a table with no row left goes, with its claim and its heading
      const empty = !wide.querySelector("tbody tr:not([hidden])");
      for (let node = wide; node && !node.matches("h1, h2, .filters"); node = node.previousElementSibling) {
        node.hidden = empty;  // never the title of the page, the heading of a part or the buttons themselves
        if (node.tagName === "H3") break;
      }
    }
  };
  bar.addEventListener("click", event => event.target.closest("button") && choose(event.target.closest("button").dataset.show));
  choose(chosen);
}

function show() {  // open the page that the address names, or the contents page
  const asked = decode(location.hash.slice(1));
  here = pages[asked] ? asked : "index.md";
  el("page").innerHTML = render(pages[here].text);
  for (const part of el("page").querySelectorAll(".tool")) {  // an empty part goes, a short one stays open
    if (part.children.length < 2) part.remove();
    else part.open = part.querySelectorAll("li, tr").length <= 3;
  }
  const states = here === "checks.md" ? [...el("page").querySelectorAll("tbody tr")]
    .filter(tr => tr.closest("table").querySelector("th").textContent === "State") : [];
  el("page").classList.toggle("broad", states.length > 0);
  if (states.length) filters(states);
  el("card").hidden = true;
  document.querySelector("nav").classList.remove("open");
  document.title = `${pages[here].title} | ${data.name}`;
  menu();
  window.scrollTo(0, 0);
}

el("deal").textContent = data.name;
el("as-of").textContent = `The record at revision ${data.revision}`;
el("search").addEventListener("input", menu);
el("toggle").addEventListener("click", () => el("toggle").setAttribute("aria-expanded", document.querySelector("nav").classList.toggle("open")));
document.addEventListener("click", event => {
  const cited = event.target.closest("a.cite");
  if (cited) card(cited.dataset.id);
  else if (event.target.closest("#card button")) el("card").hidden = true;
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") el("card").hidden = true;
  if (event.key === "Enter" && event.target.matches("a.cite")) card(event.target.dataset.id);
});
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
